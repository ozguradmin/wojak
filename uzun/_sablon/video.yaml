# UZUN VIDEO ŞABLONU (YouTube, 16:9) — kopyala: cp -r uzun/_sablon uzun/<id>  ve aşağıyı doldur.
# Kararlar: docs/UZUN_FORMAT.md (8-10 dk, 1920x1080 30 fps, -14 LUFS, Murat anlatıcı + Aylin ikinci ses,
# en geç 4-6 sn'de bir ekranda yeni bir şey). Motor başvurusu: docs/UZUN_MOTOR.md. Çalışan örnek: uzun/demo/.
#
#   python -m wojak uzun kontrol    uzun/<id>        # zaman çizelgesi + hareket/bölüm/altyazı denetimi
#   python -m wojak uzun seslendir  uzun/<id> --qa   # Cartesia TTS (önbellekli) + Whisper isim denetimi
#   python -m wojak uzun onizle     uzun/<id> [--bas 1:10 --bit 2:00]
#   python -m wojak uzun render     uzun/<id>        # out/<id>/<id>.mp4 + .srt + anlatım izi + olcum.json
#   python -m wojak uzun kucukresim uzun/<id>
#   python -m wojak uzun teslim     uzun/<id>        # teslim/<id>-uzun/
#
# YOLLAR: önce bu klasöre, sonra repo köküne göre çözülür (episodes/... görselleri doğrudan kullanılabilir).
# TELİFLİ görseller img/telifli/ altına (git'e girmez). Videolar git'e girmez.
# ZAMAN: sahnenin süresi satırlarının sesinden hesaplanır (bas + satır + ara + satır + ... + son);
#   olay ve efektler bir satıra (satir: 1'den başlar) + ofset (sn) ile çapalanır; satır vermezsen t: (sahne başına göre sn).
# Türkçe anahtarlar; YAML'da 'on/off/yes/no' kelimelerini tırnaksız değer olarak yazma (true/false'a döner).

id: sablon                       # klasör adıyla aynı: küçük harf, rakam, - _
baslik: "Videonun asıl başlığı"  # paylasim.md'de 1. alternatif

# Cartesia sonic-3 sesleri (varsayılanlar zaten bunlar; yeni ses eklemek için ad: kimlik)
sesler:
  murat: 5a31e4fb-f823-4359-aa91-82c0ae9a991c   # anlatıcı (Türkçe derin erkek)
  aylin: bb2347fe-69e9-4810-873f-ffd759fe8420   # alıntı, reklam sloganı, kadın karakter
  leyla: fa7bfcdc-603c-4bf1-a600-a371400d2f8c   # ifadeli kadın (duygusal tanıklık)
  azra: 0f95596c-09c4-4418-99fe-5c107e0713c0    # resmî kadın
anlatici: {ses: murat, hiz: 0.95}   # düz metin satırları bu sesle okunur

# Yalnız TTS'e giden metinde uygulanan yazım düzeltmeleri (altyazı ve ekranda asıl yazım kalır).
# Kelime sınırına bakar: "Contergan'ın" da düzelir, "Contergani" düzelmez.
telaffuz:
  Contergan: Kontergan
  Widukind Lenz: Vidukind Lents

qa:                                # seslendir --qa: bu isimler (ve telaffuz anahtarları) duyulmazsa rapor
  isimler: [Kaymakçalan, Süreyya Tahsin Aygün]

# Müzik: kendi sentezimiz (Do minör, drone + seyrek vals motifi, videonun süresi kadar, döngü yok).
#   seviye: konuşma varken anlatıma göre dB (UZUN_FORMAT: ~-22); acik: konuşma yokken (kartlar, aralar)
#   başka bir dosya: {dosya: assets/music/x.mp3, seviye: -22}; müziksiz: muzik: false
muzik: {uret: true, tohum: 1957, seviye: -22, acik: -15}

zamanlama:                         # hepsi isteğe bağlı (varsayılanlar gösterildi)
  bas: 0.35                        # sahne başı -> ilk satır
  ara: 0.35                        # satırlar arası
  son: 0.55                        # son satırdan sonra
  min_sahne: 2.0                   # satırlı sahnenin en kısa süresi
  kart: 2.6                        # bölüm kartı
  sabit: 3.0                       # satırsız sahne
  max_bos: 6.0                     # kontrol: bu kadar sn ekranda yeni bir şey yoksa uyar
  bindirme: 1.2                    # bindirme bölüm kartının süresi

gecis: kesme                       # varsayılan sahne geçişi: kesme | gecis (8 kare crossfade) | kaydir (10 kare push)
                                   # | karart (10 kare karanlıktan geçiş: aynı karakter / yazıdan yazıya / parlaklık sıçraması)
filigran: tarihselwojak            # sağ altta her karede (false: kapalı)
otomatik_sfx: true                 # sahne tipine göre efektler (whoosh, deklanşör, daktilo, kalem, pop, boom...)
kart_bindirme: true                # bölüm kartları önceki sahnenin donmuş, kararmış karesi üstünde (siyah ekran yok);
                                   # false: klasik siyah kart (2,6 sn). Bölümde kart_bindirme ile tek tek değişir.
# Elle eklenebilecek efektler (sahnenin sfx listesi): turkiye (Türkiye ses motifi), turkiye_major, kapi, geri_sarma,
# telefon, raptiye, damga, gecis, marka, boom, hit, riser, drone, heartbeat, static, klik, zil (assets/sfx/<ad>.wav)

# HAREKET DİLİ (7. tur; hepsi isteğe bağlı, varsayılanlar gösterildi). Ayrıntı: docs/UZUN_MOTOR.md §3 "Hareket dili".
hareket:
  bulaniklik: true      # hızlı giriş/çıkış, kayan isim etiketi, düşen fotoğraf, itme geçişi: hareket bulanıklığı;
                        # hızlı sayan sayaç tekerlek gibi yuvarlanır (rakamlar her karede titreşmez)
  ikincil: true         # yandan giren karakter kayıp dururken eğilir ve yaylanarak oturur; alttan girende esneme;
                        # inen fotoğraf baskısının / pano kartının gölgesi havadayken uzak ve yumuşak
  canli: true           # karakter başına farklı nefes/salınım ritmi + çok hafif baş eğimi (dekorda karakter: canli: false)
  paralaks: 0.0         # wojak sahnesinde arka plan kamerayı daha az izler (öneri 0.3-0.45); masaya "konmuş" nesne
                        # karakter olarak çiziliyorsa o sahnede kamera: {paralaks: 0}
  doku: false           # wojak sahnesinde arka plana gren + toz (true | {gren: 0.035, toz: 18}); sahne `doku` ile değişir

bolumler:
  # ---------------------------------------------------------------- 1. bölüm: soğuk açılış (kartsız)
  - baslik: Soğuk açılış
    youtube: "Giriş"               # açıklamadaki bölüm adı (verilmezse baslik). İlk bölüm 0:00'dan başlar.
    kart: false                    # ilk bölüm varsayılan kartsız; sonrakiler kartlı
    sahneler:
      # WOJAK: gerçek fotoğraf + Ken Burns + 1-3 karakter (kenardan kayarak girer, nefes alır, içeri bakar).
      # Kamera arka planı ve karakterleri birlikte taşır; biri konuşurken (balon/konusan) ona doğru hafifçe yaklaşır.
      - tip: wojak
        arka: img/mekan.jpg
        kirp: [0.0, 0.0, 0.9, 1.0]           # isteğe bağlı: fotoğrafın istenmeyen kenarını at (0..1)
        kamera: {zoom: [1.0, 1.07], merkez: [[0.5, 0.5], [0.46, 0.46]], it: 0.05, odak: 0.4}   # it: 0 = itme yok
        karart: 0.12                         # bulanik: 1.6 (px), doygunluk: 0.85, vinyet: 0.42 (düz zeminde yakın çekim: 0.8)
        etiket: "ANKARA · 1960"              # sol altta daktiloyla yazılan yer-tarih etiketi (isteğe bağlı)
        muzik_db: -6                         # bu sahnede müzik kısık (0 = normal, +6 = açık)
        muzik_mod: gerilim                   # bu sahneden itibaren müzik kipi: drone | nabiz | gerilim | major
        kose: {metin: "GÜN {} / 12", deger: 0}   # köşe göstergesi (konum: sag_ust | sol_ust | sag_alt | sol_alt)
        # kamera: {paralaks: 0.4} bu sahnede arka plan kamerayı daha az izler; doku: true -> arka plana gren + toz
        karakterler:
          - {id: a, gorsel: chars/a.png, taraf: sol}           # boy: 0.66 (kare yüksekliğine oran)
          - {id: b, gorsel: chars/b.png, taraf: sag, giris: false}   # giris: false = baştan yerinde
          - {id: c, gorsel: chars/c.png, x: 0.52, derinlik: 0.6}     # arkada: küçük, sisli, önce çizilir
          - {id: d, gorsel: img/cizim/kapi.png, x: 0.8, canli: false, yon: pop}   # dekor/nesne: nefes ve eğim yok;
            # yon: sol | sag | alt | ust | pop (yerinde büyüyerek belirir; havadaki nesne ortasından büyür)
        satirlar:
          - "Anlatıcının ilk cümlesi."                         # düz metin = anlatıcı
          - {ses: aylin, metin: "Alıntı ya da kadın karakter.", duygu: content, balon: a}   # balon: a'nın balonunda, a seker
          - {metin: "Karakterin balonsuz sözü.", konusan: b}  # b satır boyunca hece başlarında seker
          - {metin: "Uzun bir duraklamadan sonra.<break time=\"600ms\"/> Devam.", once: 0.8}
          - {metin: "Vurgu cümlesi: Türkiye.", sonra: 0.5, db: 1.0}   # sonra: vurgudan sonra nefes; db: ek kazanç
        olaylar:
          - {tip: giris, karakter: b, satir: 2}                         # b bu satırda kayarak girer
          - {tip: balon, karakter: b, metin: "Yalnız görsel replik", satir: 3, ofset: 0.3, sure: 2.5}
            # agiz: chars/b_konusuyor.png -> balon açıkken hecelerde açık ağızlı yüz (aynı tuval); 11. tur:
            # agiz: [chars/b_konusuyor_yari.png, chars/b_konusuyor.png] -> kapalı -> yarık -> açık (en az 4 kare)
          - {tip: yuz, karakter: a, gorsel: chars/a_terli.png, satir: 3, ofset: 0.5}   # yüz varyantı + sıkışma
            # (buyu: true -> yeni görsel eski boyundan büyüyerek oturur; sik: false -> sıkışmasız)
          - {tip: it, satir: 3, an: son, guc: 0.08, sure: 0.5}            # kamera vurgu itmesi (x/y: hedef; kalıcı)
          - {tip: kelime, metin: "REÇETESİZ", satir: 1, konum: ust}        # vurgu kelimesi (ust | orta | alt)
          - {tip: isim, karakter: a, ad: "Ad Soyad", unvan: "Unvan (1900-1980)", satir: 1, ofset: 0.8}
            # yerini kendisi seçer: karakterlerden 40 px uzak (gerekirse yanına, boş tarafa, iki satıra, küçük);
            # sığmazsa kontrol uyarır -> ad/unvanı kısalt
          - {tip: cikis, karakter: b, satir: 3, an: son}
          - {tip: damga, metin: "RUHSAT VERİLMEDİ", satir: 4, ofset: 0.3, x: 0.5, y: 0.3}   # renk, aci, boy, sure,
            # kontur: true (desenli/koyu zeminde beyaz kenar)
          - {tip: kose, deger: 5, satir: 4}                    # köşe göstergesi sayarak 5'e
          - {tip: muzik, db: -12, satir: 4}                    # müzik bu andan itibaren incelir
        sfx:   # konuşma sürerken efektler anlatımın 9 dB altına kısılır: vurgu efektini cümle BİTİŞİNE çapala
          - {ad: hit, satir: 3, an: son, ofset: 0.05, db: -8}  # assets/sfx/<ad>.wav ya da dosya yolu
          - {ad: turkiye, satir: 5, an: son, ofset: 0.05, db: -11}   # Türkiye ses motifi (kelimenin üstüne değil)

      # MARKA: ~1,8 sn kanal imzası (soğuk açılıştan sonra); yazı sonunda filigranın yerine uçar
      - tip: marka
        bindirme: true                 # önceki sahnenin donmuş karesi üstünde (yoksa koyu zemin)

      # FOTO: arşiv fotoğrafı "masaya konmuş baskı" (beyaz kenar, gölge, eğik), kayarak düşer, yavaşça büyür
      - tip: foto
        gorsel: img/arsiv.jpg
        etiket: "YER · TARİH"
        atif: "Fotoğraf: Ad Soyad, CC BY-SA 4.0"   # küçük atıf (isteğe bağlı; açıklamada da olmalı)
        egim: -2.5                     # derece; giris: alt | ust | sag | sol; boy: 0.72; zoom: 1.05
        gecis: kaydir
        satirlar: ["Fotoğrafı anlatan cümle."]

      # METİN: alıntı / anahtar söz kartı, kelime kelime belirir; çeviri sarı altı çizili gelir
      # ZEMİN (metin, sayac, zaman_cizelgesi, izgara): zemin: koyu (vars.) | kagit | foto; arka: ilgili fotoğraf (bulanık)
      - tip: metin
        ust: "Almanya'daki reklamlardan"
        metin: "„völlig ungiftig“"
        ceviri: "tamamen zehirsiz"
        arka: img/arsiv.jpg            # isteğe bağlı: bulanık doku (arka_opak: 0.5)
        satirlar:
          - "Reklamlardaki vaat:"
          - {ses: aylin, metin: "Tamamen zehirsiz."}   # aynı metin+ses+hız başka yerde = aynı kayıt (kontrol gösterir)
        olaylar: [{tip: ceviri, satir: 2}]
      - tip: metin
        zemin: kagit                   # eski kâğıt; yazılar mürekkep rengi
        yazim: daktilo                 # harf harf, imleçli, tuş sesli
        metin: "Etkilenmeyen tek iki ülke: Türkiye ve ABD"
        satirlar: ["Bu söz yanlış."]
        olaylar: [{tip: ustunu_ciz, satir: 1, ofset: 0.4}]   # üstü kırmızı çizilir

  # ---------------------------------------------------------------- 2. bölüm (kartlı: bindirme kart + numara + başlık)
  - baslik: Bölüm adı
    kart_marka: true                   # kartta önce kanal imzası, sonra başlık (soğuk açılıştan sonraki ilk kart)
    kart_muzik_db: 4                   # kartta müzik kabarması; muzik_mod: nabiz -> bölüm boyunca kip
    sahneler:
      # SAYAÇ: büyük sayı sayarak artar (deger) ya da yıl göstergesi odometre gibi akar (yil)
      - tip: sayac
        deger: 10000                   # onek/sonek: "+" (varsayılan); sure_say: 2.2
        ust: "Dünya genelinde"
        etiket: "bebek"
        satirlar: ["Sayıyı söyleyen cümle."]
        # KONUK (wojak dışı her tipte): köşeden tepki veren karakter; yuz/giris/cikis olayları konuk kimliğiyle.
        # Wojak kanalı: bilgi sahneleri tek başına karakter taşımaz (talidomit-turkiye 4. tur). Yazıya binmesin:
        # kelime konum: ust, foto baskısı x: 0.4
        konuk: [{id: z, gorsel: assets/kit/klasik/sakin.png, x: 0.87, boy: 0.5, giris: 0.4, yon: alt}]
        # sfx_db: -6                   # bu sahnenin otomatik efektleri daha kısık (sessiz altlıkta kalem sesi gibi)
        olaylar:
          - {tip: basla, satir: 1, ofset: 0.5}  # saymaya başlama anı (yoksa 0.35 sn); sure: sayım süresi
          - {tip: yuz, karakter: z, gorsel: assets/kit/klasik/terli.png, satir: 1, an: son}
      - tip: sayac
        deger: [60, 0]                 # azalan sayaç (doğrusal)
        ust: "O dönemin kuralı"
        etiket: "gün"
        sure_say: 3.0
        satirlar: ["..."]
        olaylar:
          - {tip: deger, deger: 1267, etiket: "doktor", satir: 1, an: son}   # yeni değere sayar (renk, onek, sonek)
          # sure: 0 -> yeni değer 0,26 sn'de yuvarlanarak gelir; her değer önce yerleşir ve `tut` (0,6 sn) okunur
          # kalır (gerekirse sayım kısalır / değer ertelenir; kontrol bildirir)
      - tip: sayac
        yil: [1957, 1961]
        ust: "Raflarda"
        etiket: "dört yıl"
        satirlar: ["Dört yıl boyunca..."]

      # HARİTA: Natural Earth (kamu malı); ülkeler sırayla yanar, vurgu ülkesi ayrı renk + etiket
      - tip: harita
        bolge: avrupa                  # avrupa | bati_avrupa | akdeniz | turkiye | dunya | {merkez: [lon, lat], sinir: [lon0, lat0, lon1, lat1]}
        baslik: "Haritanın başlığı"
        aciklama: "Lejant: kırmızı ülkeler ne?"
        ulkeler: [DEU, GBR, SWE, ITA, ESP]    # ADM0_A3 kodları; sıra = yanma sırası (aralik: sn)
        etiketler: [DEU, GBR]                 # ad etiketi basılacaklar (true: hepsi)
        vurgu: {kod: TUR, etiket: "Ruhsat verilmedi"}   # renk: [70, 196, 118]
        satirlar: ["Ülkeler...", "Ama Türkiye..."]
        olaylar:
          - {tip: basla, satir: 1}
          - {tip: ulke, kod: TUR, satir: 2, ofset: 0.6}
          # ROTA: a'dan b'ye çizilerek uzanan yay (ülke kodu ya da [boylam, enlem]); kavis 0.22, sure 1.2 sn,
          # kesik: true (kesik çizgi), renk, etiket (varışta yazı). Çizimde hafif whoosh, varışta blip
          - {tip: rota, a: DEU, b: GBR, satir: 1, ofset: 0.8, etiket: "1958"}

      # ZAMAN ÇİZELGESİ (takma ad: liste): 3-6 tarihli nokta sırayla belirir
      - tip: zaman_cizelgesi
        baslik: "Olayların takvimi"
        noktalar:
          - {tarih: "1 Ekim 1957", metin: "Satışa çıktı"}
          - {tarih: "16 Kasım 1961", metin: "Uyarı"}
          - {tarih: "27 Kasım 1961", metin: "Piyasadan çekildi"}
        satirlar: ["...", "..."]
        olaylar:
          - {tip: nokta, indeks: 2, satir: 1, ofset: 0.4}
          - {tip: nokta, indeks: 3, satir: 2}
          - {tip: kose, deger: "????", takili: true, satir: 2}   # köşedeki yıl takılır (kose: {deger: 1961, yil: true})
        kose: {deger: 1961, yil: true, konum: sag_ust}

      # NOKTA IZGARASI: n nokta satır satır dolar; sondur ile bir oranı sessizce söner
      - tip: izgara
        n: 10000
        ust: "Dünya genelinde · 10.000+"
        etiket: "bebek etkilendi"
        say: false                     # true: canlı sayı
        satirlar: ["...", "..."]
        olaylar:
          - {tip: basla, satir: 1}
          - {tip: sondur, oran: 0.4, satir: 2, ofset: 0.5, etiket: "≈ %40 · ..."}

  # ---------------------------------------------------------------- 3. bölüm
  - baslik: Türkiye neden kurtuldu?
    sahneler:
      # MANŞET / BELGE: fosforlu kalem kutuların üstünden geçer, kamera kalemi dikeyde izler ve yaklaşır
      - tip: manset
        gorsel: img/telifli/belge.png
        etiket: "KAYNAK · YIL"
        kutular:                       # [x0, y0, x1, y1]: görselin pikselinde (ya da 0..1 oranında)
          - [217, 189, 1408, 226]
        zoom: 1.18
        satirlar: ["Belgeyi anlatan cümle."]
        olaylar: [{tip: vurgula, kutu: 1, satir: 1, ofset: 1.0}]   # stil: kalem (fosforlu, vars.) | daire (elle
        # çizilmiş kırmızı çember) | alt_cizgi (elle çizilmiş alt çizgi); renk: [r, g, b] (daire/alt_cizgi)

      # BÖLÜNMÜŞ EKRAN: sol panel ekranı kaplar; panel olayıyla sağ panel kayarak açılır
      - tip: bolunmus
        sol: {gorsel: img/arsiv.jpg, etiket: "BATI ALMANYA: KAYIT YETİYOR"}       # görsel panel (Ken Burns)
        sag: {metin: "Ruhsat şart", ceviri: "1928", baslik: "TÜRKİYE", zemin: kagit, alt: "kaynak"}   # metin paneli
        satirlar: ["...", "..."]
        olaylar:
          - {tip: panel, taraf: sag, satir: 2}
          - {tip: soluk, taraf: sol, satir: 2, ofset: 1.0}
          - {tip: buyut, taraf: sag, satir: 2, an: son}     # sağ panel ekranı kaplar

      # SORUŞTURMA PANOSU: kartlar iğnelenir, kırmızı ipler gerilir, karta damga basılır
      - tip: pano
        baslik: "Elimizdekiler"
        kose: {metin: "YAYIMLANMIŞ BELGE: {}", deger: 0}
        kartlar:                       # x, y: kadraja göre 0..1; stil: kagit | merkez | bos | foto (gorsel ile)
          - {id: m, metin: "BAKANLIK: RUHSAT YOK", stil: merkez, x: 0.5, y: 0.38}
          - {id: k, metin: "KİŞİ A", alt: "kaynak: ...", x: 0.19, y: 0.34}
          - {id: y, metin: "YIL ?", stil: bos, x: 0.36, y: 0.78}
        ipler: [[k, m]]
        satirlar: ["...", "..."]
        olaylar:
          - {tip: kart, id: m, satir: 1}
          - {tip: kart, id: k, satir: 2}
          - {tip: kart, id: y, satir: 2, an: son}
          - {tip: damga, kart: k, metin: "BELGE YOK", satir: 2, an: son, boy: 52}

      # KAPANIŞ ÇAĞRISI (son sahne, ~8-12 sn; 7. tur): video kutusu YOK. Hikâyenin açık sorusu + 0-3 seçenek kartı
      # (wojak ya da görsel; birbirine bağlanmaz), solda çağrıyı yapan wojak; imleci ABONE OL'a, zile ve BEĞEN'e
      # tıklar, yorum balonunda soru yazılır, sonra kartlar tek tek vurgulanır (hiçbiri işaretli kalmaz).
      - tip: kapanis
        bindirme: true                 # önceki sahnenin donmuş karesi üstünde (ya da arka: img/arsiv.jpg)
        sure: 10                       # varsayılan 10; 10'dan kısada animasyon orantılı sıkışır
        ust: "SON SORU"
        soru: "Türkiye'yi bu ilaçtan ne korudu?"   # yoksa ilk satırın metni
