# DEMO (~2 dk): uzun format motorunun bütün sahne tiplerini (wojak, foto, metin, marka, bolum_karti, sayac, harita,
# izgara, zaman_cizelgesi, manset, bolunmus, pano, kapanis), iki sesi, müziği ve efektleri gösterir.
# 7. tur: hareket dili (bulanıklık, ikincil hareket, canlı boşta hareket varsayılan; burada paralaks ve ilk sahnede
# doku da açık), harita rotası, belgede elle çizilmiş çember, video kutusuz kapanış çağrısı (eski bitis yerine).
# 10. tur: anlatımsız sayaç değer zinciri (1.267 -> ≈20.000 -> yuvarlanarak "en az 17"), iki kişilik çekimde
# karakterlerden kaçan isim etiketi; `kontrol` üst katman çakışmalarını da denetler ("denetim: sorun yok").
# Konu: Talidomit ve Türkiye (kısa sürüm: episodes/talidomit-turkiye). Olgu sınırları kısa sürümle aynı:
#   - Kaymakçalan'ın olumsuz görüşü meslektaşlarının tanıklığına dayanır ("meslektaşlarının anlattığına göre").
#   - Aygün'ün tavuk embriyosu deneyi tek kaynağa dayanır ("anlatılana göre"); ikisi aynı sahnede gösterilmez.
#   - Haritada bugünkü sınırlar var: Almanya tek parça görünür (1957'de ilaç Batı Almanya'da satıldı).
#   - Panoda Kaymakçalan ve Aygün ayrı kartlarda, ipler yalnız ortadaki Bakanlık kartına (aralarında bağ kurulmaz).
# Render: python -m wojak uzun render uzun/demo   (önce: python -m wojak uzun seslendir uzun/demo --qa)
id: demo
baslik: "Türkiye'ye giremeyen ilaç: Talidomit (demo)"

anlatici: {ses: murat, hiz: 0.95}
telaffuz:
  Contergan: Kontergan
  Widukind Lenz: Vidukind Lents
qa:
  isimler: [Contergan, talidomit, Lenz, Kaymakçalan, Süreyya Tahsin Aygün]

muzik: {uret: true, tohum: 1957, seviye: -22, acik: -15}
zamanlama: {kart: 2.3}
gecis: kesme
kart_bindirme: true      # bölüm kartları önceki sahnenin donmuş karesi üstünde (1,2 sn; siyah ekran yok)
hareket: {paralaks: 0.35}   # wojak sahnelerinde arka plan kamerayı daha az izler (itmede derinlik)

bolumler:
  - baslik: Soğuk açılış
    youtube: "Giriş: reçetesiz bir uyku ilacı"
    kart: false
    sahneler:
      - tip: wojak
        arka: episodes/talidomit-turkiye/img/arka_lille_lab_kaynak.jpg
        kirp: [0.0, 0.0, 0.86, 1.0]   # sağ kenardaki modern prizler kadraja girmesin
        kamera: {zoom: [1.0, 1.08], merkez: [[0.5, 0.5], [0.45, 0.46]]}   # konuşana doğru itme: it 0.05 (vars.)
        etiket: "BATI ALMANYA · 1957"
        doku: true                    # arka plana gren + toz (karakterler net)
        muzik_db: -6                  # soğuk açılışta müzik kısık
        karakterler:
          - {id: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sol}
          - {id: b, gorsel: episodes/talidomit-turkiye/chars/veteriner.png, taraf: sag}
          - {id: c, gorsel: assets/kit/klasik/sakin.png, x: 0.53, derinlik: 0.65, giris: 1.0}   # arkada müşteri
        satirlar:
          - "1957. Batı Almanya'da yeni bir uyku ilacı satışa çıkıyor."
          - "Reçete gerekmiyor. Üstelik hamilelere bile öneriliyor."
        olaylar:
          - {tip: giris, karakter: b, satir: 2, ofset: 0.2}
          - {tip: balon, karakter: a, metin: "Reçeteye gerek yok!", satir: 1, an: son, ofset: -1.2, sure: 2.2}
          - {tip: kelime, metin: "REÇETESİZ", satir: 2, ofset: 1.2, konum: ust}

      - tip: foto
        gorsel: img/contergan_kutu.jpg
        etiket: "CONTERGAN · BATI ALMANYA, 1957"
        atif: "Fotoğraf: Kai Oesterreich, CC BY-SA 3.0"
        egim: -2.5
        gecis: kaydir
        satirlar:
          - "Adı Contergan. Etken maddesi, talidomit."

      - tip: metin
        ust: "Almanya'daki reklamlardan"
        arka: img/contergan_kutu.jpg
        metin: "„völlig ungiftig“"
        ceviri: "tamamen zehirsiz"
        gecis: gecis
        satirlar:
          - "Reklamlardaki vaat çok netti:"
          - {ses: aylin, metin: "Tamamen zehirsiz.", duygu: content}
        olaylar:
          - {tip: ceviri, satir: 2, ofset: -0.05}

      - tip: marka                    # kanal imzası (~1,8 sn): donmuş karenin üstünde, filigranın yerine uçar
        bindirme: true

  - baslik: Sessiz felaket
    sahneler:
      - tip: sayac
        yil: [1957, 1961]
        ust: "Raflarda"
        etiket: "dört yıl"
        arka: img/contergan_kutu.jpg   # koyu zemine bulanık, kararmış ilgili fotoğraf (+ toz, ışık, gren)
        satirlar:
          - "Dört yıl boyunca ilaç raflarda kalıyor."

      - tip: harita
        bolge: avrupa
        baslik: "Talidomit Avrupa'da"
        aciklama: "Satıldığı ülkelerden bazıları"
        ulkeler: [DEU, GBR, SWE, NOR, DNK, FIN, NLD, BEL, IRL, PRT, ESP, ITA, AUT, CHE]
        etiketler: [DEU, GBR, ITA, ESP, SWE]
        vurgu: {kod: TUR, etiket: "Ruhsat verilmedi"}
        gecis: kaydir
        satirlar:
          - "İlaç onlarca ülkede satılıyor."
          - "Ama Türkiye'de ruhsat alamıyor."
        olaylar:
          - {tip: basla, satir: 1, ofset: 0.1}
          - {tip: ulke, kod: TUR, satir: 2, ofset: 0.7}
          # ilacın Türkiye'ye "yolu": kesik beyaz rota, Türkiye yandığı anda varır
          - {tip: rota, a: DEU, b: TUR, kesik: true, renk: beyaz, satir: 2, ofset: -0.5, sure: 1.2}
        sfx:
          - {ad: turkiye, satir: 2, ofset: 0.7, db: -6}   # Türkiye ses motifi

      - tip: izgara                   # nokta ızgarası: 10.000 nokta dolar, %40'ı sessizce söner
        n: 10000
        ust: "Dünya genelinde"
        etiket: "bebek etkilendi"
        say: true
        gecis: gecis
        satirlar:
          - "Dünyada on binden fazla bebek, ağır doğum kusurlarıyla dünyaya geliyor."
          - "Bu bebeklerin tahminen yüzde kırkı, doğumda ya da kısa süre sonra hayatını kaybediyor."
        olaylar:
          - {tip: basla, satir: 1, ofset: 0.3}
          - {tip: sondur, oran: 0.4, satir: 2, ofset: 1.2, sure: 2.0, etiket: "≈ %40 · doğumda ya da kısa süre sonra"}
          - {tip: muzik, db: -8, satir: 2}   # müzik incelir

      - tip: zaman_cizelgesi
        baslik: "Felaketin takvimi"
        zemin: kagit                  # eski kâğıt zemin; yazılar mürekkep renginde
        kose: {metin: "GÜN {} / 11", deger: 0}
        noktalar:
          - {tarih: "1 Ekim 1957", metin: "Contergan satışa çıktı"}
          - {tarih: "16 Kasım 1961", metin: "Dr. Lenz alarm verdi"}
          - {tarih: "27 Kasım 1961", metin: "İlaç piyasadan çekildi"}
        satirlar:
          - "Kasım 1961'de Alman çocuk doktoru Widukind Lenz alarm veriyor."
          - "On bir gün sonra ilaç piyasadan çekiliyor."
        olaylar:
          - {tip: nokta, indeks: 1, t: 0.6}
          - {tip: nokta, indeks: 2, satir: 1, ofset: 0.4}
          - {tip: nokta, indeks: 3, satir: 2, ofset: 0.2}
          - {tip: kose, deger: 11, satir: 2, ofset: 0.2, sure: 1.0}

  - baslik: Türkiye neden kurtuldu?
    sahneler:
      - tip: manset
        gorsel: img/telifli/tfd_akcasu.png
        etiket: "TÜRK FARMAKOLOJİ DERNEĞİ BÜLTENİ, 2012"
        kutular:
          - [217, 189, 1408, 226]
          - [232, 323, 1411, 360]
          - [41, 367, 269, 404]
        satirlar:
          - "Meslektaşlarının anlattığına göre farmakolog Şükrü Kaymakçalan, deneyleri yetersiz bulup olur vermedi."
          - "Bakanlık da ilaca ruhsat vermedi."
        olaylar:
          - {tip: vurgula, kutu: 1, satir: 1, ofset: 1.2}
          - {tip: vurgula, kutu: 2, satir: 2, ofset: 0.0}
          - {tip: vurgula, kutu: 3, satir: 2, ofset: 0.55, stil: daire}   # elle çizilmiş kırmızı çember

      - tip: sayac                    # 10. tur: değer zinciri (anlatımsız): her değer yerleşir ve okunur kalır
        deger: 1267                   # (tut 0,6 sn), yeni değer sayarak ya da (sure: 0) tekerlek gibi yuvarlanarak gelir
        sonek: ""
        etiket: "doktor"
        ust: "ABD · ‘klinik deneme’"
        sure: 5.2
        olaylar:
          - {tip: basla, t: 0.2, sure: 0.9}   # ilk sayımın süresi (sure_say yerine)
          - {tip: deger, deger: 20000, onek: "≈", etiket: "hasta", t: 1.8, sure: 1.2}
          - {tip: deger, deger: 17, onek: "en az ", etiket: "bebek · FDA sayımı", renk: kirmizi, t: 3.8, sure: 0}

      - tip: bolunmus                 # bölünmüş ekran: sağ panel kayarak açılır
        sol: {metin: "en az 17 bebek", baslik: "ABD", alt: "ruhsat yoktu; 'klinik deneme' yoluyla (FDA sayımı)",
              arka: img/contergan_kutu.jpg}
        sag: {metin: "bilinen vaka yok", baslik: "TÜRKİYE", zemin: kagit}
        satirlar:
          - "ABD'de en az on yedi bebek etkilendi."
          - "Türkiye'de ise talidomite bağlanmış bilinen bir vaka yok."
        olaylar:
          - {tip: panel, taraf: sag, satir: 2}
          - {tip: soluk, taraf: sol, satir: 2, ofset: 1.2}

      - tip: pano                     # soruşturma panosu: kartlar iğnelenir, ipler gerilir, damga basılır
        baslik: "Elimizdekiler"
        kose: {metin: "YAYIMLANMIŞ BELGE: {}", deger: 0}
        gecis: kaydir
        kartlar:
          - {id: m, metin: "BAKANLIK: RUHSAT YOK", stil: merkez, x: 0.5, y: 0.38}
          - {id: k, metin: "KAYMAKÇALAN", alt: "kaynak: meslektaş tanıklıkları (TFD Bülteni, 2012)", x: 0.19, y: 0.34}
          - {id: g, metin: "AYGÜN", alt: "ilk kaynak: Medikal Tribün, 2008", x: 0.81, y: 0.34}
          - {id: y, metin: "YIL ?", stil: bos, x: 0.36, y: 0.78}
          - {id: f, metin: "FİRMA ?", stil: bos, x: 0.64, y: 0.78}
        ipler: [[k, m], [g, m]]       # ayrı ipler: Kaymakçalan ile Aygün arasında bağ yok
        satirlar:
          - "Şimdi elimizdekilere bakalım."
          - "Kaymakçalan'ın rolü, meslektaşlarının tanıklığına dayanıyor."
          - "Tavuk embriyosu deneyinin bilinen en eski kaynağı, 2008'de çıkan bir haber."
        olaylar:
          - {tip: kart, id: m, satir: 1, ofset: 0.3}
          - {tip: kart, id: k, satir: 2}
          - {tip: kart, id: g, satir: 3}
          - {tip: kart, id: y, satir: 3, ofset: 1.0}
          - {tip: kart, id: f, satir: 3, ofset: 1.6}
          - {tip: damga, kart: g, metin: "TEK KAYNAK", satir: 3, an: son, ofset: -0.6, boy: 52, aci: -9}

      - tip: wojak
        arka: episodes/talidomit-turkiye/img/arka_lille_lab_kaynak.jpg
        kirp: [0.0, 0.0, 0.86, 1.0]   # sağ kenardaki modern prizler kadraja girmesin
        kamera: {zoom: [1.04, 1.0], merkez: [[0.55, 0.48], [0.5, 0.5]]}
        gecis: gecis
        karakterler:
          - {id: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, x: 0.17, boy: 0.56, giris: false}
          - {id: b, gorsel: episodes/talidomit-turkiye/chars/veteriner.png, x: 0.83, boy: 0.56}   # 10. tur: isim etiketi
        satirlar:                     # aralarındaki boşluğa yerleşsin (karakterlerden 40 px uzak; kontrol denetler)
          - "Anlatılana göre veteriner hekim Süreyya Tahsin Aygün de ilacı tavuk embriyolarında denemişti."
          - "Türkiye, bu felaketi yaşamayan sayılı ülkelerden biri oldu."
        olaylar:
          - {tip: isim, karakter: b, ad: "Süreyya Tahsin Aygün", unvan: "Ord. Prof. · veteriner hekim (1895-1981)", satir: 1, ofset: 0.9, sure: 4.5}
          - {tip: balon, karakter: b, metin: "Önce embriyoda deneyelim", satir: 1, ofset: 1.6, sure: 2.6}
          - {tip: yuz, karakter: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gergin.png, satir: 2, ofset: 0.4}
        sfx:
          - {ad: hit, satir: 2, ofset: 0.4, db: -8}

      - tip: kapanis                  # kapanış çağrısı (video kutusu yok): soru + seçenekler + abone/zil/beğen + yorum
        bindirme: true                # önceki sahnenin donmuş karesi üstünde
        sure: 10
        ust: "SON SORU"
        soru: "Türkiye'yi bu ilaçtan ne korudu?"
        secenekler:                   # ayrı kartlar: kişiler arasında bağ kurulmaz
          - {metin: "Kaymakçalan", alt: "farmakolog", gorsel: assets/kit/klasik/sakin.png}
          - {metin: "Aygün", alt: "veteriner hekim", gorsel: episodes/talidomit-turkiye/chars/veteriner.png}
          - {metin: "Kural", alt: "ruhsat şartı", gorsel: uzun/talidomit-turkiye/img/cizim/kanun_1262_sayfa.jpg}
        satirlar:
          - "Bir sonraki unutulmuş hikâyede görüşmek üzere."

kucukresimler:
  - ad: a
    arka: episodes/talidomit-turkiye/img/arka_lille_lab_kaynak.jpg
    karakterler:
      - {gorsel: episodes/talidomit-turkiye/chars/temsilci_gergin.png, taraf: sol, boy: 0.98}
    yazi: "TÜRKİYE'YE GİREMEDİ"
    vurgu_kelime: "GİREMEDİ"
    ek: {gorsel: img/contergan_kutu.jpg, konum: sag_alt, boy: 0.30}
    daire: {x: 0.80, y: 0.80, r: 0.17}
  - ad: b
    arka: episodes/talidomit-turkiye/img/arka_lille_lab_kaynak.jpg
    karakterler:
      - {gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sag, boy: 0.96}   # iddiayı satıcı söyler
    yazi: "“TAMAMEN ZEHİRSİZ”"
    vurgu_kelime: "ZEHİRSİZ"
    ek: {gorsel: img/contergan_kutu.jpg, konum: sol_alt, boy: 0.36}
    ok: {bas: [0.47, 0.50], son: [0.30, 0.66]}
  - ad: c
    arka: episodes/talidomit-turkiye/img/arka_lille_lab_kaynak.jpg
    karart: 0.55
    karakterler:
      - {gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sol, boy: 0.9}
      - {gorsel: episodes/talidomit-turkiye/chars/veteriner.png, taraf: sag, boy: 0.9}
    yazi: "10.000+ BEBEK"
    vurgu_kelime: "10.000+"

paket:
  baslik_alternatifleri:
    - "Türkiye'ye giremeyen ilaç: Talidomit faciası"
    - "Almanya'da hamilelere bile verilen ilaç Türkiye'ye neden giremedi?"
    - "10.000 bebeği etkileyen ilaç ve onu durduran Türk bilim insanları"
  aciklama: |
    1957'de Batı Almanya'da reçetesiz satılan bir uyku ilacı, dört yıl içinde on binden fazla bebeğin ağır doğum
    kusurlarıyla dünyaya gelmesine yol açtı. Türkiye ise bu faciayı yaşamayan sayılı ülkelerden biri oldu.
    (Bu bir motor demosudur.)
  etiketler: [talidomit, contergan, tarih, türkiye, ilaç faciası, şükrü kaymakçalan, süreyya tahsin aygün, wojak, tarihselwojak]
  sabit_yorum: "Şükrü Kaymakçalan ve Süreyya Tahsin Aygün'ün adlarını daha önce duymuş muydunuz?"
  kaynaklar:
    - "Özdemir O., 'Türkiye'de Talidomid Gerçeği', Türk Farmakoloji Derneği E-Bülteni 114, 2012"
    - "Pharmazeutische Zeitung 48/2011, '50 Jahre Marktrücknahme'"
    - "Vargesson N., Birth Defects Res C 2015;105:140-156"
  gorsel_atif:
    - "Laboratuvar: Pierre André Leclercq, Wikimedia Commons, CC BY-SA 4.0 (düzenlendi)"
    - "Contergan kutusu: Kai Oesterreich, Wikimedia Commons, CC BY-SA 3.0"
    - "Belge: Türk Farmakoloji Derneği E-Bülteni 114 (2012), s. 10 (alıntı)"
    - "Harita verisi: Natural Earth (kamu malı)"
    - "Müzik ve efektler: kanalın kendi sentezi"
  short_baglanti: "teslim/talidomit-turkiye (Short)"
