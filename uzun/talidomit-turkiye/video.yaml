# Talidomit ve Türkiye — uzun YouTube videosu (~9-10 dk). Senaryo: senaryo_v2 (12.10.2026, baş yazar revizyonu;
# iki eleştiri uygulandı). Varlıklar ve lisanslar: VARLIKLAR.md. Sahne kompozitleri: img/kompozit_uret.py.
# Motor: docs/UZUN_MOTOR.md. Kararlar: docs/UZUN_FORMAT.md.
#
# Olgu sınırları (senaryo "Hassas cümleler" tablosu; değiştirmeden önce oku):
#   - Kaymakçalan'ın olumsuz görüşü meslektaşlarının tanıklığına dayanır ("meslektaşlarının anlattığına göre").
#   - Aygün'ün tavuk embriyosu deneyi "anlatılana göre"; bilinen en eski kaynağı 2008 tarihli bir haber; ikisi aynı
#     karede ya da birbirine bağlı gösterilmez (panoda ayrı ipler yalnız Bakanlık kartına).
#   - Başvurunun yılı, firması, ürün adı bilinmiyor: ekranda yıl yok; Lille laboratuvarına yer etiketi yok
#     ("temsilî görüntü"); A temsilci yalnız Türkiye sahnelerinde (Grünenthal'in başvurduğu izlenimi olmasın).
#   - Haritada yalnız satıldığı belgeli ülkeler boyanır; "46"yı köşe göstergesi taşır.
#   - Mağdur görüntüsü yok: bebek/anne/hasta çizilmez; ölüm oranı noktaların sessizce sönmesiyle (efekt yok).
#   - Telifli görseller (img/telifli/) hesap sahibi karar verene kadar KULLANILMAZ: serbest yedekleri kullanılıyor
#     (Distaval yazı kartı, KÜB 4.4 yazı kartı, bülten bilgi kartı, adsız şişe çizimi).
#
# Akış: python -m wojak uzun kontrol uzun/talidomit-turkiye
#       python -m wojak uzun seslendir uzun/talidomit-turkiye --qa
#       python uzun/talidomit-turkiye/ses_onarim.py                 # önbellekteki çekimlerden onarım (5. tur: yalnız
#                                                                   # cüzzam z'si ve <break> durak kısaltması)
#       python uzun/talidomit-turkiye/img/kompozit_uret.py pano     # KP.2'nin pano karesi (seslendirmeden sonra)
#       python -m wojak uzun render uzun/talidomit-turkiye           # -> out/talidomit-turkiye-uzun/
#
# 2. hakem turu (13.10.2026): vurgu efektleri (Türkiye motifi, damga, boom, hit) cümle BİTİŞİNE çapalı + vurgu
# satırına `sonra`; gerçek kişilere balon yok (özet kelime/kart); bölüm 5 Ankara zeminlerinde; müzik kipleri
# (nabiz/gerilim/major) ve kart kabarmaları.
# 3. hakem turu (13.10.2026): kanca okunur (beyaz damga denizde, 1,3 sn) + kapı sahnesi (ilk wojak 0:11); bütün
# vurgu damgaları en az 1,2 sn ekranda; çakışmalar; doruk (B5.3b) wojak sahnesi; B2.5 ve B5.8 bölündü/birleşti;
# müzik -18/-12 + nefes araları; Cartesia kotası hâlâ yok: metni kısalan satırlar (Ama, Bilanço, 1962, Üstelik)
# önbellekteki çekimden kesildi, "cüzzam" z'si uzatıldı (ses_onarim.py).
# 4. tur (13.10.2026): hesap sahibi "wojak kanalı": bilgi sahnelerine köşeden tepki veren karakter (`konuk`: anlatıcı,
# Lenz, Kelsey, Kaymakçalan, Voss, Sheskin...), karakterli süre %27 -> %50+; hiçbir görsel 2'den çok çekimde değil
# (kendi çizimimiz bakanlık koridoru/odası, eczane, büro, dokular); kare parlaklığı >= ~45/255 (motor: harita ve koyu
# zemin aydınlatıldı); sayılar ekranda ve altyazıda rakamla (`tts` eski kelimeli metin: önbellek anahtarı aynı); "Arada
# bir boşluk var:" satırı çıktı; doruk ve çakışma düzeltmeleri (izlenme hakemi M1/M2). Hâlâ yeni TTS yok.
# 5. tur (13.10.2026): hesap sahibinin yeni Cartesia anahtarlarıyla (secrets.env, CARTESIA_API_KEY_2/_3) 30 satır
# yeniden seslendirildi: dil hakeminin MUST 1'i ("Asıl soruyu ise kimse araştırmamış."), kesik/uzatılmış çekimler
# (Ama/Üstelik/Bilanço/1962, FDA, Lenz'i, Reçetesiz, hız_*), "yineliyor" -> "tekrarlıyor", "hakkı bir kuruma
# veriyor" -> "başarıyı bir kuruma bağlıyor" (röportaj), "kan kanseri olan"; açıklayıcı iki noktalarda <break> (en çok
# 0,5 sn: ses_onarim.py durak). Ritim araları (dil hakemi #2), izlenme S1-S9 (kapı yakın çekimi + terleyen temsilci,
# "ANNE KARNINDA." sözle birlikte, B5.4/B2.3 konuk + Türkçe kelime, damga kontrastı/konturu, anlatıcı solda/büyük),
# B3.14 (dava) çıktı ve sahne sonu 0,26 sn (10:15 sınırı). Cüzzam satırlarının ikisi z uzatılmış eski çekim.
id: talidomit-turkiye
baslik: "Türkiye Bu İlaca Neden ‘Hayır’ Dedi?"

anlatici: {ses: murat, hiz: 1.0}   # hız testi (uretici_raporu.md): 0.95 ile 1.0 arasında süre farkı ~%1, 1.0 seçildi
telaffuz:                          # yalnız TTS metnine; uzun olan önce
  Frances Oldham Kelsey: Frensis Oldım Kelsi
  Widukind Lenz: Vidukind Lents
  Jacob Sheskin: Yakob Şeskin
  Kelsey: Kelsi
  Lenz: Lents
  Grünenthal: Grünental
  Contergan: Kontergan
  SALL4: Sal dört
  K 17: Ka on yedi
  FDA: Ef De A                     # 5. tur (dil hakemi): "FTA" duyuluyordu
  Talidomid: Talidomit
qa:
  isimler: [Kaymakçalan, Süreyya Tahsin Aygün, Contergan, talidomit, Talidomid, Grünenthal, Lenz, Kelsey, Kevadon,
            Distaval, Sheskin, Eczacıbaşı, Refik Saydam, Cerrahpaşa, Behçet, SALL4, miyelom, Kennedy, ABD, FDA]

muzik: {uret: true, tohum: 1961, seviye: -18, acik: -12}   # 3. tur: -22/-15'te telefonda duyulmuyordu (sesin ~20 dB altı)
zamanlama: {bas: 0.2, ara: 0.2, son: 0.26, bindirme: 1.2, max_bos: 6.0}   # 5. tur: son 0.32 -> 0.26 (10:15 sınırı)
gecis: kesme
kart_bindirme: true

bolumler:
  # ================================================================================================ SOĞUK AÇILIŞ
  # 4. tur: anlatıcı (hardal kazaklı 'feels guy', izleyicinin yerine geçer) kancanın ilk karesinden itibaren bilgi
  # sahnelerinde köşeden tepki verir (`konuk`); hesap sahibi: "wojak kanalı, ekranda wojak olmalı"
  - baslik: Soğuk açılış
    youtube: "Giriş"
    kart: false
    sahneler:
      # SA.1a · dünya haritası: belgeli ülkeler satır boyunca tek tek kırmızı, köşede 1 -> 46 ÜLKE (Türkiye gri)
      # (2. hakem turu: kanca 3 çekime bölündü; 3. tur: kare 0 yalnız Almanya). 4. tur: anlatıcı ilk karede altta
      # (Güney Atlantik / Afrika'nın güneyi: boyalı ülke yok), sayaç 46'ya varınca terler
      - tip: harita
        bolge: dunya
        ulkeler: [DEU, CAN, BRA, GBR, AUS, ITA, JPN, AUT, CHE, BEL, NLD, LUX]
        aralik: 0.2
        aciklama: "kırmızı: satıldığı belgelenen ülkelerden bazıları"
        zoom: [1.0, 1.14]
        bas: 0.6
        son: 0.15
        muzik_db: -10
        kose: {metin: "{} ÜLKE", deger: 1}
        konuk: [{id: z, gorsel: chars/anlatici_sakin.png, x: 0.56, boy: 0.4, giris: false}]
        satirlar:
          - {metin: "46 ülkede satılan bir ilaç.", tts: "Kırk altı ülkede satılan bir ilaç."}
        olaylar:
          - {tip: basla, satir: 1, ofset: -0.1}
          - {tip: ulke, kod: DEU, t: 0.0}
          - {tip: kose, deger: 46, satir: 1, ofset: 0.1, sure: 2.0}
          - {tip: yuz, karakter: z, gorsel: chars/anlatici_terli.png, satir: 1, ofset: 1.7}
        sfx:
          - {ad: boom, t: 0.0, db: -8}

      # SA.1b · tam ekran sayaç: 10.000+ bebek (bebek/kişi görüntüsü yok); anlatıcı sağ altta, sayı bitince gözyaşı
      - tip: sayac
        deger: 10000
        sonek: "+"
        ust: "Dünyada"
        etiket: "bebek · ağır doğumsal kusur"
        renk: kirmizi
        sure_say: 3.4
        gecis: gecis
        bas: 0.1
        son: 0.2
        muzik_db: -10
        konuk: [{id: z, gorsel: chars/anlatici_terli.png, x: 0.87, boy: 0.5, giris: false}]
        satirlar:
          - {metin: "10.000'den fazla bebek, bu ilaç yüzünden ağır doğumsal kusurlarla dünyaya geldi.",
             tts: "On binden fazla bebek, bu ilaç yüzünden ağır doğumsal kusurlarla dünyaya geldi."}
        olaylar:
          - {tip: basla, satir: 1, ofset: 0.05}
          - {tip: yuz, karakter: z, gorsel: chars/anlatici_gozyasli.png, satir: 1, ofset: 3.3}

      # SA.2 · Akdeniz: Türkiye yeşile döner, motif + "RUHSAT VERİLMEDİ" damgası cümle bitince (beyaz, denizde)
      - tip: harita
        bolge: akdeniz
        ulkeler: [DEU, GBR, AUT, CHE, BEL, NLD, LUX, ITA]
        aralik: 0.03
        vurgu: {kod: TUR}
        zoom: [1.0, 1.25]
        gecis: gecis
        bas: 0.15
        muzik_db: -10
        konuk: [{id: z, gorsel: chars/anlatici_gozyasli.png, x: 0.9, boy: 0.42, giris: false}]
        satirlar:
          - {metin: "Ama Türkiye'de bu ilaca ruhsat verilmedi.", sonra: 1.1}
        olaylar:
          - {tip: basla, t: 0.0}
          - {tip: ulke, kod: TUR, satir: 1, ofset: 0.6}
          - {tip: yuz, karakter: z, gorsel: chars/anlatici_fark.png, satir: 1, an: son, ofset: 0.0}
          - {tip: damga, metin: "RUHSAT VERİLMEDİ", renk: beyaz, satir: 1, an: son, ofset: 0.1, x: 0.56, y: 0.82, boy: 84, aci: -6}
        sfx:
          - {ad: turkiye, satir: 1, an: son, ofset: 0.05, db: -11}

      # SA.3 · Ankara'da kapı kapanır: ilk wojak hikâye karakteri (K1 küçük resmindeki temsilci). 4. tur: temsilci
      # x 0.27 -> 0.40 (etiket çenesine biniyordu)
      - tip: wojak
        arka: img/foto_saglik_bakanligi.jpg
        odak: [0.5, 0.4]
        bulanik: 6
        karart: 0.3
        etiket: "ANKARA · TEMSİLÎ GÖRÜNTÜ"
        kamera: {zoom: [1.0, 1.1], it: 0}
        gecis: kaydir
        muzik_db: -10
        karakterler:
          - {id: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sol, x: 0.40, giris: 0.1}
          - {id: d, gorsel: img/cizim/kapi_acik.png, x: 0.74, boy: 0.85, alt: 0.04, bakis: on, giris: false}
        satirlar: [{metin: "Peki Ankara'da bu kapıyı kim kapattı?", sonra: 0.5}]
        olaylar:
          - {tip: yuz, karakter: d, gorsel: img/cizim/kapi_kapali.png, satir: 1, an: son, ofset: 0.05}
          - {tip: yuz, karakter: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gergin.png, satir: 1, an: son, ofset: 0.15}
        sfx: [{ad: kapi, satir: 1, an: son, ofset: 0.05, db: -6}]

      # SA.3 · üç soru kartı + boş dosya, BELGE: 0 (B5.8 panosunun habercisi). 4. tur: keçe pano (mantar pano yalnız
      # B5.8'in iki çekiminde); "BOŞ" damgası kartın görseline (eskiden başlığın üstündeydi), boy 80; anlatıcı düşünür
      - tip: pano
        zoom: 1.15
        doku: kece
        kose: {metin: "BELGE: {}", deger: 0}
        muzik_db: -10
        konuk: [{id: z, gorsel: chars/anlatici_dusunceli.png, x: 0.88, boy: 0.46, giris: 0.3, yon: alt}]
        kartlar:
          - {id: f, metin: "BİR FARMAKOLOG?", x: 0.2, y: 0.33, egim: -4}
          - {id: v, metin: "BİR VETERİNER HOCA?", x: 0.5, y: 0.27, egim: 3}
          - {id: e, metin: "BİR ENSTİTÜ?", x: 0.78, y: 0.33, egim: -2}
          - {id: d, metin: "YAYIMLANMIŞ BELGE", gorsel: img/kompozit/dosya_bos_kagit.jpg, x: 0.47, y: 0.71, en: 460, egim: 1.5}
        satirlar:
          - {metin: "Herkesin bir cevabı var.", sonra: 0.4}
          - {metin: "Ama ortada yayımlanmış tek bir belge yok.", sonra: 1.0}
        olaylar:
          - {tip: kart, id: f, satir: 1, ofset: 0.0}
          - {tip: kart, id: v, satir: 1, ofset: 0.4}
          - {tip: kart, id: e, satir: 1, ofset: 0.8}
          - {tip: kart, id: d, satir: 2, ofset: 0.3}
          - {tip: yuz, karakter: z, gorsel: chars/anlatici_ciddi.png, satir: 2, an: son, ofset: 0.0}
          - {tip: damga, kart: d, metin: "BOŞ", satir: 2, an: son, ofset: 0.05, boy: 80, aci: -9}
          - {tip: kose, deger: 0, satir: 2, an: son, ofset: 0.1}

      # SA.4 · Contergan tenekesi (fotoğrafın 2 kullanımından biri; öbürü B6.7 aynası)
      - tip: foto
        gorsel: img/foto_contergan_teneke.jpg
        etiket: "CONTERGAN · BATI ALMANYA, 1957"
        atif: "Fotoğraf: Kai Oesterreich, CC BY-SA 3.0"
        egim: -2.5
        zoom: 1.14
        gecis: kaydir
        muzik_db: -10
        satirlar:
          - "1957. Batı Almanya. Reçetesiz satılan yeni bir uyku ilacı."
        olaylar:
          - {tip: kelime, metin: "REÇETESİZ", satir: 1, ofset: 1.9, sure: 1.6, konum: ust}

      # SA.4b · eczanede anne adayı (yalnız sakin yüz; mağdur değil) + numune kutusu (4. tur: kutu bütün görünür,
      # tabletli; kesik kutu süt kutusu gibi okunuyordu)
      - tip: wojak
        arka: img/arka_eczane_raflar_169.jpg
        bulanik: 3
        karart: 0.12
        kamera: {zoom: [1.0, 1.08], merkez: [[0.5, 0.5], [0.45, 0.5]], it: 0}
        gecis: kaydir
        muzik_db: -10
        karakterler:
          - {id: m, gorsel: chars/anne_adayi_sakin.png, taraf: sol, x: 0.3, boy: 0.74, giris: 0.05}
          - {id: k, gorsel: img/cizim/numune_kutusu_tabletler.png, x: 0.68, boy: 0.26, alt: -0.1, bakis: on, giris: 0.35}
        satirlar: ["Kısa süre sonra hamileler bile kullanıyor."]
        olaylar:
          - {tip: kelime, metin: "HAMİLELER BİLE", satir: 1, ofset: 0.8, sure: 1.9, konum: ust}

      # SA.5 · reklam vaadi; Aylin "Tamamen zehirsiz." (B6.7'de aynı kayıt). 4. tur: kâğıt zemin (eski reklam
      # sayfası; teneke fotoğrafı 5. kez görünmesin) + reklama inanan anne adayı solda; Aylin'den önce nefes (dil hakemi)
      - tip: metin
        zemin: kagit
        ust: "Almanya'daki reklamlardan"
        metin: "„völlig ungiftig“"
        ceviri: "tamamen zehirsiz"
        gecis: gecis
        muzik_db: -10
        konuk: [{id: m, gorsel: chars/anne_adayi_sakin.png, x: 0.12, boy: 0.62, giris: 0.15, yon: sol}]
        satirlar:
          - "Reklamlarına göre bu ilaç…"
          - {ses: aylin, metin: "Tamamen zehirsiz.", duygu: content, once: 0.5}
        olaylar: [{tip: ceviri, satir: 2, ofset: -0.05}]

      # SA.6-SA.7 · kısa videoya selam. 4. tur (izlenme hakemi S3: SA.3'ü tekrarlıyordu): kapının ikinci çalınışı;
      # 2000'ler temsilcisi (B6.6'da kapı açılır), bakanlık koridoru (kendi çizimimiz), köşede yıl 1961 -> 20?? takılı
      - tip: wojak
        arka: img/arka_koridor_cizim.jpg
        bulanik: 3
        karart: 0.08
        kamera: {zoom: [1.0, 1.24], merkez: [[0.55, 0.5], [0.42, 0.5]], it: 0}   # 5. tur: vuruş kapıya yakın
        kose: {metin: "{}", deger: 1961, yil: true}
        muzik_db: -10
        karakterler:
          - {id: d, gorsel: img/cizim/kapi_kapali.png, x: 0.3, boy: 0.84, alt: 0.04, bakis: on, giris: false}
          - {id: a, gorsel: chars/temsilci2000_sakin.png, taraf: sag, x: 0.72, boy: 0.62, giris: 0.4}
        satirlar:
          - "Bu hikâye 1961'de bitmedi."      # ses: 'Üstelik' kesildi (ses_onarim.py ustelik)
          - {metin: "Aynı ilaç, 40 yılı aşkın bir süre sonra, Türkiye'nin kapısını bir kez daha çalacaktı.",
             tts: "Aynı ilaç, kırk yılı aşkın bir süre sonra, Türkiye'nin kapısını bir kez daha çalacaktı.", sonra: 0.25}
          - "Bu, o kapının hikâyesi."
        olaylar:
          - {tip: kelime, metin: "40+ YIL SONRA", satir: 2, ofset: 0.5, sure: 2.0, konum: ust}
          - {tip: kose, deger: "20??", takili: true, satir: 2, ofset: 0.6, sure: 1.0}
          - {tip: yuz, karakter: a, gorsel: chars/temsilci2000_gergin.png, satir: 2, an: son, ofset: 0.05}
          - {tip: kelime, metin: "O KAPININ HİKÂYESİ", satir: 3, ofset: 0.2, sure: 1.8, konum: ust}
        sfx:   # kapı vuruşu cümle bitince (kelimenin üstünde değil)
          - {ad: kapi, satir: 2, an: son, ofset: 0.02, db: -6}

  # ================================================================================================ BÖLÜM 1
  - baslik: Zehirsiz Mucize
    youtube: "1 · Zehirsiz Mucize"
    kart_marka: true
    kart_sure: 1.5
    sahneler:
      # B1.1 · Aralık 1956; doğum yeri yok, bebek/anne/baba çizimi yok. 4. tur: kelime altta (takvimin 1956 başlığına
      # biniyordu), takvim alçak, kamera yarıya kadar yürür; zemin Stolberg (Kupferhof 2 çekimde kalsın); anlatıcı
      # 3. satırda girer
      - tip: wojak
        arka: img/foto_stolberg_grunenthal_169.jpg
        bulanik: 10
        karart: 0.3
        doygunluk: 0.7
        kamera: {zoom: [1.0, 1.25], merkez: [[0.36, 0.55], [0.58, 0.55]], it: 0}
        karakterler:
          - {id: t, gorsel: img/cizim/takvim_aralik_1956.png, x: 0.3, boy: 0.56, alt: -0.05, bakis: on, giris: 0.15}
          - {id: n, gorsel: img/cizim/numune_kutusu_tabletler.png, x: 0.64, boy: 0.3, alt: -0.2, bakis: on}
          - {id: z, gorsel: chars/anlatici_sakin.png, x: 0.9, boy: 0.5, yon: alt}
        satirlar:
          - "Aralık 1956. Bir Grünenthal çalışanının kızı dünyaya geliyor."
          - "Babası, hamile eşine firmanın numune tabletlerinden getirmiş."
          - "Bebekte bir doğum kusuru var. O gün kimse bunu ilaçla ilişkilendirmiyor."
        olaylar:
          - {tip: giris, karakter: n, satir: 2, ofset: 1.0}
          - {tip: giris, karakter: z, satir: 1, ofset: 1.2}   # 5. tur: takvim 6 sn tek başına kalıyordu
          - {tip: yuz, karakter: z, gorsel: chars/anlatici_dusunceli.png, satir: 3, ofset: 1.8}
          - {tip: kelime, metin: "BAĞLANTI KURULMUYOR", satir: 3, ofset: 1.9, sure: 2.3, konum: ust}

      # B1.2 · bilinen ilk vaka -> geri sar: 1954. 4. tur: geri sarma sesi soru bitince (hecelerin üstündeydi)
      - tip: zaman_cizelgesi
        baslik: "Bilinen ilk vaka"
        arka: img/foto_kupferhof_grunenthal_169.jpg
        gecis: gecis
        kose: {metin: "{}", deger: 1956, yil: true}
        konuk: [{id: z, gorsel: chars/anlatici_dusunceli.png, x: 0.89, boy: 0.42, giris: false}]
        noktalar:
          - {tarih: "1954", metin: "?"}
          - {tarih: "Aralık 1956", metin: "bilinen ilk vaka"}
        satirlar:
          - "Bugün o bebek, facianın bilinen ilk vakası sayılıyor."
          - "Peki o ilaç neydi?"
        olaylar:
          - {tip: nokta, indeks: 2, t: 0.3}
          - {tip: nokta, indeks: 1, satir: 2, ofset: 0.3}
          - {tip: kose, deger: 1954, yil: true, satir: 2, ofset: 0.0, sure: 0.9}
