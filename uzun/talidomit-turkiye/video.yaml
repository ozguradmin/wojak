        muzik_mod: major
        bas: 1.0                    # soru belirip kartlar inince sorulur
        ust: "SON SORU"
        soru: "Türkiye'yi bu ilaçtan ne korudu?"
        secenekler:
          # 11. tur (animasyon S9): vurguda kartın içi de oynar: A sakinden kararlı yüze geçer + küçük "HAYIR" damgası,
          # B'de 1928 sayfasına yeşil "RUHSAT ŞART" iner, C'de zarlar bir tur yuvarlanır (motor; alt yazılar 34 px)
          - {metin: "KAYMAKÇALAN", alt: "bir uzmanın ‘hayır’ı", gorsel: chars/kaymakcalan_v2_sakin.png,
             vurgu_gorsel: chars/kaymakcalan_v2_kararli.png, damga: "HAYIR"}
          - {metin: "KURAL", alt: "1928 · ruhsat şartı", gorsel: img/cizim/kanun_1262_sayfa.jpg,
