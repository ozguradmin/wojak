        karakter: {gorsel: chars/anlatici_v2_sakin.png, yuz: chars/anlatici_v2_mutlu.png, boy: 0.37}   # 8. tur (animasyon S1): büyük ve etkin
        bos_alan: true              # sağ üstte ~280x280 px: istenirse YouTube'un kendi "Abone ol" öğesi (video kutusu YOK)
        satirlar:
          - "Sizce hangisi?"
          - {metin: "Bir sonraki unutulmuş hikâyede görüşmek üzere.", hiz: 0.84, once: 2.9}
        olaylar:
          # 12. tur (izlenme 4, animasyon S5): kartların tepkileri (A: HAYIR, B: RUHSAT ŞART, C: zar) vedadan sonra, son
          # 1,6 sn'deydi: soru sorulur sorulmaz A, B, C ~0,85 sn arayla; abone/zil/beğen ve yorum ondan sonra
          - {tip: secenek, indeks: 1, satir: 1, an: son, ofset: 0.15}
          - {tip: secenek, indeks: 2, satir: 1, an: son, ofset: 1.0}
          - {tip: secenek, indeks: 3, satir: 1, an: son, ofset: 1.85}
