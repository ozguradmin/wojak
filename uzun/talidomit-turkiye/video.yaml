        bulanik: 10
        sure: 11.8                 # 12. tur: yorum balonu soruyu son 0,3 sn'de bitiriyordu; 14. tur (animasyon S3, izlenme N10): tamamlanan yorum ~1,3 sn kalıp itme sürerken sert kesiliyordu: yorum gönderilir (tık + baş onayı), itme 0,8 sn önce oturur
