# Talidomit ve Türkiye — uzun YouTube videosu (~9-10 dk). Senaryo: senaryo_v2 (12.10.2026, baş yazar revizyonu;
# iki eleştiri uygulandı). Varlıklar ve lisanslar: VARLIKLAR.md. Sahne kompozitleri: img/kompozit_uret.py.
# Motor: docs/UZUN_MOTOR.md. Kararlar: docs/UZUN_FORMAT.md.
#
# Olgu sınırları (senaryo "Hassas cümleler" tablosu; değiştirmeden önce oku):
#   - Kaymakçalan'ın olumsuz görüşü meslektaşlarının tanıklığına dayanır ("meslektaşlarının anlattığına göre").
#   - Aygün'ün tavuk embriyosu deneyi "anlatılana göre"; bilinen en eski kaynağı 2008 tarihli bir haber; ikisi aynı
#     karede ya da birbirine bağlı gösterilmez (panoda ayrı ipler yalnız Bakanlık kartına).
#   - Başvurunun yılı, firması, ürün adı bilinmiyor: ekranda yıl yok; Lille laboratuvarına yer etiketi yok
#     ("temsilî görüntü"); A temsilci yalnız Türkiye sahnelerinde (Grünenthal'in başvurduğu izlenimi olmasın).
#   - Haritada yalnız satıldığı belgeli ülkeler boyanır; "46"yı köşe göstergesi taşır.
#   - Mağdur görüntüsü yok: bebek/anne/hasta çizilmez; ölüm oranı noktaların sessizce sönmesiyle (efekt yok).
#   - Telifli görseller (img/telifli/) hesap sahibi karar verene kadar KULLANILMAZ: serbest yedekleri kullanılıyor
#     (Distaval yazı kartı, KÜB 4.4 yazı kartı, bülten bilgi kartı, adsız şişe çizimi).
#
# Akış: python -m wojak uzun kontrol uzun/talidomit-turkiye
#       python -m wojak uzun seslendir uzun/talidomit-turkiye --qa
#       python uzun/talidomit-turkiye/ses_onarim.py                 # önbellekteki çekimlerden kelime onarımı (13.10:
#                                                                   # Cartesia kotası bitti; kota gelince bkz. rapor)
#       python uzun/talidomit-turkiye/img/kompozit_uret.py pano     # KP.2'nin pano karesi (seslendirmeden sonra)
#       python -m wojak uzun render uzun/talidomit-turkiye           # -> out/talidomit-turkiye-uzun/
#
# 2. hakem turu (13.10.2026): vurgu efektleri (Türkiye motifi, damga, boom, hit) cümle BİTİŞİNE çapalı + vurgu
# satırına `sonra`; gerçek kişilere balon yok (özet kelime/kart); bölüm 5 Ankara zeminlerinde; müzik kipleri
# (nabiz/gerilim/major) ve kart kabarmaları.
# 3. hakem turu (13.10.2026): kanca okunur (beyaz damga denizde, 1,3 sn) + kapı sahnesi (ilk wojak 0:11); bütün
# vurgu damgaları en az 1,2 sn ekranda; çakışmalar; doruk (B5.3b) wojak sahnesi; B2.5 ve B5.8 bölündü/birleşti;
# müzik -18/-12 + nefes araları; Cartesia kotası hâlâ yok: metni kısalan satırlar (Ama, Bilanço, 1962, Üstelik)
# önbellekteki çekimden kesildi, "cüzzam" z'si uzatıldı (ses_onarim.py).
id: talidomit-turkiye
baslik: "Türkiye Bu İlaca Neden ‘Hayır’ Dedi?"

anlatici: {ses: murat, hiz: 1.0}   # hız testi (uretici_raporu.md): 0.95 ile 1.0 arasında süre farkı ~%1, 1.0 seçildi
telaffuz:                          # yalnız TTS metnine; uzun olan önce
  Frances Oldham Kelsey: Frensis Oldım Kelsi
  Widukind Lenz: Vidukind Lents
  Jacob Sheskin: Yakob Şeskin
  Kelsey: Kelsi
  Lenz: Lents
  Grünenthal: Grünental
  Contergan: Kontergan
  SALL4: Sal dört
  K 17: Ka on yedi
  Talidomid: Talidomit
qa:
  isimler: [Kaymakçalan, Süreyya Tahsin Aygün, Contergan, talidomit, Talidomid, Grünenthal, Lenz, Kelsey, Kevadon,
            Distaval, Sheskin, Eczacıbaşı, Refik Saydam, Cerrahpaşa, Behçet, SALL4, miyelom, Kennedy, ABD, FDA]

muzik: {uret: true, tohum: 1961, seviye: -18, acik: -12}   # 3. tur: -22/-15'te telefonda duyulmuyordu (sesin ~20 dB altı)
zamanlama: {bas: 0.2, ara: 0.2, son: 0.32, bindirme: 1.2, max_bos: 6.0}
gecis: kesme
kart_bindirme: true

bolumler:
  # ================================================================================================ SOĞUK AÇILIŞ
  - baslik: Soğuk açılış
    youtube: "Giriş"
    kart: false
    sahneler:
      # SA.1a · dünya haritası: belgeli ülkeler satır boyunca tek tek kırmızı, köşede 1 -> 46 ÜLKE (Türkiye gri)
      # (2. hakem turu: eskiden 12 ülke 1,5 sn'de boyanıp 2-8 sn arası yalnız köşe sayacı değişiyordu; kanca 3 çekime
      # bölündü: harita / tam ekran 10.000+ sayaç / Akdeniz'de yeşil Türkiye + damga)
      # 3. tur: kare 0'da "1 ÜLKE" yazarken iki ülke kırmızıydı: ilk kare yalnız Almanya (köşe 1), geri kalanlar köşe
      # sayacıyla birlikte satır başında (büyükler önce: dünya ölçeğinde görünsün)
      - tip: harita
        bolge: dunya
        ulkeler: [DEU, CAN, BRA, GBR, AUS, ITA, JPN, AUT, CHE, BEL, NLD, LUX]
        aralik: 0.2
        aciklama: "kırmızı: satıldığı belgelenen ülkelerden bazıları"
        zoom: [1.0, 1.14]
        bas: 0.6
        son: 0.15
        muzik_db: -10
        kose: {metin: "{} ÜLKE", deger: 1}
        satirlar:
          - "Kırk altı ülkede satılan bir ilaç."
        olaylar:
          - {tip: basla, satir: 1, ofset: -0.1}
          - {tip: ulke, kod: DEU, t: 0.0}
          - {tip: kose, deger: 46, satir: 1, ofset: 0.1, sure: 2.0}
        sfx:
          - {ad: boom, t: 0.0, db: -8}

      # SA.1b · tam ekran sayaç: 10.000+ bebek (bebek/kişi görüntüsü yok)
      - tip: sayac
        deger: 10000
        sonek: "+"
        ust: "Dünyada"
        etiket: "bebek · ağır doğumsal kusur"
        renk: kirmizi
        sure_say: 3.4              # 3. tur: 2,2'de bitip 2,5 sn duruyordu; satır boyunca sayar
        gecis: gecis
        bas: 0.1
        son: 0.2
        muzik_db: -10
        satirlar:
          - "On binden fazla bebek, bu ilaç yüzünden ağır doğumsal kusurlarla dünyaya geldi."
        olaylar: [{tip: basla, satir: 1, ofset: 0.05}]

      # SA.2 · Akdeniz: Türkiye yeşile döner, motif + "RUHSAT VERİLMEDİ" damgası cümle bitince (kelimeyi örtmesin).
      # 3. tur: koyu kırmızı damga lacivert denizde okunmuyor, Türkiye'nin üstüne biniyor ve 0,8 sn'de kesiliyordu:
      # beyaz, denizde (Türkiye'nin güneyi), 1,3 sn ekranda; çağrı kutusu yalnız "TÜRKİYE" (damgayı tekrar etmesin)
      - tip: harita
        bolge: akdeniz
        ulkeler: [DEU, GBR, AUT, CHE, BEL, NLD, LUX, ITA]
        aralik: 0.03
        vurgu: {kod: TUR}
        zoom: [1.0, 1.25]
        gecis: gecis
        bas: 0.15
        muzik_db: -10
        satirlar:
          - {metin: "Ama Türkiye'de bu ilaca ruhsat verilmedi.", sonra: 1.3}
        olaylar:
          - {tip: basla, t: 0.0}
          - {tip: ulke, kod: TUR, satir: 1, ofset: 0.6}
          - {tip: damga, metin: "RUHSAT VERİLMEDİ", renk: beyaz, satir: 1, an: son, ofset: 0.1, x: 0.62, y: 0.82, boy: 84, aci: -6}
        sfx:
          - {ad: turkiye, satir: 1, an: son, ofset: 0.05, db: -11}

      # SA.3 · Ankara'da kapı kapanır: ilk wojak 0:11'de (K1 küçük resmindeki temsilci). Sağlık Bakanlığı binası (bugün,
      # bulanık); 3. tur: eskiden 4 sn'lik insansız panorama kaydırmasıydı, ilk wojak 0:30'da geliyordu
      - tip: wojak
        arka: img/foto_saglik_bakanligi.jpg
        odak: [0.5, 0.4]
        bulanik: 6
        karart: 0.4
        etiket: "ANKARA · TEMSİLÎ GÖRÜNTÜ"
        kamera: {zoom: [1.0, 1.1], it: 0}
        gecis: kaydir
        muzik_db: -10
        karakterler:
          - {id: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sol, x: 0.27, giris: 0.1}
          - {id: d, gorsel: img/cizim/kapi_acik.png, x: 0.72, boy: 0.85, alt: 0.04, bakis: on, giris: false}
        satirlar: [{metin: "Peki Ankara'da bu kapıyı kim kapattı?", sonra: 0.5}]
        olaylar:
          - {tip: yuz, karakter: d, gorsel: img/cizim/kapi_kapali.png, satir: 1, an: son, ofset: 0.05}
          - {tip: yuz, karakter: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gergin.png, satir: 1, an: son, ofset: 0.15}
        sfx: [{ad: kapi, satir: 1, an: son, ofset: 0.05, db: -6}]

      # SA.3 · üç soru kartı + boş dosya, BELGE: 0 (B5.8 panosunun habercisi)
      - tip: pano
        zoom: 1.15
        kose: {metin: "BELGE: {}", deger: 0}
        muzik_db: -10
        kartlar:
          - {id: f, metin: "BİR FARMAKOLOG?", x: 0.2, y: 0.33, egim: -4}
          - {id: v, metin: "BİR VETERİNER HOCA?", x: 0.5, y: 0.27, egim: 3}
          - {id: e, metin: "BİR ENSTİTÜ?", x: 0.8, y: 0.33, egim: -2}
          - {id: d, metin: "YAYIMLANMIŞ BELGE", gorsel: img/kompozit/dosya_bos_kagit.jpg, x: 0.5, y: 0.71, en: 460, egim: 1.5}
        satirlar:
          - "Herkesin bir cevabı var."
          - {metin: "Ama ortada yayımlanmış tek bir belge yok.", sonra: 1.2}
        olaylar:
          - {tip: kart, id: f, satir: 1, ofset: 0.0}
          - {tip: kart, id: v, satir: 1, ofset: 0.4}
          - {tip: kart, id: e, satir: 1, ofset: 0.8}
          - {tip: kart, id: d, satir: 2, ofset: 0.3}
          - {tip: damga, kart: d, metin: "BOŞ", satir: 2, an: son, ofset: 0.05, boy: 58, aci: -9}
          - {tip: kose, deger: 0, satir: 2, an: son, ofset: 0.1}

      # SA.4 · Contergan tenekesi (3. tur: ikinci cümle ayrı wojak sahnesine; teneke 8 sn ekranda kalıyordu)
      - tip: foto
        gorsel: img/foto_contergan_teneke.jpg
        etiket: "CONTERGAN · BATI ALMANYA, 1957"
        atif: "Fotoğraf: Kai Oesterreich, CC BY-SA 3.0"
        egim: -2.5
        zoom: 1.14
        gecis: kaydir
        muzik_db: -10
        satirlar:
          - "1957. Batı Almanya. Reçetesiz satılan yeni bir uyku ilacı."
        olaylar:
          - {tip: kelime, metin: "REÇETESİZ", satir: 1, ofset: 1.9, sure: 1.6, konum: ust}

      # SA.4b · eczanede anne adayı (yalnız sakin yüz; mağdur değil) + numune kutusu
      - tip: wojak
        arka: img/arka_eczane_raflar_169.jpg
        bulanik: 3
        karart: 0.18
        kamera: {zoom: [1.0, 1.08], merkez: [[0.5, 0.5], [0.45, 0.5]], it: 0}
        gecis: kaydir
        muzik_db: -10
        karakterler:
          - {id: m, gorsel: chars/anne_adayi_sakin.png, taraf: sol, x: 0.3, boy: 0.74, giris: 0.05}
          - {id: k, gorsel: img/cizim/numune_kutusu_tabletler.png, x: 0.68, boy: 0.3, alt: 0.07, bakis: on, giris: 0.35}
        satirlar: ["Kısa süre sonra hamileler bile kullanıyor."]
        olaylar:
          - {tip: kelime, metin: "HAMİLELER BİLE", satir: 1, ofset: 0.8, sure: 1.9, konum: ust}

      # SA.5 · reklam vaadi; Aylin "Tamamen zehirsiz." (B6.7'de aynı kayıt)
      - tip: metin
        ust: "Almanya'daki reklamlardan"
        metin: "„völlig ungiftig“"
        ceviri: "tamamen zehirsiz"
        arka: img/foto_contergan_teneke_169.jpg
        gecis: gecis
        muzik_db: -10
        satirlar:
          - "Reklamlarına göre bu ilaç…"
          - {ses: aylin, metin: "Tamamen zehirsiz.", duygu: content}
        olaylar: [{tip: ceviri, satir: 2, ofset: -0.05}]

      # SA.6-SA.7 · kısa videoya selam: A temsilci, adsız kutu, kapı vuruşu, gergin yüz
      - tip: wojak
        arka: img/arka_lille_lab_169.jpg
        kamera: {zoom: [1.0, 1.12], merkez: [[0.5, 0.5], [0.46, 0.56]], it: 0}
        muzik_db: -10
        karakterler:
          - {id: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gulumsuyor.png, taraf: sol, x: 0.28}
          # 3. tur: kutu havada asılı duruyordu; alt kenarı kadrajın altına taşar (önde, tezgâhta gibi)
          - {id: k, gorsel: img/cizim/numune_kutusu.png, x: 0.56, boy: 0.24, alt: 0.07, bakis: on, giris: 0.6}
        satirlar:
          - "Bu hikâye 1961'de bitmedi."      # ses: 'Üstelik' kesildi (ses_onarim.py ustelik)
          - {metin: "Aynı ilaç, kırk yılı aşkın bir süre sonra, Türkiye'nin kapısını bir kez daha çalacaktı.", sonra: 0.35}
          - "Bu, o kapının hikâyesi."
        olaylar:
          - {tip: kelime, metin: "KIRK YILI AŞKIN BİR SÜRE SONRA", satir: 2, ofset: 0.5, sure: 2.0, konum: ust}
          - {tip: yuz, karakter: a, gorsel: episodes/talidomit-turkiye/chars/temsilci_gergin.png, satir: 2, an: son, ofset: 0.1}
        sfx:   # kapı vuruşu cümle bitince (kelimenin üstünde değil): iki tok vuruş + gergin yüz
          - {ad: kapi, satir: 2, an: son, ofset: 0.02, db: -6}

  # ================================================================================================ BÖLÜM 1
  - baslik: Zehirsiz Mucize
    youtube: "1 · Zehirsiz Mucize"
    kart_marka: true
    kart_sure: 1.5
    sahneler:
      # B1.1 · Aralık 1956; doğum yeri yok, bebek/anne çizimi yok
      - tip: wojak
        arka: img/foto_kupferhof_grunenthal_169.jpg
        bulanik: 10
        karart: 0.45
        doygunluk: 0.7
        # 3. tur: kamera takvimden tabletlere yürür (13 sn'lik durağan takvim); anlatımı tekrarlayan etiket kalktı
        kamera: {zoom: [1.0, 1.2], merkez: [[0.36, 0.55], [0.66, 0.58]], it: 0}
        karakterler:
          - {id: t, gorsel: img/cizim/takvim_aralik_1956.png, x: 0.3, boy: 0.56, alt: -0.2, bakis: on, giris: 0.15}
          - {id: n, gorsel: img/cizim/numune_kutusu_tabletler.png, x: 0.72, boy: 0.3, alt: -0.2, bakis: on}
        satirlar:
          - "Aralık 1956. Bir Grünenthal çalışanının kızı dünyaya geliyor."
          - "Babası, hamile eşine firmanın numune tabletlerinden getirmiş."
          - "Bebekte bir doğum kusuru var. O gün kimse bunu ilaçla ilişkilendirmiyor."
        olaylar:
          - {tip: giris, karakter: n, satir: 2, ofset: 1.0}
          - {tip: kelime, metin: "BAĞLANTI KURULMUYOR", satir: 3, ofset: 1.9, sure: 2.3, konum: ust}

      # B1.2 · bilinen ilk vaka -> geri sar: 1954
      - tip: zaman_cizelgesi
        baslik: "Bilinen ilk vaka"
        arka: img/foto_kupferhof_grunenthal_169.jpg
        gecis: gecis
        kose: {metin: "{}", deger: 1956, yil: true}
        noktalar:
          - {tarih: "1954", metin: "?"}
          - {tarih: "Aralık 1956", metin: "bilinen ilk vaka"}
        satirlar:
          - "Bugün o bebek, facianın bilinen ilk vakası sayılıyor."
          - "Peki o ilaç neydi?"
        olaylar:
          - {tip: nokta, indeks: 2, t: 0.3}
          - {tip: nokta, indeks: 1, satir: 2, ofset: 0.3}
          - {tip: kose, deger: 1954, yil: true, satir: 2, ofset: 0.0, sure: 0.9}
        sfx: [{ad: geri_sarma, satir: 2, ofset: 0.0, db: -6}]

      # B1.3 · Kupferhof Grünenthal; molekül, K 17 damgası, TALİDOMİT
      - tip: wojak
        arka: img/foto_kupferhof_grunenthal_169.jpg
        bulanik: 0.8
        karart: 0.42
        kamera: {zoom: [1.0, 1.1], merkez: [[0.5, 0.5], [0.5, 0.45]], it: 0}
        etiket: "KUPFERHOF GRÜNENTHAL · STOLBERG"
        gecis: kaydir
        karakterler:
          - {id: m, gorsel: img/cizim/molekul_beyaz.png, x: 0.5, boy: 0.42, alt: -0.26, bakis: on}
        satirlar:
          - "1954'te Alman ilaç firması Grünenthal'in laboratuvarında yeni bir molekül sentezleniyor."
          - "Kod adı: K 17."
          - "Bu molekülün adı: talidomit."
        olaylar:
          - {tip: giris, karakter: m, satir: 1, an: son, ofset: -1.6}
          - {tip: damga, metin: "K 17 · 1954", satir: 2, ofset: 0.4, x: 0.8, y: 0.22, boy: 70, aci: 6}
          - {tip: kelime, metin: "TALİDOMİT", satir: 3, ofset: 0.9, sure: 2.0, konum: alt}

      # B1.4 · fareler; doz büyür, ölüm yok
      - tip: wojak
        arka: img/doku_kagit.jpg
        bulanik: 0
        karart: 0
        doygunluk: 1.0
        kamera: {zoom: [1.0, 1.05], it: 0}
        gecis: gecis
        karakterler:
          - {id: k, gorsel: img/cizim/fare_kafesi.png, x: 0.34, boy: 0.42, alt: -0.2, bakis: on, giris: 0.1}
          - {id: s, gorsel: img/kompozit/doz_1.png, x: 0.75, boy: 0.52, alt: -0.16, bakis: on}
        satirlar:
          - "Önce farelerde deneniyor."
          - {metin: "Dozu ne kadar artırırlarsa artırsınlar, fareler ölmüyor.", sonra: 1.1}
        olaylar:
          - {tip: giris, karakter: s, satir: 2, ofset: 0.0}
          - {tip: yuz, karakter: s, gorsel: img/kompozit/doz_2.png, satir: 2, ofset: 0.9}
          - {tip: yuz, karakter: s, gorsel: img/kompozit/doz_3.png, satir: 2, ofset: 1.8}
          - {tip: damga, metin: "ÖLÜM YOK", renk: yesil, satir: 2, an: son, ofset: 0.05, x: 0.34, y: 0.3, boy: 76, aci: -6}
        sfx:
          - {ad: pop, satir: 2, ofset: 0.9, db: -8}
          - {ad: pop, satir: 2, ofset: 1.8, db: -8}

      # B1.4 · firmanın sonucu (kendi kartımız) + fosforlu kalem
      - tip: manset
        gorsel: img/kompozit/kart_neredeyse_zehirsiz.jpg
        kutular: [[132, 538, 1334, 659]]
        zoom: 1.15
        gecis: gecis
        satirlar: ["Firma bundan bir sonuç çıkarıyor: Bu ilaç neredeyse zehirsiz."]
        olaylar: [{tip: vurgula, kutu: 1, satir: 1, an: son, ofset: -1.5}]

      # B1.5 · kontrol listesi (kâğıt): ölçülmedi / yapılmadı
      - tip: wojak
        arka: img/doku_kagit.jpg
        bulanik: 0
        karart: 0.04
        doygunluk: 1.0
        kamera: {zoom: [1.0, 1.04], it: 0}
        karakterler:
          - {id: a, gorsel: img/kompozit/serit_kan_duzeyi.png, x: 0.5, boy: 0.2, alt: -0.5, bakis: on, giris: 0.15}
          - {id: b, gorsel: img/kompozit/serit_gebe_deney.png, x: 0.5, boy: 0.2, alt: -0.26, bakis: on}
        satirlar:
          - "Oysa kandaki ilaç düzeyini ölçen yok."
          - {metin: "En önemlisi: İlaç hiçbir gebe hayvanda denenmiyor.", sonra: 1.2}   # damga >= 1,2 sn
        olaylar:
          - {tip: giris, karakter: b, satir: 2, ofset: 0.2}
          - {tip: damga, metin: "YAPILMADI", satir: 2, an: son, ofset: 0.05, x: 0.74, y: 0.67, boy: 80, aci: -8}
        sfx: [{ad: boom, satir: 2, an: son, ofset: 0.05, db: -10}]

      # B1.6 · Gießen 1957 + takvim + Contergan forte baskısı
      - tip: wojak
        arka: img/foto_giessen_1957_169.jpg
        bulanik: 0.5
        karart: 0.14
        doygunluk: 0.95
