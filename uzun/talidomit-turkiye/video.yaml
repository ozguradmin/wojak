      # KP.4-KP.5 · 7. tur: kapanış çağrısı (hesap sahibi 13.10: "sıradaki video" kutuları kalktı, kanalda henüz 2 uzun
      # video yok; abone/beğen/yorum çağrısı hikâyeye bağlı). KP.1'in açık sorusu üç ayrı seçenek kartıyla geri gelir:
      # kahraman (Kaymakçalan'ın 'hayır'ı), kural (1928), şans. Kartlar birbirine bağlanmaz; Aygün'ün anlatısı belgesiz
      # olduğu için seçenek değil (OGRENILENLER §2.7: Aygün ile Kaymakçalan aynı karede yok). Anlatıcı (v2) alttan
      # yükselir, imleci ABONE OL'a, zile, BEĞEN'e tıklar (abonede gülümser); yorum balonu soruyu yazar; A/B/C tek tek
