paket:
  baslik_alternatifleri:   # 7. tur (hesap sahibi: "AI slop gibi durmasın"): 3 seçenek = baslik + bu ikisi
    - "Talidomit 46 Ülkede Satıldı. Ankara’da ‘Hayır’ Diyen Kimdi?"   # 8. tur (dil N3): kıvrık kesme işareti
    - "10 Binden Fazla Bebeği Etkileyen İlaca Türkiye Neden Ruhsat Vermedi?"
  aciklama: |
    Talidomit (Almanya'daki adıyla Contergan) 1957'den itibaren onlarca ülkede satıldı ve 10 binden fazla bebeğin ağır
    doğumsal kusurlarla dünyaya gelmesine yol açtı. Türkiye'de ise bu ilaca ruhsat verilmedi. Bu videoda o kararın
    bilinen ve bilinmeyen yanlarını, hikâyenin 2004'teki beklenmedik devamıyla birlikte anlatıyoruz. Türkiye bölümü hakkında not: Bu bölümün bir kısmı
    belgeye değil tanıklığa dayanıyor. Şükrü Kaymakçalan'ın olumsuz görüşünü meslektaşları anlatıyor (TFD Bülteni,
    2012). Süreyya Tahsin Aygün'e atfedilen tavuk embriyosu deneyinin bilinen en eski kaynağı 2008 tarihli bir
    haber; haberin kaynağı belge sunamadı. Başvurunun yılı, başvuran firma ve Bakanlığın yazısı bugüne kadar yayımlanmadı. O yıllardan
    bir belgeniz varsa yorumlara yazın.
  short_url: "https://youtube.com/shorts/Fb77-MsYmRc"   # 23.10: kısa sürüm YouTube'da yayında
  short_baglanti: "teslim/talidomit-turkiye (Short; 'İlgili video' olarak bu uzun video bağlanır). Uzun video
    yayımlanınca: episodes/talidomit-turkiye/episode.yaml uzun_video + python -m wojak paket episodes/talidomit-turkiye
    (Short'un açıklamasına 'Uzun hâli kanalda' satırı)"
  ara_reklam: [3, 5]        # 3. ve 5. bölümün siyah kartının İÇİNDEKİ ilk tam saniye ("Anne karnında." ve "ANKARA" sonrası)
  yapay_icerik: >-
    'Hayır' öner. Seslendirme yapay zekâ (Cartesia) ama yalnız anlatıcı ile reklam sloganı ve ürün bilgisi
    alıntıları; gerçek bir kişinin sesi ya da görüntüsü üretilmedi, sahneler açıkça çizim. Açıklamadaki
    'Seslendirme yapay zekâ ile üretilmiştir' satırı kalsın.
  ek_maddeler:
    - "Küçük resim: K1 (zehirsiz) ANA küçük resim. 'Test ve karşılaştır' açılırsa YALNIZ K1 ile K3 (izlenme hakemi:
      K2 168 px'te en zayıfı; 11. turda harita uzaklaştı ama yine yedek; 12. turda K3'te K1'in temsilcisi yerine belge arayan, terleyen anlatıcı: test yalnız yazıyı değil yüzü de karşılaştırır). K2'yi yalnız başlık 3 ile kullan (yazısı
      '46 ÜLKEDE SATILDI', başlık 1 ve 2'deki '46 Ülkede'yi tekrar eder). Başlık testi açılırsa başlık 1
      ile başlık 3'ü ('10 Binden Fazla Bebeği…': bedeli söyler) karşılaştır. Başlık 2 ('Kimdi?') yedek: video adı
      yalnız meslektaş tanıklığıyla verebiliyor, 'tık tuzağı' yorumu çekebilir."
    - "Sabit yorum kapanıştaki soruyla aynı (A/B/C): yayından hemen sonra sabitle; ilk cevaplara kalp ver."
    - "Süre (paketin başındaki 'Süre' satırı) UZUN_FORMAT'taki 8-10 dk kararının ~30 sn üstünde (bilinçli: 11. ve 12. turda dil hakeminin
      isteğiyle yavaşlatılan satırlar ve duraklar, Türkiye vuruşunun tutulması). YouTube için sorun değil; kısaltmak
      istersen söyle (aday: B6.5 Behçet sahnesi)."
