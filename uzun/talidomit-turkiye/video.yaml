paket:
  baslik_alternatifleri:
    - "46 Ülkede Satılan Bu İlaca Türkiye Neden ‘Hayır’ Dedi?"
    - "46 Ülkede Satıldı, Türkiye Kapıyı Kapattı: Talidomit (Contergan) Faciası"
    - "Türkiye'yi Bir İlaç Faciasından Koruyan, Belgesi Bulunamayan Karar"
  aciklama: |
    Talidomit (Almanya'daki adıyla Contergan) 1957-1961 arasında onlarca ülkede satıldı ve 10 binden fazla bebeğin ağır
    doğumsal kusurlarla dünyaya gelmesine yol açtı. Türkiye'de ise bu ilaca ruhsat verilmedi. Bu videoda o kararın
    bilinen ve bilinmeyen yanlarını anlatıyoruz: kim görüş verdi, ne anlatılıyor, elimizde hangi belge var,
    hangisi yok. Bir de hikâyenin 2004'teki beklenmedik devamını. Türkiye bölümü hakkında not: Bu bölümün bir kısmı
    belgeye değil tanıklığa dayanıyor. Şükrü Kaymakçalan'ın olumsuz görüşünü meslektaşları anlatıyor (TFD Bülteni,
    2012). Süreyya Tahsin Aygün'e atfedilen tavuk embriyosu deneyinin bilinen en eski kaynağı 2008 tarihli bir
    haber; haberin kaynağı belge sunamadı. Başvurunun yılı, başvuran firma ve Bakanlığın yazısı bugüne kadar yayımlanmadı. O yıllardan
    bir belgeniz varsa yorumlara yazın.
  short_url: ""
  short_baglanti: "teslim/talidomit-turkiye (Short; 'İlgili video' olarak bu uzun video bağlanır). Uzun video
    yayımlanınca: episodes/talidomit-turkiye/episode.yaml uzun_video + python -m wojak paket episodes/talidomit-turkiye
    (Short'un açıklamasına 'Uzun hali kanalda' satırı)"
  ara_reklam: [3, 5]        # 3. ve 5. bölümün siyah kartının İÇİNDEKİ ilk tam saniye ("Anne karnında." ve "ANKARA" sonrası)
  yapay_icerik: >-
    'Hayır' öner. Seslendirme yapay zekâ (Cartesia) ama yalnız anlatıcı ile reklam sloganı ve ürün bilgisi
    alıntıları; gerçek bir kişinin sesi ya da görüntüsü üretilmedi, sahneler açıkça çizim. Açıklamadaki
    'Seslendirme yapay zekâ ile üretilmiştir' satırı kalsın.
  ek_maddeler:
    - "Küçük resim 'Test ve karşılaştır' sırası: K1 (zehirsiz) / K3 (belge) / K2 (harita), başlık 1 ile. Studio
      başlık testini de açıyorsa başlık 1 ile başlık 2'yi (54 karakter: sayı + 'hayır' sorusu) karşılaştır. Başlık 3
      seçilirse K2'yi testten çıkar (yazısı başlık 3'ün '46 Ülkede Satıldı' kelimelerini tekrar eder)."
  # Yayından önce kulakla dinlenecek satırlar (Cartesia kotası bitti: yeniden seslendirilemedi). Paket her satırın
  # başladığı anı zaman çizelgesinden yazar. Not: kısa açıklama; ayrıntı üretici raporunda.
  dinle:
    - {ara: "cüzzam hastası", not: "onarıldı (z uzatıldı); Whisper artık 'cüzzam' duyuyor, önce 'cüzdan'"}
    - {ara: "cüzzamın bir komplikasyonu", not: "onarıldı; önce 'cüzağımın'"}
    - {ara: "cüzzam tedavisinde", not: "onarıldı; önce 'cüzdan'"}
    - {ara: "Hikâye gazetelere düşüyor", not: "'1962 yazında' kesildi ('1960, iki' okunuyordu): başlangıç doğal mı"}
    - {ara: "Dünyada on binden fazla", not: "'Bilanço ağır.' kesildi ('Blancho' okunuyordu)"}
    - {ara: "Grünenthal çalışanının", not: "'çalışanın' gibi duyulabilir"}
    - {ara: "gebe hayvanda denenmiyor", not: "'denemiyor' gibi duyulabilir"}
    - {ara: "Kelsey'yi bir devlet", not: "'Kelsey bir' gibi duyulabilir"}
    - {ara: "ilaç kurumu FDA", not: "'FTA' gibi duyulabilir (çekim birleştirildi)"}
    - {ara: "Lenz'i iftirayla", not: "ek onarıldı ('Lentsi'); dinle"}
    - {ara: "taahhütlü bir mektupla", not: "'tahütlü … iniliyor' gibi duyulabilir"}
    - {ara: "ruhsat almayan ilaç", not: "'ruhsatılmayan' gibi duyulabilir"}
    - {ara: "kasım başında", not: "'kasın' gibi duyulabilir"}
    - {ara: "doksan altı hastanın", not: "'aslanın' gibi duyulabilir"}
    - {ara: "Bu kadarını anlamak", not: "'Ama' kesildi; 'kaderini' gibi duyulabilir"}
    - {ara: "söyleşisinde", not: "'söyleştisinde' gibi duyulabilir; 'Nejat' 'Necat' gibi"}
