  sabit_yorum: |   # 7. tur: kapanış çağrısının sorusuyla aynı (A/B/C)
    Videonun sonundaki soru: Sizce Türkiye'yi bu ilaçtan ne korudu?
    A) Bir uzmanın ‘hayır’ı (anlatılana göre Kaymakçalan)
    B) 1928'den beri yürürlükte olan ruhsat kuralı
    C) Biraz da şans
    Cevabınızı ve nedenini yazın.

    Bu hikâyenin eksik parçası belge. Türkiye'deki ret kararının yılı, başvuran firma ve Sağlık Bakanlığı'nın yazısı bugüne kadar yayımlanmadı. Elinizde 1950'ler ya da 1960'ların başından bir gazete kupürü, resmî yazı, bir hekimin notu ya da ailenizden dinlediğiniz bir anı varsa buraya yazın. Kaynağıyla gelen her bilgiyi inceleyip gerekirse açıklamaya ekleyeceğiz.

    Videoda yanlış bulduğunuz bir bilgi varsa kaynağıyla birlikte yazmanız yeterli. Kaynaklar açıklamada.
