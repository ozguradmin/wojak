# Talidomit ve Türkiye — uzun YouTube videosu (~9-10 dk). Senaryo: senaryo_v2 (12.10.2026, baş yazar revizyonu;
# iki eleştiri uygulandı). Varlıklar ve lisanslar: VARLIKLAR.md. Sahne kompozitleri: img/kompozit_uret.py.
# Motor: docs/UZUN_MOTOR.md. Kararlar: docs/UZUN_FORMAT.md.
#
# Olgu sınırları (senaryo "Hassas cümleler" tablosu; değiştirmeden önce oku):
#   - Kaymakçalan'ın olumsuz görüşü meslektaşlarının tanıklığına dayanır ("meslektaşlarının anlattığına göre").
#   - Aygün'ün tavuk embriyosu deneyi "anlatılana göre"; bilinen en eski kaynağı 2008 tarihli bir haber; ikisi aynı
#     karede ya da birbirine bağlı gösterilmez (panoda ayrı ipler yalnız Bakanlık kartına).
#   - Başvurunun yılı, firması, ürün adı bilinmiyor: ekranda yıl yok; Lille laboratuvarına yer etiketi yok
#     ("temsilî görüntü"); A temsilci yalnız Türkiye sahnelerinde (Grünenthal'in başvurduğu izlenimi olmasın).
#   - Haritada yalnız satıldığı belgeli ülkeler boyanır; "46"yı köşe göstergesi taşır.
#   - Mağdur görüntüsü yok: bebek/anne/hasta çizilmez; ölüm oranı noktaların sessizce sönmesiyle (efekt yok).
#   - Telifli görseller (img/telifli/) hesap sahibi karar verene kadar KULLANILMAZ: serbest yedekleri kullanılıyor
#     (Distaval yazı kartı, KÜB 4.4 yazı kartı, bülten bilgi kartı, adsız şişe çizimi).
#
# Akış: python -m wojak uzun kontrol uzun/talidomit-turkiye
#       python -m wojak uzun seslendir uzun/talidomit-turkiye --qa
#       python uzun/talidomit-turkiye/ses_onarim.py                 # önbellekteki çekimlerden onarım (5. tur: yalnız
#                                                                   # cüzzam z'si ve <break> durak kısaltması)
#       python uzun/talidomit-turkiye/img/kompozit_uret.py pano     # KP.2'nin pano karesi (seslendirmeden sonra)
#       python -m wojak uzun render uzun/talidomit-turkiye           # -> out/talidomit-turkiye-uzun/
#
# 2. hakem turu (13.10.2026): vurgu efektleri (Türkiye motifi, damga, boom, hit) cümle BİTİŞİNE çapalı + vurgu
# satırına `sonra`; gerçek kişilere balon yok (özet kelime/kart); bölüm 5 Ankara zeminlerinde; müzik kipleri
# (nabiz/gerilim/major) ve kart kabarmaları.
# 3. hakem turu (13.10.2026): kanca okunur (beyaz damga denizde, 1,3 sn) + kapı sahnesi (ilk wojak 0:11); bütün
# vurgu damgaları en az 1,2 sn ekranda; çakışmalar; doruk (B5.3b) wojak sahnesi; B2.5 ve B5.8 bölündü/birleşti;
# müzik -18/-12 + nefes araları; Cartesia kotası hâlâ yok: metni kısalan satırlar (Ama, Bilanço, 1962, Üstelik)
# önbellekteki çekimden kesildi, "cüzzam" z'si uzatıldı (ses_onarim.py).
# 4. tur (13.10.2026): hesap sahibi "wojak kanalı": bilgi sahnelerine köşeden tepki veren karakter (`konuk`: anlatıcı,
# Lenz, Kelsey, Kaymakçalan, Voss, Sheskin...), karakterli süre %27 -> %50+; hiçbir görsel 2'den çok çekimde değil
# (kendi çizimimiz bakanlık koridoru/odası, eczane, büro, dokular); kare parlaklığı >= ~45/255 (motor: harita ve koyu
# zemin aydınlatıldı); sayılar ekranda ve altyazıda rakamla (`tts` eski kelimeli metin: önbellek anahtarı aynı); "Arada
# bir boşluk var:" satırı çıktı; doruk ve çakışma düzeltmeleri (izlenme hakemi M1/M2). Hâlâ yeni TTS yok.
# 5. tur (13.10.2026): hesap sahibinin yeni Cartesia anahtarlarıyla (secrets.env, CARTESIA_API_KEY_2/_3) 30 satır
# yeniden seslendirildi: dil hakeminin MUST 1'i ("Asıl soruyu ise kimse araştırmamış."), kesik/uzatılmış çekimler
# (Ama/Üstelik/Bilanço/1962, FDA, Lenz'i, Reçetesiz, hız_*), "yineliyor" -> "tekrarlıyor", "hakkı bir kuruma
# veriyor" -> "başarıyı bir kuruma bağlıyor" (röportaj), "kan kanseri olan"; açıklayıcı iki noktalarda <break> (en çok
# 0,5 sn: ses_onarim.py durak). Ritim araları (dil hakemi #2), izlenme S1-S9 (kapı yakın çekimi + terleyen temsilci,
# "ANNE KARNINDA." sözle birlikte, B5.4/B2.3 konuk + Türkçe kelime, damga kontrastı/konturu, anlatıcı solda/büyük),
# B3.14 (dava) çıktı ve sahne sonu 0,26 sn (10:15 sınırı). Cüzzam satırlarının ikisi z uzatılmış eski çekim.
# 7. tur (13.10.2026, hesap sahibinin notları): bütün karakterler HAZIR KIYAFETLİ v2 çizimler (chars/KARAKTER_HARITASI.md;
# elle boyanmış tişört/önlük yok); bitişteki iki video kutusu yerine hikâyenin sorusuna bağlı kapanış çağrısı
# (`kapanis`: A/B/C + abone/zil/beğen + yorum; yeni ses yalnız "Sizce hangisi?"); animasyon hata listesi (B2-B9:
# şeritler, Kelsey kadrajı, damga yeri, isim etiketleri yüzden uzak, çağrı kutuları en az ~1 sn, kadraj taşması, dekor
# nesneleri canlı değil, SALL4 aynı tuval); hareket dili: paralaks 0.3 (dekorlu sahnelerde 0), fotoğraf zeminli wojak
# sahnelerinde doku (gren + toz). Başlık seçenekleri, sabit yorum ve telif notu yenilendi.
# 8. tur (13.10.2026, dört hakem: izlenme 8, animasyon 6,5, dil 8,4, teknik 9): motor: hareket izi keskin karakterin
# ALTINDA (hayalet yok), sayaç tekerlekleri sabit sayıda (9.999 -> 0.000 yok), sure: 0 değerinde yumruk + parlama,
# kapanışta üç kart birlikte (C cevap gibi kalmıyor), `sarsinti` olayı, `yuz {sik: false}`, karakter `golge`, kontrol'de
# aynı karakterli çapraz geçiş uyarısı. YAML: 20 çapraz geçiş kesmeye (M2), harita damgaları ve Equal Earth (M4), kapı
# 4-5 karede kapanır (SA.3, B5.4 geri çağrı, B6.6), kanca müziği -4 dB + gerilim, B5.5 çıktı, Kelsey'e itme, B1.7
# sayfaya yaklaşma. Ses: yalnız değişen 9 satır (15 istek): kupürü -> haberi, cüzzamın/multipl -> "bu hastalığın",
# FDA "Fe De A", "Reddetmiyor ama onay da vermiyor", L106/L109/L17.
# 9. tur (13.10.2026, dört hakem: izlenme 8, animasyon 7,5, dil 8,1, teknik 9): K2 "PUHSAT" (blok Türkiye'nin
# altında), B1.1 tek çekim (takvim çıkar + vurgu itmesi), yeni yüzler (Kelsey şüpheci/kararlı, Kaymakçalan kararlı,
# Aygün ciddi, balon replikleri için açık ağızlar), motor: `it` (kamera vurgu itmesi), `karart` geçişi ve zemin
# karartması, panelde sayan sayılar, takılı yıl ileri akar, sayaç boş tekerlek, daktilo geçişten sonra, SRT bölme
# sessizliğe oturur. Ses: yalnız 5 satır (96 kişinin, söz edilmiyor, taahhütlü, iki nokta durağı, kol ve bacaklar).
# 10. tur (13.10.2026, dört hakem: izlenme 8, animasyon 7,5, dil 8,3, teknik 9): motor (10. tur) isim etiketini
# karakterlerden uzak yerleştirir, sayaç değeri yerleşip okunur kalır, kontrol üst katman çakışmalarını bildirir.
# YAML: animasyon M1-M3 (isim etiketleri kısaldı, 1.267 sayımı 1,1 sn, Kennedy etiketi yasa panelinden önce),
# çakışan damgalar, yeni yüzler (anlatıcı/Lenz/Voss ciddi + anlatıcı düşünceli ayrışır; Kelsey şüpheci sırıtmaz,
# kısık gözlerde kirpik üst kapakta, dudak tonu aynı), izlenme S3-S6 (B5.4 numune kutusu kapıdan geri döner, B3.2
# damga + anlatıcı, B5.10 damga Almanya'nın üstünde, B1.7 "ŞART YOK"), kartpostal yazısı kırpıldı, ABD'deki 17
# vakanın 10'u ekranda. Ses: yalnız değişen satırlar (dil S2 'hayır'ın, S3 'sert.' durağı, N2 'Sheskin,').
# 11. tur (14.10.2026, dört hakem: izlenme 8,1, animasyon 7, dil 8,5, teknik 9): animasyon M1 (B5.4 numune kutusu
# soldan gelir, temsilcinin yüzünden geçmez), M2 (kesmede zıplayan karakterler: eşleşen yer/boy ya da karart/kaydir;
# motorun yeni `kontrol` denetimi), M3 (temsilcinin açık ağzındaki leke); yüzler (Kaymakçalan düşünceli/ciddi
# telefonda ayrışır, balonlarda kapalı -> yarık -> açık ağız), Kelsey'nin bürosu tek mekân, kapanış kartlarının içi
# oynar (motor), Sheskin'in kutusu yerinde belirir; izlenme 1-6 (Kennedy paneli, ŞART YOK aynası, HİÇBİRİ
# YAYIMLANMADI, dijital sessizlik yok, kısa Doğu Almanya yazısı, Distaval'in Türkçesi önce); dil S1 (Ankara satırları
# rubberband 0,85-0,92, yeni ses yok), S2 (SRT kırımları), S4 (efekt +0,15 sn). Küçük resim: K3 terleyen yüz, K2 uzak harita.
# 12. tur (14.10.2026, dört hakem: izlenme 8, animasyon 7,5, dil 8,2, teknik 8,5): animasyon M1 (B6.4b 0 -> 61
# sayacının yırtık rakamları: motor, yavaş sayım adım adım), teknik M1 ("cüzzam" -> "cüzdan": B6.3 "lepra" ile yeni
# çekim); izlenme 1-8 (B2.1 Türkiye vuruşu: yeşil + itme + damga + 1,1 sn; beyaz ticari adlar; dört seyrek zaman
# çizelgesi büyük yazı/konuk + B6.2 kamera; 2008 kupürü yerine pano; kapanışta A/B/C tepkileri sorudan hemen sonra;
# üç "Hayır"dan biri çıktı; boş pano kareleri; kraft zemin koyu); animasyon S1-S6 (kanca anlatıcısı ve anne adayı
# kesmede zıplamıyor, Lenz/temsilci2000 köşede göz kırpmıyor, molekül anlatıcının önünden geçmiyor, durağan anlara
# vuruş); dil S1-S9 (yedi yeni çekim, yavaşlatma ve duraklar), N2, N4, N5; teknik S1-S3. K3'te anlatıcı.
# 12. tur son bakış: B1.2 de büyük yazı/konuk (dört seyrek çizelgenin dördü), B6.3'te anlatıcı geç girer ve fark eder
# (animasyon S6), SRT blok ipuçları ("Aralık 1956." ve "Firma bastırıyor."; ses aynı), sayaçta orta hızda iz yok (motor).
id: talidomit-turkiye
baslik: "46 Ülkede Satılan İlaca Türkiye Neden ‘Hayır’ Dedi?"   # 7. tur: somut ayrıntı + merak; abartı sıfatı/emoji yok
filigran: false   # Gemini turu (23.10): gömülü filigran yok; YouTube Studio markalama filigranı (UZUN_FORMAT §2.8)

# Ses (23.10.2026, hesap sahibi): Google Gemini TTS, UZUN_FORMAT §1.1. Anlatıcı Charon 1,25x (atempo), hesap sahibinin
# tarzı aynen; ikinci ses (eski Aylin: alıntı, reklam sloganı, resmî uyarı) ses denemesiyle seçildi. Satırdaki `hiz` sesin
# taban hızıyla çarpılır (eski Cartesia vurgu yavaşlatmaları korunur). Cartesia önbelleği ve ses_onarim.py artık
# kullanılmıyor (tarihçe).
model: gemini-2.5-pro-tts
sesler:
  charon: {gemini: Charon, hiz: 1.25,
           tarz: "Bir gerilim dizisinin anlatıcısı gibi oku: alçak, sakin ama gergin, dinleyene 'sen' diye sesleniyor. Noktalarda ve üç noktada kısa duraklar ver. Doğal İstanbul Türkçesi."}
  kadin: {gemini: Kore, hiz: 1.0,
          tarz: "Bir belgeselde alıntı okuyan kadın sesi gibi oku: net, sakin ve tarafsız. Doğal İstanbul Türkçesi."}
anlatici: {ses: charon, hiz: 1.0}
# ElevenLabs'le yeniden seslendirmede (hesap sahibi: Cartesia sesi beğenilmedi; o zamana dek yalnız değişen satırlar)
# Ankara bölümü yavaş okunsun (dil hakemi 10. tur S4: bölüm 5 ort. 6,9 hece/sn, öteki bölümler 6,4-6,6; hız ~0,9 ya
# da virgül/iki noktada ~250 ms): "Ama zehirlilik deneylerinin…" (B5.3b), "Amerika'da 20.000 kişiye ulaşan o
# ‘deneme’ kapısı…" (B5.4), "Ölümünün onuncu yılındaki anma yazıları…" (B5.8a), "Haberin kaynağı ise sorulduğunda…"
# (B5.8m), "Bu yüzden Türkiye, faciayı yaşamayan…" (B5.10). Kancadaki "Bu hikâye 1961'de bitmedi." için dil hakeminin
# önerisi de o zaman: "Ama bu hikâye, ilaç toplatılınca bitmedi."
# 11. tur: bu satırlar (ve "İşte Amerika'yla…", "Bakanlık da…", kancanın "Ama Türkiye'de…" satırı, kapanışın vedası)
# şimdilik önbellekteki çekimden rubberband ile yavaşlatıldı (ses_onarim.py hiz_r11_*); 12. turda doruk (9:26-9:38) ve
# "tanıtım numunesi bile" de (hiz_r12_*). "ise" satırları 12. turda yeni metinle yeniden seslendirildi ("Sorulduğunda,
# haberin kaynağı…", "Nejat Eczacıbaşı bir söyleşisinde…", "İnternette sık duyulan bir söz var:…", "…yan etkiden
# haberi olmadığını…", "Bugün Türkiye'deki resmî ürün bilgisinde şu uyarı var:"). ElevenLabs'te ayrıca: kancadaki
# "Ama Türkiye'de bu ilaca ruhsat verilmedi." yavaş ve ardından ~0,3 sn durak; "Nejat" (Cartesia'da Whisper hâlâ
# "Necad" yazıyor); B6.1'in "cüzzam"ı (Cartesia ikiz zz'yi "cüzdan" okuyor; B6.3 bu yüzden "lepra"); kancadaki
# "Bu hikâye 1961'de bitmedi." için dil hakeminin önerisi "Ama bu hikâye, ilaç toplatılınca bitmedi."; B2.2 (dil
# hakemi 11. tur N1: ipucusuz Whisper "günlük dost" yazıyor): "Kasım 1961'e kadar yalnız Grünenthal'in sattığı günlük
# dozların 300 milyonu aştığı hesaplanıyor."; "yayımlandı / yayımlanmış" (Cartesia "yayınlandı" okuyor; dil N6).
# 14. tur (dil hakemi 13. tur S3-S5, N1-N2; yeni ses YOK, kredi yok): ElevenLabs'te B2.2 metni "Hesaplara göre yalnız
# Grünenthal'in sattığı günlük dozlar, Kasım 1961'e kadar 300 milyonu aşıyor." ("doz s" bitişikliği kalkar; TTS:
# "...dozlar, <break 200ms> Kasım bin dokuz yüz altmış bire kadar üç yüz milyonu aşıyor."); B3.5 "taahhütlü" (0/4
# doğru: "tahipli/tahitli"): kulak "tahitli" duyarsa metin "Ertesi gün aynı talebi bu kez yazılı olarak, bir mektupla
# tekrarlıyor."; "Grünenthal" (0:45'te 4/4 "Gürnental", 2:18'de mikste "Gürbünental") için tek telaffuz kaydı
# (denenecek: "Grünental", "Grü nental", "Grünnental"); 2:24 "İngiltere'deki bir reklam ise…" ve 2:35
# "Hamilelikteki bulantıya…" ~0,86, 4. bölümdeki "Hikâye gazetelere düşüyor." ~0,88 hızda (dil N1).
telaffuz:                          # yalnız TTS metnine; uzun olan önce
  Frances Oldham Kelsey: Frensis Oldım Kelsi
  Widukind Lenz: Vidukind Lents
  Jacob Sheskin: Yakob Şeskin
  Sheskin: Şeskin                  # 10. tur: "Sheskin, elinde kalan…" (dil N2)
  Kelsey: Kelsi
  Lenz: Lents
  Grünenthal: Grünental
  Contergan: Kontergan
  SALL4: Sal dört
  K 17: Ka on yedi
  FDA: Ef De A                     # 5. tur (dil hakemi): "FTA" duyuluyordu
  Talidomid: Talidomit
  taahhütlü: taahütlü              # 9. tur (dil S2): 'tavuklu/tahitli' duyuluyordu
  yayımlanmış: yayım-lanmış        # Gemini turu (23.10): yazımla "yayınlanmış" duyuluyordu; tireyle "yayımlanmış"
  yayımlandı: yayım-landı
  yayımlanmadı: yayım-lanmadı
  Enstitüsü: Ens-titüsü              # Gemini turu: 4 çekimde 'İntitüsü' duyuldu
qa:
  isimler: [Kaymakçalan, Süreyya Tahsin Aygün, Contergan, talidomit, Talidomid, Grünenthal, Lenz, Kelsey, Kevadon,
            Distaval, Sheskin, Eczacıbaşı, Refik Saydam, Cerrahpaşa, Behçet, SALL4, miyelom, Kennedy, ABD, FDA]

muzik: {uret: true, tohum: 1961, seviye: -15, acik: -9}   # 3. tur: -22/-15 duyulmuyordu; 6. tur (izlenme S8): -18/-12 -> +3 dB
zamanlama: {bas: 0.2, ara: 0.2, son: 0.26, bindirme: 1.2, max_bos: 6.0}   # 5. tur: son 0.32 -> 0.26 (10:15 sınırı)
gecis: kesme
kart_bindirme: true
hareket: {paralaks: 0.3}   # 7. tur: wojak sahnelerinde arka plan kamerayı daha az izler (derinlik); masaya/duvara
                           # 'konmuş' dekorlu sahnelerde kamera paralaks: 0 (kapı, raf, tabla, makale, komodin)

bolumler:
  # ================================================================================================ SOĞUK AÇILIŞ
  # 4. tur: anlatıcı (hardal kazaklı 'feels guy', izleyicinin yerine geçer) kancanın ilk karesinden itibaren bilgi
  # sahnelerinde köşeden tepki verir (`konuk`); hesap sahibi: "wojak kanalı, ekranda wojak olmalı"
  - baslik: Soğuk açılış
    youtube: "Giriş"
    kart: false
    sahneler:
      # SA.1a · dünya haritası: belgeli ülkeler satır boyunca tek tek kırmızı, köşede 1 -> 46 ÜLKE (Türkiye gri)
      # (2. hakem turu: kanca 3 çekime bölündü; 3. tur: kare 0 yalnız Almanya). 4. tur: anlatıcı ilk karede altta
      # (Güney Atlantik / Afrika'nın güneyi: boyalı ülke yok), sayaç 46'ya varınca terler
      - tip: harita
        bolge: dunya
        ulkeler: [DEU, CAN, BRA, GBR, AUS, ITA, JPN, AUT, CHE, BEL, NLD, LUX]
        aralik: 0.2
        aciklama: "kırmızı: satıldığı belgelenen bazı ülkeler"   # 10. tur (dil N5): "· bugünkü sınırlar" eki
        #      altta yükselen anlatıcının başının altına uzuyordu: not Avrupa haritasında (B1.10) ve açıklamada
        #      13. tur (animasyon S3): lejant anlatıcının omzuna değiyordu: daha kısa (aynı anlam), anlatıcı 0.56 -> 0.6
        zoom: [1.14, 1.0]          # 9. tur (izlenme N3): ilk kare durağan düz gri haritaydı: geri çekilen kamera
        bas: 0.3
        son: 0.15
        muzik_db: -4               # 8. tur (izlenme S5): -10'da altlık sesin ~28 dB altındaydı (kanca yalnız efektle)
        muzik_mod: gerilim         # 8. tur: kancadan itibaren gerilim katmanı (bölüm 1'de drone'a döner)
        kose: {metin: "{} ÜLKE", deger: 1}
        konuk: [{id: z, gorsel: chars/anlatici_v2_sakin.png, x: 0.6, boy: 0.4, giris: false, yon: alt}]
        satirlar:
          - {metin: "46 ülkede satılan bir ilaç.", hiz: 0.78, tts: "Kırk altı ülkede satılan bir ilaç."}
        olaylar:
          - {tip: basla, satir: 1, ofset: -0.1}
          # 12. tur (animasyon S1): kesmede haritanın ortasından sayacın köşesine ışınlanıyordu (+%23 boy): kesmeden
          # önce aşağı iner, sayaçta sağ alttan yükselir
          - {tip: cikis, karakter: z, satir: 1, an: son, ofset: -0.4}
          - {tip: ulke, kod: DEU, t: 0.0}
          - {tip: kose, deger: 46, satir: 1, ofset: 0.1, sure: 2.0}
          # 11. tur (animasyon M2): terli yüz kesmeden 9 kare önce sıkışıyordu: SA.1b'nin başına (+0,3 sn) taşındı
        sfx:
          - {ad: boom, t: 0.0, db: -8}

      # SA.1b · tam ekran sayaç: 10.000+ bebek (bebek/kişi görüntüsü yok); anlatıcı sağ altta, sayı bitince gözyaşı
      - tip: sayac
        deger: 10000
        sonek: "+"
        ust: "Dünyada"
        etiket: "bebek · ağır doğumsal kusur"
        renk: kirmizi
        sure_say: 3.4
        gecis: kesme               # 8. tur (animasyon M2): çapraz geçişte anlatıcı iki kez görünüyordu
        bas: 0.1
        son: 0.2
        muzik_db: -4
        konuk: [{id: z, gorsel: chars/anlatici_v2_sakin.png, x: 0.87, boy: 0.5, giris: 0.05, yon: alt}]
        satirlar:
