# antakya-kharonion-veba — Antakya'da salgın sırasında dağa oyulduğu anlatılan dev yüz (Kharonion).
# Kaynak: Ioannes Malalas, Chronographia 8.21 (MS 6. yy): IV. Antiokhos Epiphanes döneminde salgın; Leios adlı bir
# tılsımcı (telestes) şehre bakan kayaya çok büyük, taçlı bir maske oydurur, üstüne bir şey yazar, ölümler durur.
# Efsane "anlatılana göre"; yüzün Kharon'a ait olduğu söylenmez (Malalas yalnız halkın verdiği adı aktarır).
# Kurgu: A (solda) adsız Antakyalı; B (sağda) tılsımcı Leios. Kral konuşmaz, ima edilmez. Deprem hiç anılmaz.
# Kanıt: Malalas'ın pasajı (Dindorf 1831, kamu malı) -> son kare: bugünkü büstün başı (Raddato, CC BY-SA 2.0).
# Son 5 son kare: gravür, kitap sayfası, mekân+levha, kitap sayfası, müze nesnesi -> bu bölüm: nesnenin bugünkü fotoğrafı.

id: antakya-kharonion-veba
title: "Antakya'da salgın sırasında dağa oyulan dev yüz"

# Önceki tr bölümü (balikli-ayazma-1453) klasik -> konuya göre: efsane + tılsım (§6 tablosu: masal). Kanalda henüz çalmadı.
music: masal

scenes:
  # 1) KANCA — A (sol): somut ölüm, bağlamsız anlaşılır. Kelime tohumu: "cenaze".
  # Tur 1 takipçi MUST: "yüz" repliklerde söylenmez, son kare sessizce gösterir (S2/S3 yeniden yazıldı, sorulara "?").
  - type: dialog
    duration: 2.5
    bg: img/arka.jpg
    blur: 2.2
    chars:
      - {img: chars/koylu_sakin.png, side: left, height: 0.50}
    text: "Usta, salgında her gün\ncenaze kalkıyor"

  # 2) B (sağ): Malalas'taki emir (kayaya oydurur, üstüne bir şey yazar); ne oyulacağı gizli.
  - type: dialog
    duration: 2.0
    bg: img/arka.jpg
    blur: 2.2
    chars:
      - {img: chars/telestes.png, side: right, height: 0.50}
    text: "Şu kayayı oyup\nbir şey yazacağım"

  # 3) A: şüphe.
  - type: dialog
    duration: 2.0
    bg: img/arka.jpg
    blur: 2.2
    chars:
      - {img: chars/koylu_sakin.png, side: left, height: 0.50}
    text: "Kaya oymakla salgın\nnasıl durur?"

  - type: card
    duration: 1.5
    text: "Bir süre sonra"

  # 4) TERS KÖŞE — A, aynı kutu, şok yüzü: Malalas'a göre ölümler durdu ("cenaze" tohumu) + S2'deki "bir şey yazacağım"
  #    tohumunun gizemi (tur 2 takipçi: dönüş ılımlı). Ne yazıldığı bilinmez; yazıt hiç bulunamadı (metinde).
  - type: dialog
    duration: 2.5
    bg: img/arka.jpg
    blur: 2.2
    chars:
      - {img: chars/koylu_sok.png, side: left, height: 0.50}
    text: "Bekle, cenaze kalkmıyor,\nkayaya ne yazdın?"

  # 5-6) KANIT — Malalas'ın pasajı, Dindorf 1831 Bonn baskısı s. 205 (kaynak); son kare: kayaya oyulan dev baş bugün
  #      (cevap: oyulan şey dev bir yüz/maske). Tur 1: panorama yerine belge (takipçi), baş sıkı kırpıldı (görsel MUST).
  - type: evidence
    duration: 1.5
    images: [img/kanit_1.jpg]
  - type: evidence
    duration: 2.0
    images: [img/kanit_2.jpg]

