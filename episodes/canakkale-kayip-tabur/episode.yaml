notes: |
  CC BY / CC BY-SA görseller: paylaşımda açıklamaya "Görseller: Wikimedia Commons / Flickr — Hüseyin Öcal, Tevfik Teker (CC BY 3.0); hugh llewelyn (CC BY-SA 2.0); Jll (CC BY-SA 3.0)" eklenebilir.
  Karakter PNG'leri bu bölümün chars/ klasöründe (assets/characters'a dokunulmadı).
  Rakamlar kaynaklara göre değişiyor: kayıp sayısı 266/267 (bazı yeni araştırmalar daha düşük veriyor), Azmak'taki Norfolk mezarı 114/115, 1919 bulgusu bazı yerlerde "1918". Metinde yalnızca birden çok kaynağın örtüştüğü rakamlar kullanıldı.
  Rahip Edwards'ın rolü ve "hepsi başından vurulmuştu" iddiası belgeyle desteklenmiyor (Great War Forum) — metinde "anlatılanlara göre" dili kullanıldı, infaz iddiası hiç yazılmadı.
  1965 iddiasındaki tarih kaynaklara göre 21 ya da 28 Ağustos; metinde tarih verilmedi, yalnızca "uyuşmuyordu" denildi.
  anafartalar_tepeler.jpg büyük olasılıkla Büyükanafarta tarafı (taarruz Küçükanafarta Ovası'nda); genel "Anafartalar" mekânı olarak kullanıldı, ekranda yer adı yazılmadı.
  Karakterler role/döneme göre seçildi: tozluk miğferli, haki giysili, ak sakallı kıdemli subay; Brodie miğferli WWI wojak'ları 1916 sonrası olduğu için kullanılmadı.
