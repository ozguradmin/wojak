notes: |
  CC BY görsel atfı 'credits' alanından açıklamalara otomatik eklenir (yazar + eser adı + lisans adresi + "kırpılıp düzenlendi").
  ShareAlike (CC BY-SA) görseller çıkarıldı: Azmak (Jll, BY-SA 3.0/GFDL) ve Chunuk Bair (hugh llewelyn, BY-SA 2.0) yerine kamu malı / telif kısıtlaması olmayan 1915 arşiv fotoğrafları kullanıldı. Commons'ta Azmak Mezarlığı'nın BY-SA olmayan bir fotoğrafı yok; bu yüzden sahne 6 etiketi "Azmak" değil, fotoğrafın gerçek içeriği ("Suvla'da asker mezarları · 1915").
  suvla_mezarlik_1915.jpg: kartpostalın el yazısı alt yazısında soru işareti var ("Graveyard at Suvla?"); Museums Victoria kaydı fotoğrafı Suvla'ya bağlıyor (aynı askerin diğer kartları da Suvla: 'Snow Scene at Suvla', 'Ordnance Stores at Suvla'). Bu mezarlar 1915'e ait, 1919'da bulunan Norfolk askerlerinin mezarları DEĞİL; etiket yılı açıkça yazıyor.
  Karakter PNG'leri bu bölümün chars/ klasöründe (assets/characters'a dokunulmadı; wojak_lib get ile aynı adımlar: alfa kırpma, en çok 1400 px).
  Karakterler: 1965 iddiasını anlatan tanık artık yaşlı bir gazi (iddia sahipleri 1965'te yaşlı Yeni Zelandalı gazilerdi); 1919 sahnelerindeki papaz klasik wojak çiziminde, şaşkın/ürkek yüzlü, cüppe ve stola ile (cenaze/defin görevindeki papaz kıyafeti). Kütüphanede haki üniformalı ordu papazı yok.
  Rakamlar kaynaklara göre değişiyor: kayıp sayısı 266/267 (bazı yeni araştırmalar daha düşük veriyor), Azmak'taki Norfolk mezarı 114/115, 1919 bulgusu bazı yerlerde "1918". Metinde yalnızca birden çok kaynağın örtüştüğü rakamlar kullanıldı.
  Papaz Edwards: yazım "Pierrepont" (Friends of the Suffolk Regiment, West Mersea; historic-uk/Great War Forum "Pierrepoint" yazıyor). Rolü ve "hepsi başından vurulmuştu" iddiası belgeyle desteklenmiyor (Great War Forum) — metinde "anlatılanlara göre" dili kullanıldı, infaz iddiası hiç yazılmadı.
  1965 iddiasındaki tarih kaynaklara göre 21 ya da 28 Ağustos; metinde tarih verilmedi, yalnızca "uyuşmuyordu" denildi. Bildiri Rotorua'daki ANZAC çıkarmasının 50. yıl dönümü buluşmasında imzalandı (skeptics.nz; historic-uk "50th Anniversary of Gallipoli").
  anafartalar_tepeler.jpg büyük olasılıkla Büyükanafarta tarafı (taarruz Küçükanafarta Ovası'nda); genel "Anafartalar" mekânı olarak kullanıldı, ekranda yalnızca "Çanakkale" yazıyor.
  Karakterler role/döneme göre seçildi: tozluk miğferli, haki giysili, ak sakallı kıdemli subay; Brodie miğferli WWI wojak'ları 1916 sonrası olduğu için 1915 sahnesinde kullanılmadı.
  Yorum riski: Türkiye'de olay dini bir mucize ("düşmanı yutan bulut") olarak da anlatılıyor; "Kaybolmamışlar" repliği bu anlatıyla çelişiyor ve işgalci askerlerin yasını tutmak gibi okunabilir. İlk saatlerde yorumlar saygılı ve kaynaklı yanıtlanmalı, hakaret içerenler silinmeli. Haber kancası yok: 18 Mart, 25 Nisan ya da 12 Ağustos'ta paylaşmak daha güçlü olur.
