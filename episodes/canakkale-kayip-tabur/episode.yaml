# Çanakkale / efsane — "olay" formatı. Render: python -m wojak render episodes/canakkale-kayip-tabur
# Efsane EFSANE olarak sunulur: belgelenen (12 Ağustos 1915 taarruzu, Hamilton raporu, 1919 bulgusu)
# ile sonradan ortaya atılan iddia (1965, "bulut") ayrı tutulur. Sahne 2'deki replik iddiadır -> etiketli.
id: canakkale-kayip-tabur
title: 'Çanakkale''de "bir bulutun içine girip kaybolan" tabur'

# Kanalın imza müziği (tools/make_music.py ile üretildi, hakkı bize ait)
music: {file: imza_gece_vals.mp3, start: 0, volume: 0.7, fade_out: 0.3}

scenes:
  # 1) KANCA / ironi: komutan önünü açık sanıp ilerletiyor (Hamilton raporu: "bir an için daha az
  #    direnç", "hevesle ilerledi"). Arka plan: Anafartalar'ın çalılık tepeleri (gerçek mekân).
  - type: dialog
    duration: 2.6
    bg: img/anafartalar_tepeler.jpg
    focus: [0.45, 0.5]
    chars:
      - {img: chars/ingiliz_subay_tozluk.png, side: right, height: 0.6}
    text: "Önümüz açık çocuklar, ilerleyin!"
    sfx: [{file: drone, volume: 0.4}]

  # 2) İDDİA (1965): tanığın ağzından bulut efsanesi. Etiketle "iddia" olduğu belirtilir.
  - type: dialog
    duration: 2.6
    bg: img/suvla_bulutlu.jpg
    focus: [0.5, 0.35]
    darken: 0.15
    chars:
      - {img: chars/asker_haki_biyikli.png, side: left, height: 0.56}
    text: "Bulutun içine girdiler...\nBir daha çıkmadılar?!"
    label: "İddia · 1965"
    shake: 8
    sfx: [{file: hit, volume: 0.8}]

  # 3) ZAMAN ATLAMASI (12 Ağustos 1915 -> Eylül 1919 mezar kayıt raporu)
  - type: card
    duration: 1.1
    text: "4 yıl sonra"
    sfx: [{file: boom, volume: 0.9}]

  # 4) KEŞİF: 1919 aramasında bulunanlar. Arka plan: Chunuk Bair'den Suvla ovası (gerçek mekân).
  - type: dialog
    duration: 2.7
    bg: img/chunuk_bair_suvla_view.jpg
    focus: [0.6, 0.5]
    darken: 0.3
    grayscale: true
    chars:
      - {img: chars/rahip_yakalik.png, side: right, height: 0.56}
    text: "Kaybolmamışlar... Bu ovada yatıyorlar."
    sfx: [{file: heartbeat, volume: 0.9, at: 0.4}]

  # 5) KANIT: Hamilton'ın raporu, London Gazette eki, 6 Ocak 1916, s. 303 (gerçek belge).
  - type: evidence
    duration: 1.9
    images: [img/gercek_hamilton_raporu_1916.jpg]
    label: "Gerçek belge · Hamilton'ın raporu, 1916"
    zoom: 1.04
    sfx: [{file: shutter, volume: 0.7}]

  # 6) KAPANIŞ: ağır gerçek (1919 raporu: 180 kalıntı, yalnızca 2'si tanındı). Azmak Mezarlığı.
  - type: dialog
    duration: 2.3
    bg: img/azmak_mezarligi.jpg
    focus: [0.5, 0.6]
    darken: 0.45
    grayscale: true
    chars:
      - {img: chars/rahip_yakalik.png, side: left, height: 0.55, flip: true}
    text: "180 asker bulundu.\nSadece ikisi tanınabildi."
    label: "Azmak Mezarlığı, Suvla"
    sfx: [{file: boom, volume: 0.6}]

caption: |
  Kayıp Tabur efsanesi, Anafartalar (1915)
  Olayın tamamı sabit yorumda 👇
hashtags: [çanakkale, anafartalar, kayıptabur, çanakkalesavaşı]

pinned_comment: |
  Kayıp Tabur olayı, 1915 yılında Çanakkale Savaşı sırasında Anafartalar'da yaşanan ve yıllar sonra "bulutun içinde kaybolan tabur" efsanesine dönüşen bir olaydır.

  İngiliz ordusundaki 1/5. Norfolk Taburu, 10 Ağustos 1915'te Suvla'ya çıktı. Taburda, Kral V. George'un Sandringham malikânesinin çalışanlarından kurulan bir birliğin askerleri de vardı. Başlarında, bu birliğin kurulmasına öncülük eden 54 yaşındaki Yüzbaşı Frank Beck bulunuyordu.

  12 Ağustos öğleden sonra tabur, Küçükanafarta Ovası'nda taarruza kalktı. Tabur komutanı Sir Horace Proctor-Beauchamp, 16 subay ve 250 askerle Türk savunmasının içlerine kadar ilerledi ve grup ağaçlık, engebeli arazide gözden kayboldu. Başkomutan Sir Ian Hamilton, Ocak 1916'da yayımlanan raporunda bunu "çok gizemli bir şey" olarak anlattı: "Hiçbiri geri dönmedi."

  Savaştan sonra, 1919'da İngiliz mezar kayıt ekibi, eski Türk hattının gerisindeki bir çiftlik arazisi ve çevresinde 180 asker kalıntısı buldu. Anlatılanlara göre aramada Rahip Charles Pierrepoint Edwards da vardı. Kalıntıların 122'si Norfolk askerlerine aitti; bulunanlardan yalnızca ikisinin kimliği belirlenebildi. Norfolk askerleri bugün Suvla'daki Azmak Mezarlığı'nda, çoğu isimsiz mezarlarda yatıyor.

  Efsane ise savaşın 50. yılında, 1965'te ortaya çıktı. Üç Yeni Zelandalı gazi, bir İngiliz birliğinin yere inmiş alçak bir bulutun içine yürüyüp gözlerinin önünde kaybolduğunu iddia etti. Ancak verdikleri tarih ve birlik adı gerçek olayla uyuşmuyordu.

  Sizce o gün Anafartalar'da gerçekte ne oldu, bu efsane neden 50 yıl sonra ortaya çıktı?

