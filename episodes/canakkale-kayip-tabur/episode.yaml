# Çanakkale / efsane — "olay" formatı. Render: python -m wojak render episodes/canakkale-kayip-tabur
# Efsane EFSANE olarak sunulur: belgelenen (12 Ağustos 1915 taarruzu, Hamilton raporu, 1919 bulgusu)
# ile sonradan ortaya atılan iddia (1965, "bulut") ayrı tutulur. Sahne 2'deki replik iddiadır -> etiketli.
id: canakkale-kayip-tabur
title: "Çanakkale'de bulutun içinde kaybolduğu söylenen İngiliz taburu"

# Kanalın imza müziği (tools/make_music.py ile üretildi, hakkı bize ait)
music: {file: imza_gece_vals.mp3, start: 0, volume: 0.7, fade_out: 0.3}

scenes:
  # 1) KANCA / ironi: komutan önünü açık sanıp ilerletiyor (Hamilton raporu: "bir an için daha az
  #    direnç", "hevesle ilerledi"). Arka plan: Anafartalar'ın çalılık tepeleri (gerçek mekân).
  #    Etiket kapakta da görünür: ilk saniyede yer + tarih bağlamı.
  - type: dialog
    duration: 2.6
    bg: img/anafartalar_tepeler.jpg
    focus: [0.45, 0.5]
    chars:
      - {img: chars/ingiliz_subay_tozluk.png, side: right, height: 0.6}
    text: "Çocuklar, önümüz açık!\nİlerleyin!"
    label: "Çanakkale · 12 Ağustos 1915"
    sfx: [{file: drone, volume: 0.4}]

  # 2) İDDİA (1965): yaşlı gazinin ağzından bulut efsanesi. Etiketle "iddia" olduğu belirtilir.
  #    Okuma süresi: 6 kelime -> 6/3 + 1 = 3.0 sn.
  - type: dialog
    duration: 3.0
    bg: img/suvla_bulutlu.jpg
    focus: [0.5, 0.35]
    darken: 0.15
    chars:
      - {img: chars/gazi_yasli.png, side: left, height: 0.56}
    text: "Bulutun içine girdiler...\nBir daha çıkmadılar."
    label: "İddia · 1965"
    shake: 8
    sfx: [{file: hit, volume: 0.8}]

  # 3) ZAMAN ATLAMASI: 1965 iddiasının hemen ardından gerçek (Eylül 1919 mezar kayıt raporu).
  #    "4 yıl sonra" 1965'ten sayılıyor gibi okunuyordu -> yıl açıkça yazıldı.
  - type: card
    duration: 1.0
    text: "Oysa 1919'da..."
    sfx: [{file: boom, volume: 0.9}]

  # 4) KEŞİF: 1919 aramasında bulunanlar. Arka plan: Suvla ovası, 1915 (Te Papa, gerçek dönem fotoğrafı).
  - type: dialog
    duration: 2.7
    bg: img/suvla_ovasi_1915.jpg
    focus: [0.4, 0.5]
    darken: 0.25
    grayscale: true
    chars:
      - {img: chars/papaz_urkek.png, side: right, height: 0.48, flip: true}
    text: "Kaybolmamışlar... Bu ovada yatıyorlar."
    sfx: [{file: heartbeat, volume: 0.9, at: 0.4}]

  # 5) KANIT: Hamilton'ın raporu, London Gazette eki, 6 Ocak 1916, s. 303 (gerçek belge).
  #    Bant Türkçe okutur; tarama karenin içinde küçültüldü, bant vurgulu son satırı örtmüyor.
  - type: evidence
    duration: 1.7
    images: [img/gercek_hamilton_raporu_1916.jpg]
    label: "Gerçek belge · Hamilton'ın raporu, 1916"
    banner: "“Hiçbiri geri dönmedi.”"
    zoom: 1.04
    sfx: [{file: shutter, volume: 0.7}]

  # 6) KAPANIŞ: ağır gerçek (1919 raporu: 180 kalıntı, yalnızca 2'si tanındı).
  #    Arka plan: Suvla'da asker mezarları, 1915 (Museums Victoria, kamu malı). Okuma: 6 kelime -> 3.0 sn.
  - type: dialog
    duration: 3.0
    bg: img/suvla_mezarlik_1915.jpg
    focus: [0.3, 0.5]
    darken: 0.3
    grayscale: true
    chars:
      - {img: chars/papaz_urkek.png, side: right, height: 0.47, flip: true}
    text: "180 asker bulundu.\nSadece ikisi tanınabildi."
    label: "Suvla'da asker mezarları · 1915"
    sfx: [{file: boom, volume: 0.6}]

caption: |
  Kayıp Tabur efsanesi, Anafartalar (1915)
  Olayın tamamı sabit yorumda 👇
hashtags: [çanakkale, çanakkalesavaşı, anafartalar, gelibolu]

pinned_comment: |
  Kayıp Tabur olayı, 1915 yılında Çanakkale Savaşı sırasında Anafartalar'da yaşanan ve yıllar sonra "bulutun içinde kaybolan tabur" efsanesine dönüşen bir olaydır.

  İngiliz ordusundaki 1/5. Norfolk Taburu, Ağustos 1915'te Suvla'ya çıktı. Taburda, Kral V. George'un Sandringham malikânesinin çalışanlarından kurulan Sandringham Bölüğü de vardı. Bölüğün başında, kuruluşuna öncülük eden, Kral'ın arazi yöneticisi 54 yaşındaki Yüzbaşı Frank Beck bulunuyordu.

  12 Ağustos günü öğleden sonra tabur, Küçükanafarta Ovası'nda taarruza kalktı. Bu cephede Türk birlikleri, 8 Ağustos'ta Anafartalar Grubu Komutanlığına getirilen Albay Mustafa Kemal'in emrindeydi. Tabur komutanı Yarbay Sir Horace Proctor-Beauchamp, 16 subay ve 250 askerle Türk hatlarının içlerine ilerledi ve ağaçlık, engebeli arazide gözden kayboldu. İtilaf kuvvetleri komutanı General Sir Ian Hamilton, Ocak 1916'da yayımlanan raporunda bunu "çok gizemli bir şey" olarak anlattı: "Hiçbiri geri dönmedi."

  1919'da İngiliz mezar kayıt ekibi, eski Türk hattının gerisindeki bir çiftlik arazisi ve çevresinde 180 asker kalıntısı buldu. Anlatılanlara göre aramada Papaz Charles Pierrepont Edwards da vardı. Kalıntıların 122'si Norfolk askerlerine aitti; yalnızca ikisinin kimliği belirlenebildi. Norfolk askerleri bugün Suvla'daki Azmak Mezarlığı'nda, çoğu isimsiz mezarlarda yatıyor. Frank Beck'in bilinen bir mezarı yok; adı Helles Anıtı'nda yazılı.

  Efsane ise Gelibolu çıkarmasının 50. yıl dönümünde, 1965'te ortaya çıktı. Üç Yeni Zelandalı gazi, bir İngiliz birliğinin yere kadar inmiş bir bulutun içine yürüyüp gözlerinin önünde kaybolduğunu iddia etti. Ancak verdikleri tarih ve birlik adı gerçek olayla uyuşmuyordu. Hikâye Türkiye'de de "düşmanı yutan bulut" olarak anlatılır.

  Sizce o gün Anafartalar'da gerçekte ne oldu? Bu efsane neden 50 yıl sonra ortaya çıktı?

