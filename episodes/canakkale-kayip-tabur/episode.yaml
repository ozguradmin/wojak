# Çanakkale / "Kayıp Tabur" — altın dönem kalıbı (Havran mağarası C2fa0rXMsis ile aynı iskelet:
# A niyet -> B uyarı -> A geçiştirir -> kart -> B fark eder (yüz varyantı) -> 2 kanıt: yer -> başlık).
# İki İngiliz eri, 12 Ağustos 1915, Anafartalar, taarruz anı. Bulut EFSANEDİR (1965); hikâye metni bunu
# açıkça söyler. Belgelenen: Hamilton raporu ("Not one of them ever came back"), 1919'da 180 kalıntı, 2 kimlik.
# v3 (2026-10-10, hakem 6/10 sonrası): gerçek Suvla fotoğrafı geri geldi, B'nin alnı açıldı (miğfer yukarıda),
# A yeni (aynı kostüm ailesi + bıyık), ters köşe "bulut kalktı", kanıt: Azmak Mezarlığı + Türkçe başlık görseli.
# v4: tek fotoğraf (Suvla); 1-3. sahnelerde ovaya oturmuş bulut katmanı (C2kk S2 duman katmanı gibi), ters köşede
# aynı kare katmansız: bulut kalkmış, ova boş. Karakterler 0,55 (görünen yüz ~340 px), siperlik konturu düzeltildi.
# v5 (hakem 7/10 sonrası): arka plan kare kırpım (820,644,2120,1944) + renk (Color 1,35, Brightness 1,10), bulut karenin
# yarısını kaplar, alt kenarı dalgalı; 1-3. sahnelerde buluta yürüyen tabur kolu (siluet), ters köşede aynı kare boş.
# B'nin 2. sahne yüzü Nervous Wojak + tek ter damlası; ters köşe mavi çizgileri alına yayıldı; A'nın bıyığı 1,4x pala
# bıyık, gözbebekleri B'ye; kanıt 1 16:9; kanıt 2 küçük resim tarzı (1916 fotoğrafı + Anton başlık), ok ve krem bant yok.
# final-2 (görsel hakem 7/10, takipçi hakemi 7,5/10 sonrası): arka plan blur 1,2 + renk (Color 1,6, Contrast 1,08,
# Brightness 1,05); karakter boyu 0,52; B S2'de A'ya bakar (gözbebekleri iç köşede), S5'te dışa kaçan bakış + 6 belirgin
# mavi çizgi; yeni replikler (S2 uyarı, S3 kelime oyunu yok, S5 "neden kimse yok?"), yeni başlık ve hikâye metni;
# kanıt 2 bulunmuş küçük resim dokusunda, kanıt 1 yumuşatıldı.
# final-3 (görsel hakem 7,5/10, takipçi hakemi 7,5/10 sonrası): S1 yerel çapa ("Türkler bulutun arkasında"), S5 tek satır
# "Bekle, koca tabur nereye gitti?"; ters köşe yüzünde 5 ince mavi işaret, S2 damlası küçük; tabur kolu 18 küçük siluet;
# kanıt 1 artık gazetenin kendi sayfası (East Oregonian, 14 Şubat 1916: "The Men Who Never Came Back"); hikâye metni düzeltildi.
