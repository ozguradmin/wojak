  - "Karakter B (assets/kit/ingiliz_er_1915/: terli, kaygili) — wojakland 'Nervous Wojak' (wl:nervous_wojak.png; klasik feels guy ile aynı kafa, klasik koordinatına 1,417x ve (-12,+3) ile hizalı) + elle çizilmiş 1915 Wolseley miğfer ve haki drill ceket (kostum.py). terli = mavi çizgileri silinmiş Nervous Wojak (taban/nervous_temiz.png) + şakakta tek ter damlası (tools/kit_varyant.py); final-2: terli'de gözbebekleri iç köşede (A'ya bakar; goz_ice.py -> taban/nervous_temiz_ice.png); kaygili = Nervous Wojak'ın kendi dışa kaçan bakışı + alında 5 ince, seyrek mavi soğuk ter işareti (final-3: ~6,5 px, ekranda ~3 px, Nervous Wojak'ın kendi mavisi; ter_cizgileri.py). final-3: terli'deki damla 20 -> 14. sakin (klasik 5_Tired_Wojak/10441) bu bölümde kullanılmıyor."

notes: |
  Yapı Havran mağarası reel'inin (C2fa0rXMsis, 19,9M) iskeleti: 2,5/2,5/2,5 diyalog, 1,5 kart, 2,0 ters köşe, 2x1,5 kanıt = 14,0 sn.
  Üniforma: 1/5. Norfolk Ağustos 1915'te tropik üniforma (haki drill) ve Wolseley mantar miğferle savaştı (Commons
  'Norfolk Regiment 1915.png', Sandringham Bölüğü fotoğrafı). Çelik Brodie miğfer 1916'da geldi; kullanılmadı.
  Karakterler aynı kit: assets/kit/ingiliz_er_1915 (v3/v4). Miğfer 150 px yukarıda ve 0,86 ölçekte, böylece klasik alın
  kırışıkları ve ters köşedeki mavi soğuk ter çizgileri görünür. A = klasik 'gülümsüyor' + bıyık (C2fa'daki bıyıklı/sade
  ayrımı gibi), B = Nervous Wojak (terli: yan bakış + şakakta tek ter damlası) -> aynı yüz + alında mavi soğuk ter
  (kaygılı); C4V3 S5 -> S6 ilerlemesi. Hepsi aynı tuval ve kostüm yerleşimi.
  Arka plan tek fotoğraf (Büyükanafarta sırtından Suvla ovası/Tuz Gölü). 1-3. sahnelerde ovaya oturmuş bulut katmanı,
  kart sonrası ters köşede aynı kare katmansız: izleyici bulutun kalktığını ve ovanın boş olduğunu aynı kadrajda görür.
  v4: karakter boyu 0,55 (görünen yüz genişliği ~340 px; C4V3/C2kk ~390), siperliğin konturu olmayan ten rengi
  kenarları düzeltildi (kostum.py), A tabanındaki omuz çizgisi kalıntısı temizlendi.
  v5: arka plan kare kırpım + renk düzeltmesi (bulut karenin ~yarısı, gökyüzü ~%12); 1-3. sahnelerde ovadan buluta
  yürüyen tabur kolu (11 siluet, öndekiler bulutta söner), ters köşede aynı kare boş: "tabur nerde?" sorusunun görsel
  karşılığı. Siluetler kırpımda 38 -> 30 px (hakemin önerdiği 18-22 px, renderer'ın 2,5 px yumuşatmasından sonra
  okunmuyordu). Kanıt 2 artık küçük resim tarzı (fotoğraf tam taşma + Anton başlık), ok ve krem bant yok.
  Replikler anonim iki ere ait; gerçek bir kişiye söz yazılmadı. Komutan (Proctor-Beauchamp, Yarbay) yalnız anılıyor;
  Hamilton raporu onun "hevesle ileri" gittiğini yazıyor. Bulut sahnede efsanedir; hikâye metni bunu açıkça söyler.
  Kanıt 2 kendi başlık görselimiz (kanalın son kanıtı tipik olarak Türkçe haber başlığı/küçük resim); yazı olgusal,
  "bulut yuttu" demiyor. Hesap sahibi isterse yerine gazetenin kendi sayfası (East Oregonian 1916) konabilir.
  Yorum riski: Türkiye'de olay dinî bir mucize ("düşmanı yutan bulut") olarak da anlatılıyor; metin tarafsız.
  Paylaşım için takvim kancası: 12 Ağustos (olayın yıl dönümü), 18 Mart, 25 Nisan.
  final-2: arka plan blur 1,2 (varsayılan 2,5): kaynak hava fotoğrafı zaten yumuşak, 2,5 ile kenar Laplace varyansı ~4
  çıkıyordu; 1,2 ile 17-22 (STIL §6 medyan 22). S2 repliği 1965 bildirisindeki "bulutlar 4-5 mil/saat rüzgâra rağmen
  kıpırdamadı" ayrıntısına dayanır; hikâye metni bunu "rüzgâra rağmen kıpırdamayan bir bulut" diye karşılar.
  S1'deki "geçiyoruz" bilerek şimdiki zamanda bırakıldı (takipçi hakeminin "geçicez" önerisi gelecek zaman; kural şimdiki zaman).
  Kart "Bir süre sonra" kaldı (orijinallerde 6 kez, üçünde piksel olarak aynı kart; "Bir saat sonra" önerisi uygulanmadı).
  final-3: S1 "Komutan ileri diyor, Türkler bulutun arkasında" (ilk saniyede Çanakkale ve düşman; "Türk hattına geçiyoruz"
  kaçak gibi okunduğu için kullanılmadı). S5 "Bekle, koca tabur nereye gitti?" tek satır; imkânsız olanı (koca bir tabur yok)
  sorar ve 2,5 sn sonra gazetenin "The Men Who Never Came Back" başlığı ile "KAYBOLAN TABUR!" cevap verir.
  Görsel: tabur kolu 18 siluet, 24 -> 18 px (ekranda ~20 -> 15 px; önceki 11 x 38 -> 30 px ağaç tepelerinin yanında dev
  gibiydi); ters köşe yüzünde 5 ince mavi işaret (~3 px ekranda, ~520 mavi px; önceki 6 kalın çizgi ~1.500 px); S2 damlası 20 -> 14.
  Kanıt 1 artık gazetenin kendi sayfası (kamu malı); Azmak hikâye metninde kaldı, görseli yedek. Hikâye metni: Sandringham
  cümlesi kaynağa göre daraltıldı (bölükte malikâneden gönüllüler; Gallipoli Association: Yüzbaşı Beck ve 16 kişi),
  Hamilton alıntısı "Not one of them ever came back"e yaklaştırıldı, Türk tarafının anlatımı eklendi (skeptics.nz).
  Hesap sahibine not: yorumlarda ölen askerler üzerine "oh olsun" türü sevinme ve dinî/şüpheci tartışma beklenir;
  ilk 2 saatte hakaret ve ölülerle alay eden yorumlar gizlenmeli. Hikâye metni olayı zaten açıkladığı için ek sabit yanıt gerekmez.
  final-4 (son cila; görsel hakem 7,5, takipçi hakemi 7,5): S1 "Tabur bulutun içinden geçiyor, Türkler bizi göremez"
  (masum taktik niyet; ikinci izleyişte "bizi göremez" = onları bir daha kimse görmedi; "tabur" S5'i hazırlar), S2 "Emin
  misin? Rüzgar var, bulut hiç kıpırdamıyor" (konuşma dili, 7 kelime: 8 kelimelik öneri 2,5 sn'de okuma uyarısı verir),
  S3 "Bir şey olmaz, öbür tarafta görüşürüz" (deyim: öbür dünya). Kanıt 2 Sandringham Bölüğü'nün 1915 fotoğrafı (Commons,
  kamu malı); gerçek bir Türkçe haber/YouTube küçük resmi de arandı (istiklal.com.tr galerisi, YouTube'da 12 video): galeri
  olayla ilgisiz genel savaş fotoğrafları, küçük resimlerin çoğu yapay zekâ çizimi (Brodie çelik miğferli, 1916 sonrası) ya da
  bir yayıncının yüzü; ikisi de gerçek 1915 fotoğrafından zayıf, telifli klasör kullanılmadı. Azmak görseli (yedek) silindi;
  Azmak olgusu hikâye metninde. Hikâye metni: Türk anlatımı "ilerleyen birlik, yedek Türk bölüklerinin süngü karşı
  hücumunda yok edildi" (skeptics.nz), esirler Türk kaynağına atfedilmiyor (skeptics.nz: 1/5. Norfolk'tan iki subay esir;
  historic-uk: Yüzbaşı Coxon), 1919 kalıntıları "Türk ön hattının gerisinde" (mesafe kaynaklarda 500 ve 800 yarda diye
  çeliştiği için sayı yok), bulut "yere oturmuş" (bildiri: "resting on the ground"; "yere indi" yanlıştı), aranan adlar
  ("kaybolan Norfolk Alayı", "düşmanı yutan bulut") ilk paragrafta. Moderasyon notu ve ilk yorum önerisi artık ek_maddeler'de
  (paylasim.md'ye girer; notes girmiyordu).
