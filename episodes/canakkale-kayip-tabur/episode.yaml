caption: |
  Kayıp Tabur efsanesi, Anafartalar (1915)
  Olayın tamamı sabit yorumda 👇
hashtags: [çanakkale, anafartalar, gizem]

pinned_comment: |
  Kayıp Tabur olayı, 1915 yılında Çanakkale Savaşı sırasında Anafartalar'da yaşanan ve yıllar sonra "bulutun içinde kaybolan tabur" efsanesine dönüşen bir olaydır.

  12 Ağustos 1915 öğleden sonra İngiliz ordusunun 1/5. Norfolk Taburu, Küçükanafarta Ovası'nda taarruza kalktı. Karşılarındaki Türk birlikleri, Albay Mustafa Kemal'in komutasındaki Anafartalar Grubu'na bağlıydı. Tabur komutanı Yarbay Sir Horace Proctor-Beauchamp, 16 subay ve 250 askerle Türk hatlarının içlerine ilerledi ve ağaçlık arazide gözden kayboldu. General Ian Hamilton raporunda bunu "çok gizemli bir olay" diye anlattı: "Hiçbiri geri dönmedi."

  1919'da İngiliz mezar kayıt ekibi bölgede 180 asker kalıntısı buldu. Bunların 122'si Norfolk askerleriydi; yalnızca ikisinin kimliği belirlenebildi. Norfolk askerleri bugün Suvla'daki Azmak Mezarlığı'nda, çoğu isimsiz mezarlarda yatıyor.

  Bulut efsanesi ise 1965'te ortaya çıktı. Üç Yeni Zelandalı gazi, bir İngiliz birliğinin yere inmiş yoğun bir bulutun içine yürüdüğünü, bulut kalkınca geride kimsenin kalmadığını iddia etti. Ancak verdikleri tarih ve birlik adı gerçek olayla uyuşmuyordu. Hikâye Türkiye'de de "düşmanı yutan bulut" olarak anlatılır.

  Sizce o gün Anafartalar'da gerçekte ne oldu?

