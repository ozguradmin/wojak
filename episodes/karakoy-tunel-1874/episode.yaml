# Tünel (Karaköy-Beyoğlu, 1874-1875): Londra'dan sonra dünyanın en eski ikinci yeraltı demiryolu. Açılıştan önce, 1874'ün
# Kasım-Aralık aylarındaki deneme seferlerinde vagonlarda yolcu yerine hayvan ve eşya taşındı (İETT levhası ve tarihçesi).
# Ters köşe (dramatik ironi + kelime tohumu): B "ilk yolcular hazır" der, A aynı kutuda yüz varyantıyla "yolcular"ın hayvan
# olduğunu fark eder. Kanıt sessizce doğrular: Gavand'ın 1876 profil çizimi (Galata Kulesi'nin altından geçen tünel), sonra
# 1884'te Pera istasyonu (B. Kargopoulo).
# Araştırma notu: scratchpad olgular.md (repoya girmez).
# AYNI YER, AYNI AN: 1874 sonbaharı, Tünel istasyonu, ahşap vagonun yanı.
#   A (hep solda): İstanbullu esnaf (kurgu; gerçek bir kişiyi temsil etmez). B (hep sağda): Tünel şirketinin memuru (kurgu).
#   Gerçek kişilere (Gavand, Abdülaziz) replik verilmez.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak):
#   - Deneme seferleri 1874 Kasım-Aralık; hayvanlarla (İETT levhası TR/EN, CNN Türk, Gazete Birlik, RayHaber, Milliyet).
#   - Nedeni tartışmalı: "halk korktu" (Vikipedi) / "halkın yadırgadığı, fetva ile yasak" anlatıları şehir efsanesi
#     (Vahdettin Engin'in araştırması: RayHaber; Cem Sorguç: Milliyet; Sarrafoğlu) -> ekranda neden söylenmez; metinde iki yan.
#   - Açılış 17 Ocak 1875, bilet 10 para; ilk 14 günde 75 bin yolcu (İETT, İTÜ, RayHaber, Milliyet).
#   - Gavand açılışta yoktu; şirket onu 1874'te devreden çıkarmıştı (İETT kronolojisi, RayHaber, EN Wikipedia).
#   - Karakterlerin "mezar gibi" korkusu kişisel canlandırma (dönem algısı: gazetesanat "mezarı andıran bu tuhaf taşıt").
# Son 5 bölümün son karesi: tablo (Orban), kitap sayfası (Yerebatan), arşiv fotoğrafı (Tahran), müze nesnesi (Midas), pul
# (Hezarfen) -> bu bölümde mühendis çizimi + arşiv fotoğrafı (arşiv fotoğrafı arka arkaya gelmiyor).
