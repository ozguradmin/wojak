# Göbeklitepe: 1963'te taşları mezar taşı sanılan tepe. Araştırma notu: scratchpad olgular.md (repoya girmez).
# Altın dönem kalıbı: C3iX/C4V3 (A sorar -> B cevaplar -> A şüphelenir -> B aynı kutuda yüz varyantıyla dramatik ironi)
# + kanıt. AYNI YER, AYNI AN: Göbeklitepe'nin tepesi (dilek ağacının olduğu doruk), 1963 yüzey araştırması.
#   A (hep solda): adsız bir köylü (kurgu).
#   B (hep sağda): adsız bir araştırma ekibi arkeoloğu (kurgu; raporu yazan kişinin adı ekranda ve metinde yok).
# Olgu sınırları:
#   - 1963: İstanbul ve Chicago üniversitelerinin ortak yüzey araştırması tepeyi kaydetti; çakmaktaşı aletleri
#     neolitik saydı, ama toprağın üstünde görünen büyük kireçtaşı bloklarını (T dikilitaşların tepeleri) mezar taşı
#     sandı; tepede (İslami/Bizans/Ortaçağ) mezarlıklar olduğunu düşündü (Vikipedi EN, DAI Tepe Telegrams, Evrim Ağacı,
#     DergiPark makalesi, Smithsonian 2008). Sonrasında 1995'e dek kazı yapılmadı.
#   - S2 "Mezar taşı bunlar" = belgeli yorum. S4 "Kazmaya değmez" = canlandırma; belgeli olan, o yıl kazı
#     yapılmaması ve önemin kaçırılması (DAI: "missed the importance of the site"). Ekip neolitik aletleri tanıdı:
#     metin bunu açıkça söylüyor.
#   - Kanıt 1: kazılmış D yapısı (2021). Kanıt 2 (son kare, KUPÜR; son 5 bölümün son kareleri: levha, minyatür,
#     kupür, mobil haber, sergi kartı -> önceki bölümle aynı tür değil): Hürriyet Seyahat 09.07.2018 başlığı
#     "Tarihi değiştiren dünya mirası: Göbeklitepe" + aynı haberin spotundan birebir cümle.
# Karakterler: chars/uret.py. Görseller: gorsel.py + kupur.py. Render: python -m wojak render episodes/gobeklitepe-mezar-tasi
id: gobeklitepe-mezar-tasi
