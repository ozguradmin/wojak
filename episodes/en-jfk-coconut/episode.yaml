  - "**Dramatization:** the two characters are fictional roles (a sailor and Kennedy); the dialogue is invented and is not a documented quote. Documented: the PT-109 sinking, the message carved on a green coconut husk on 6 August 1943, the islanders carrying it by canoe, the rescue on the night of 7 August, the paperweight in the Oval Office."
  - "**Left out on purpose:** how the shell returned to Kennedy (Smithsonian: not recorded; popular sites disagree), the distance to Rendova (60 km vs 35 miles), the 'scratch it out if captured' story (two popular sources only), who first had the idea (JFK Library credits Gasa with showing the method; the video gives it to the officer for brevity)."
  - "Evidence 1 is a US Navy photo of PT-109 in December 1942, eight months before the sinking, carrying cruiser survivors at Tulagi (not the night of the sinking); the final frame is the real museum object (carbon-enhanced letters, 1944). Background: Marovo Lagoon, Solomon Islands (2008), not the island where the crew was stranded."
  - "Suggested first comment: 'Actually the message was carved on a green husk, not a ripe coconut.' Answer: yes, a green coconut husk; the museum piece is the dried fragment."

