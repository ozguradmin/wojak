pinned_comment: |
  On the night of 1 to 2 August 1943, the US Navy patrol torpedo boat PT-109, commanded by 26-year-old John F. Kennedy, was rammed by a Japanese destroyer in the Solomon Islands. Eleven of the thirteen men aboard survived and swam to a tiny island to wait for rescue.

  On 5 August, two Solomon Islander scouts, Biuku Gasa and Eroni Kumana, found the group. The next day Kennedy scratched a message into a green coconut husk, a method that, according to the JFK Library, Gasa showed him. The museum transcript reads: "NAURO ISL...COMMANDER...NATIVE KNOWS POS'IT...HE CAN PILOT...11 ALIVE...NEED SMALL BOAT...KENNEDY".

  The two men carried the message by dugout canoe to the Allied coastwatchers, and a rescue was arranged. PT boats picked Kennedy up on the night of 7 August, and the crew reached the Rendova base the next morning.

  Kennedy's father later had the carved fragment sealed in plastic on a wooden base, and JFK used it as a paperweight in the Oval Office. It is now in the JFK Library in Boston. The Smithsonian notes that history does not record how Kennedy got the message back, and the letters were darkened with carbon in 1944.

  The first photo shows PT-109 in December 1942, carrying survivors of the cruiser USS Northampton, eight months before the sinking. The dialogue is imagined, and the background is a lagoon elsewhere in the Solomon Islands. If you were stranded, what would you carve on a coconut?

