# YouTube: 2-3 etiket (Instagram'da yok)
hashtags: [history, mystery, unsolved]

pinned_comment: |
  "D.B. Cooper" is the name of a hijacker who was never identified. On 24 November 1971, a man calling himself Dan Cooper bought a one-way ticket on Northwest Orient Flight 305, from Portland, Oregon, to Seattle, Washington.

  Soon after takeoff, he handed a flight attendant a note saying he had an explosive device. He demanded four parachutes and $200,000 in twenty-dollar bills. In Seattle the passengers were released in exchange for the money and parachutes, and the plane took off again toward Mexico City.

  Somewhere between Seattle and Reno, a little after 8 p.m., he jumped from the back of the plane into the night, with a parachute and the money. He was never found.

  According to the FBI, the name "D.B. Cooper" was apparently a myth created by the press. It questioned one man with the initials D.B., but he was not the hijacker.

  In 1980, a boy found a rotting package of twenty-dollar bills on a riverbank near Vancouver, Washington. There were about $5,800 in all, and the serial numbers matched the ransom. The FBI says the find gave an added boost to the theory that Cooper did not survive the jump. The FBI has never identified him. In 2016 it redirected its resources away from the case, which remains one of its great unsolved mysteries.

  The two wojak characters in the video are invented, and their lines are dramatized. No real person's words are quoted.

  Do you think he survived the jump?

# Dramatization note: the two wojak characters are unnamed; the lines are invented.
