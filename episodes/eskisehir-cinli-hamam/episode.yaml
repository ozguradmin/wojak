# Eskişehir "cinli hamam" söylentisi (Şubat-Mart 2007). ÖNİZLEME (hesap sahibinin özel isteği, 11.11.2026): cinli konu.
# Araştırma notu: /tmp/arastirma/eskisehir-cinli-hamam.md (repoya girmez).
# Damar 1 (Türkiye'de gösterilebilir yer + ürkütücü şehir efsanesi). Alt tür: hamam (önceki 1. damar: alanya-adam-atacagi,
# kale/uçurum; aynı alt tür değil).
# Kalıp A-B-A-B: A kanca (ürperten an) -> B kapının kilitli olduğunu söyler (tohum) -> A elbiselerinin içeride olduğunu
# söyler -> B aynı kutuda yüz değişir, imkânsızlığı sorar -> 2 kanıt: boş hamam (temsilî), son kare Emniyet açıklaması.
# AYNI YER, AYNI AN: sabaha karşı, hamamın önü.
#   A (hep solda): hamamdan peştamalla kaçan adsız adam (kurgu). B (hep sağda): adsız polis memuru (kurgu).
# Olgu sınırları (araştırma notu):
#   - Haberli çekirdek (Hürriyet, Radikal, DHA, AA; 3 Mart 2007): söylenti ~15 gün sürdü; Emniyet'in yazılı açıklamasına
#     göre söylentide "sabaha karşı" bir vatandaşın cin gördüğü, karakola başvurduğu, "olay yerine giden polislerin de aynı
#     görüntülerle karşılaşıp ürperdiği" anlatılıyordu; Emniyet: böyle bir olay yok, müracaat yok. Müftü vaaz verdi.
#   - Söylentinin ayrıntıları (ayakları ters/çarpık, peştamalla kaçma, hamamın kilitli çıkması ve eşyalarının içeride
#     olması) haberlerde değil, sonradan yazılmış anlatılarda (Gazete Duvar, ParanormalHaber, Ekşi Sözlük): metinde
#     "anlatılana göre". Kaynaksız öğeler (ölüm, polislerin ayağı ters, kamyoncu, ezan) KULLANILMADI.
#   - Hamamın, işletmecinin ve adamın adı videoda ve yayın metinlerinde yok (yalnız iki kaynak URL'sinin adresinde geçer). Görseller temsilî tarihî hamam; haberdeki hamam bir termal
#     otelin içinde, tarihî değil.
# Karakterler: chars/uret.py. Görseller: gorsel.py (arka plan, kanıt 1), kupur.py (son kare).
