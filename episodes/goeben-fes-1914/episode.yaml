# Goeben ve Breslau (Ağustos 1914): İngiliz donanmasından kaçan iki Alman savaş gemisi 10 Ağustos 1914'te Çanakkale
# Boğazı'ndan içeri alındı. Osmanlı hükümeti tarafsızlık kurallarını dolanmak için gemileri "satın aldığını" duyurdu (göstermelik
# satış); 16 Ağustos'ta gemilere Türk bayrağı çekildi, Goeben "Yavuz Sultan Selim", Breslau "Midilli" oldu. Alman mürettebat
# gemide kaldı, Osmanlı üniforması giyip fes taktı.
# Ters köşe (dramatik ironi): A eve dönmeyi bekler, aynı kutuda yüz varyantıyla kendisine fes verildiğini fark eder. B'nin
# başındaki fes S2'de görsel tohumdur. Kanıt sessizce doğrular: güvertede fesli Alman ve Türk subaylar (Underwood & Underwood),
# sonra NYT 13 Ağustos 1914 birinci sayfası "CRUISER GOEBEN SOLD TO TURKEY?".
# Araştırma notu: scratchpad olgular.md (repoya girmez).
# AYNI YER, AYNI AN: Ağustos 1914, İstanbul, Alman gemisinin güvertesi.
#   A (hep solda): Alman denizci (kurgu; gerçek bir kişiyi temsil etmez). B (hep sağda): Osmanlı subayı (kurgu).
#   Gerçek kişilere (Souchon, Enver Paşa) replik verilmez.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak):
#   - İngiliz donanması peşlerindeydi; gemiler Boğaz'a girdikten sonra İngilizler Çanakkale önünde abluka kurdu (EN/TR Wikipedia
#     Breslau/Midilli, AA, Çanakkale Savaşları Ansiklopedisi).
#   - Satış göstermelikti, 11 Ağustos'ta duyuruldu; 16 Ağustos'ta bayrak ve adlar değişti (EN Wikipedia Goeben, Çanakkale
#     Savaşları Ansiklopedisi, turkeyswar, Fikriyat).
#   - Alman mürettebat gemide kaldı, Osmanlı üniforması ve fes giydi (AA, EN/TR Wikipedia Breslau/Midilli, naval-encyclopedia,
#     turkeyswar, Habertürk, Star, Fikriyat).
# Son 5 bölümün son karesi: arşiv fotoğrafı (Karaköy), tablo (Orban), kitap sayfası (Yerebatan), arşiv fotoğrafı (Tahran), müze
# nesnesi (Midas) -> bu bölümde son kare gerçek (kamu malı) gazete sayfası; ilk kanıt arşiv fotoğrafı.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/goeben-fes-1914
