# Karun Hazinesi'nin Kanatlı Denizatı Broşu (Uşak, 2005-2006). Araştırma notu: scratchpad olgular.md (repoya girmez).
# Altın dönem kalıbı: C3iX/C2Fr soru-cevap + C12O/C4V3 yüz varyantı. AYNI YER, AYNI AN: Mart 2006, Uşak Arkeoloji
# Müzesi'nde Bakanlık uzmanlarının broş incelemesi (İzmir Müze Müdürlüğü raporu 08.03.2006; Teftiş Kurulu komisyonu).
#   A (hep solda): Bakanlıktan gelen adsız müfettiş/uzman (bakış açısı karakteri; ters köşe yüzü onun).
#   B (hep sağda): dönemin müze müdürü, ADSIZ (gerçek kişi; 2012'de cezası Yargıtay'da onandı, sonra vefat etti).
#      Kötü/sırıtan yüz yok: sakin, kendinden emin; ironi repliklerde. Gerçek kişiye benzerlik aranmadı.
# Olgu sınırları:
#   - S1 "ihbar": valiliğe gelen isimsiz ihbar mektubu (Yeni Şafak, Vatan, Internethaber, Ege'de Son Söz).
#   - S2 "Amerika'dan ben getirdim": müdür, hazineyi Metropolitan'dan teslim alan heyetteydi (Vali Kavas'ın
#     29.05.2006 açıklaması, Yeni Şafak; History Blog; Smithsonian/Waxman). Mahkemedeki kendi sözü: "Eserleri
#     ABD'den teslim alan benim" (Sabah 2018, Fikriyat, Ege'de Son Söz). Replik bu belgeli olgunun canlandırması.
#   - S3 "bana emanet": "Eserler benim üzerime zimmetli" (aynı kaynaklar); Vatan: hazine ona zimmetlenmişti.
#   - S4 "neden bu kadar ağır": bilirkişi raporu: orijinal 14,3 g dövme, vitrindeki 23,5 g döküm (Hürriyet/Arena
#     05.06.2006, Hürriyet iddianame, Milliyet, Smithsonian). İncelemede tartıldığı canlandırmadır.
#   - Kanıt 2 (A sürümü, telifsiz; hesap sahibi 21.10.2026): kendi gerçekçi gazete kupürümüz (kupur.py; düz kart 1/10 aldı).
#     Söz Milliyet 31.05.2006 1. sayfa kutu başlığıyla birebir: "Bakan Koç: Hırsız evin içindeymiş". Haber
#     metnine göre Kültür (ve Turizm) Bakanı Atilla Koç "Hırsız evin içinde mi?" sorusuna "Evet" dedi (Vatan
#     29.05.2006: "Maalesef içteki insanı koruyan bir alet bulunamadı"). Cümle bakanın birebir sözü değil, gazetenin
#     başlığı: kupürde tırnaksız (üst başlık "Bakan Koç:", manşet "Hırsız evin içindeymiş"), "Kaynak: Milliyet, 31.05.2006" satırıyla. B sürümü (telifli Milliyet sayfası) yalnız
#     hesap sahibindeki eski videoda.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/karun-hazinesi-bros
id: karun-hazinesi-bros
