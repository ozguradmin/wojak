pinned_comment: |
  The shooting of Theodore Roosevelt was an assassination attempt on October 14, 1912, in Milwaukee, Wisconsin. Roosevelt, a former president, was campaigning for a third term as the Progressive, or "Bull Moose," Party candidate. As he stood in an open car outside the Gilpatrick Hotel to wave to a crowd, a man a few feet away fired a revolver.

  Roosevelt carried a folded 50-page speech and a steel eyeglass case in his breast pocket. The bullet passed through both before lodging in his chest near a rib. The Theodore Roosevelt Presidential Library and the Smithsonian say the manuscript and the case slowed it.

  A doctor urged him to go straight to the hospital. He refused, reportedly insisting, "You get me to that speech," and went on to the Milwaukee Auditorium. He told the crowd he had just been shot, and that it would take more than that to stop a Bull Moose. Sources disagree on how long he spoke, from roughly an hour to about 90 minutes.

  Doctors judged that removing the bullet was riskier than leaving it, so it stayed in his chest for the rest of his life. About two weeks later he was back on the campaign trail. He lost the election to Woodrow Wilson.

  The aide and the dialogue are a dramatization. The frames show a 1912 press photo of the bullet-pierced speech pages, and the bullet-damaged steel eyeglass case photographed at the Theodore Roosevelt Birthplace in 2007.

  Would you have finished the speech?

