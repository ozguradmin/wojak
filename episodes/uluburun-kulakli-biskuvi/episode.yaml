# bisküviler" gördüğünü anlattı; bunlar ~3.300 yıllık bir Tunç Çağı gemisinin bakır "öküz postu" külçeleriydi
# (yaklaşık 10 ton bakır; külçe başına ortalama ~24 kg).
# İskelet A-B-A-B: A (süngerci, sol) kanca → B (reis, sağ) "getirseydin" → A "45 metrede sıra sıra" (tohum: derinlik)
# → B ters köşe (aynı kutu, yüz varyantı): "45 metreye bisküviyi kim koymuş?" (imkânsızlık) → kanıt 1: Bodrum Sualtı
# Arkeoloji Müzesi'ndeki Uluburun gemisi modelinin ambarı (sıra sıra külçeler; 3711) → son kare: dört kulaklı bakır
# külçenin yakın planı (MÜZE NESNESİ YAKIN PLANI; "kulaklı bisküvi"nin karşılığı, döngüde ilk repliğe bağlanır).
# Son 5 bölümün son karesi: şehir panoraması (Ankara), arşiv fotoğrafı (Schliemann), kitap sayfası (Yerebatan),
# arşiv fotoğrafı (Tahran), oda fotoğrafı (Pera Palas) -> bu bölümde müze nesnesi; kupür yok.
# Süngerci Ocak 2026'da vefat etti: videoda ve metinlerde adı yok; karakterler kurgu (BEKLET: son 10 yılda ölen kişi).
