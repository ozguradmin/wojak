pinned_comment: |
  Project X-Ray, as it was later codenamed, was a secret US weapon project of World War II that tried to set Japanese cities on fire with bats. It began weeks after Pearl Harbor. Lytle S. Adams, a dental surgeon from Irwin, Pennsylvania, had visited Carlsbad Caverns in New Mexico, home to colonies of Mexican free-tailed bats. In January 1942 he wrote to the White House, and President Roosevelt reportedly judged the idea wild but worth looking into.

  Bats would be chilled into hibernation, each fitted with a small incendiary capsule, and about 1,040 of them packed into a canister dropped from a bomber. Waking as they fell, they would roost in the attics and eaves of wooden buildings, and the capsules would start fires. The first evidence frame is a 1942 photo of a canister.

  In 1943, a demonstration at a new Army airfield near Carlsbad went wrong. According to several accounts, bats carrying live incendiaries woke in the New Mexico heat, flew off and roosted under buildings. The control tower, barracks and other buildings burned, and reportedly no one was hurt. Sources differ on the date and cause.

  The Navy took over later in 1943, then the Marines, and the project was cancelled in 1944. The weapon was never used in combat.

  The final frame is a U.S. Army Air Forces photograph of the fire at the Carlsbad base.

  Dramatized: the characters and dialogue are invented.

  Would you have trusted a plan that depended on bats staying asleep?

