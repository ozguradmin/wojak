pinned_comment: |
  William Patrick Hitler (1911-1987) was Adolf Hitler's British-born nephew, who asked President Franklin D. Roosevelt to let him fight against his uncle's regime.

  Born in Liverpool on 12 March 1911 to Alois Hitler Jr., Adolf's half-brother, and the Irish-born Bridget Dowling, he grew up in England. In 1933 he went to Germany, where his uncle reportedly found him a bank job in Berlin. He left before the war and reached America in early 1939. That July, Look magazine ran his article "Why I Hate My Uncle."

  After America entered the war, he wrote to Roosevelt. In his letter of 3 March 1942 he called himself "the nephew and only descendant of the ill-famed Chancellor and Leader of Germany" and asked to join the fight against tyranny. Roosevelt passed the matter to the FBI, which looked into his background and allowed him to serve.

  On 6 March 1944 he was sworn into the U.S. Navy in New York City and served as a pharmacist's mate. After the war he changed his surname and lived quietly in New York until he passed away in 1987. Some writers call him an opportunist who stayed in Germany while it suited him and left just before the war; others point to his Navy service.

  The dialogue is invented. The final frame is a recreation; the quote is from his letter to President Roosevelt, 3 March 1942, as published by Letters of Note, 2012.

  Principled opponent or opportunist: what is your verdict?

credits: "U.S.S. Iowa (BB61) in the New York Navy Yard looking aft from about Frame 120 (US Navy / National Archives, 1943, public domain), via Wikimedia Commons, cropped, highlights compressed, softened; William-Patrick-Hitler.jpg (U.S. Navy photographer, 1944-1947, public domain), via Wikimedia Commons, cropped and enlarged 5.7x from a 190x222 original (conventional enlargement, film grain added). The final frame is a recreation of a typed letter page; the quote is from his letter to President Roosevelt, 3 March 1942, as published by Letters of Note, 2012."

