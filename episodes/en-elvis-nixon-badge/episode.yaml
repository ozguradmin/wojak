  - "**Image caution:** the background is the White House north front (2007), not 1970. The first evidence frame is the National Archives copy of the memo, page 2; the last frame is the White House photograph by Ollie Atkins. The National Archives notes that the estates of Nixon and Presley may claim rights in their likenesses for commercial use; the photograph itself is a U.S. government work."
  - "The badge request is documented in later accounts (Smithsonian, White House Historical Association) but not in the contemporary meeting memo; the description says 'according to later accounts'."
