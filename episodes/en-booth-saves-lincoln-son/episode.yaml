pinned_comment: |
  In late 1863 or early 1864, Robert Todd Lincoln, the 20-year-old son of President Abraham Lincoln, was a Harvard student traveling by train. By his own account, he was pressed against a car on a crowded station platform when the train began to move. The motion twisted him off his feet and he dropped, feet first, into the gap between the platform and the car.

  A hand seized his coat collar and pulled him up. Turning to thank his rescuer, he saw it was the famous actor Edwin Booth, and he thanked him by name. Accounts differ on the place (Jersey City, Trenton or Kentucky), and the exact date is unknown.

  In Booth's own telling, relayed by William Bispham in 1893, a letter from Adam Badeau, an aide to General Grant, told him two weeks later whose son he had saved; other accounts say months. In 1909 Robert confirmed the story in a statement printed by The Century Magazine, and in 1918 he wrote that the train had moved only a few feet.

  Edwin was the older brother of John Wilkes Booth, who shot President Lincoln in April 1865. In a letter written just after the assassination, Edwin said he had voted for Lincoln.

  The background is an 1869 locomotive photo, not the actual station. The characters are fictional and their lines are dramatized.

  Which part of this story surprises you most?

credits: "Pacific Railroad Locomotive Charles H. Peck, unknown author, 1869, Missouri History Museum (public domain; cropped to square, colour toned down, softened); Edwin Booth, American actor and brother of John Wilkes Booth, by T. R. Burnham, 1865, Library of Congress (public domain; cropped); Edwin Booth and Lincoln, The Century Magazine, April 1909, p. 920, via Internet Archive (public domain; cropped). Images via Wikimedia Commons and Internet Archive."

