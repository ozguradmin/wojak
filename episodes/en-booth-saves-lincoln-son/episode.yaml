ek_maddeler:
  - "**Dramatization:** the two characters are fictional wojak drawings; the dialogue is invented. Documented: Robert Lincoln's own printed account (Century Magazine, April 1909) says his coat collar was seized, he was pulled up, and he recognized Edwin Booth and thanked him by name."
  - "**Source caution:** place (Jersey City vs Trenton vs Kentucky) and date (late 1863 / early 1864) are disputed; the video names neither. When Booth learned who Robert was differs: Booth's own telling via Bispham (Century, 1893, same page 920) says two weeks later; Wikipedia/Emerson say months. The card says only \"A while later\" and the pinned comment gives both. Robert's 1918 letter says the train moved only a few feet, so the video does not claim he was nearly crushed. NPS says the old story that Robert was present at three assassinations is untrue; it is not used."
  - "**Costume note:** the Booth character is a bald wojak in a bow tie (the real Edwin Booth had long dark hair, see the last frame). The line \"My brother hates his father\" is invented dialogue about a documented fact: John Wilkes Booth was a fierce Lincoln opponent while Edwin was a Unionist who had voted for Lincoln. The 1869 locomotive background is illustrative, not the station."
  - "Hidden Words list in chat"

