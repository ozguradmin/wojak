pinned_comment: |
  In 1916 she was aboard HMHS Britannic, the Titanic's sister ship, when it sank.

  Violet Constance Jessop was an Argentine-born stewardess for the White Star Line. In 1911 she was aboard the Olympic when it collided with the British warship HMS Hawke in the Solent. In April 1912 she joined the Titanic, survived its sinking and reached New York on the rescue ship Carpathia. According to her memoir, an officer handed her a baby in her lifeboat, and a woman took the baby back on the Carpathia.

  During the First World War she served as a Voluntary Aid Detachment nurse aboard HMHS Britannic, the third of the Olympic-class liners, converted into a hospital ship. On 21 November 1916 the Britannic struck a German mine in the Aegean Sea and sank. Thirty people lost their lives. In her memoir she wrote that she jumped from a lifeboat being drawn toward the ship's propellers, was pulled under the keel and struck her head. She survived. Years later a doctor found that she had fractured her skull.

  She became known as "Miss Unsinkable". She returned to the White Star Line in 1920 and retired in 1950, after about 42 years at sea.

  Dramatized: the wojak characters and all the dialogue, including "can't sink", are invented. The ships, dates and events are sourced.

  Would you have gone back to sea after three close calls?

ek_maddeler:
  - "**Dramatization:** the two wojak characters are unnamed; the dialogue is invented and the pinned comment says so."
  - "**Britannic date:** sources give 21 November 1916 (Wikipedia, National Geographic); one gives 16 November. The text uses the 21st; no conflict is written into the story."
  - "**Evidence 2 (final frame):** the portrait of Jessop in VAD uniform. The Commons page lists 'Own work by HefePine23', which conflicts with a c. 1915 photograph. Public domain by age either way; the cropped version on Commons credits en-wiki and WWI-era photography. Owner may prefer the cropped version (500x620)."
  - "**Known flaw:** the wojak playing Jessop is a classic male drawing; no period woman wojak fitted the 1912-16 costume."

