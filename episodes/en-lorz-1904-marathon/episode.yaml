ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (a runner who thinks he won, and an official); the dialogue is invented and is not a documented quote, and the runner is not shown as a real person. Documented: Fred Lorz crossed the line first after dropping out at about nine miles and reportedly riding in a car for about eleven; Alice Roosevelt placed a wreath on him and was about to give the medal when the truth came out; he was disqualified; Thomas Hicks was the official winner."
  - "**Left out on purpose (sources disagree):** whose car it was (his manager/trainer, an official car or a passing one), the exact miles in the car (a 1904 newspaper said about three, later sources say ten or eleven), whether the AAU found no intent to defraud (Wikipedia only), the date his ban was reduced and his second suspension of 1905, Hicks's exact doses and timing, and a blogger's claim that Alice was not at the marathon (most sources, incl. Smithsonian and Olympedia, place her there)."
  - "The final frame is a real photograph taken at the 1904 marathon (published 1905): captioned 'Following the Marathon Race' in Lucas's book (the Commons caption names the men aboard: starter Hugh McGrath, A. E. Johnson, George Hench of the Associated Press, and race official Charles Lucas; whether it was taken before or during the race is not certain); it is an illustration of the cars that accompanied the marathon, it does not show Lorz, and sources differ on whose car he rode in (no free photo of Lorz with Alice Roosevelt was found on Commons, Internet Archive or LOC searches). The first evidence frame is the start of the race. The background is a hand-coloured 1904 stereo card of the World's Fair grounds, not the stadium."
  - "Suggested first comment: 'Actually Lorz said it was just a joke, and the AAU let him back in.' Answer: he did claim it was a joke (Smithsonian, Olympics.com), a 1904 paper quoted him admitting exhaustion, and he was disqualified; the ban was reduced and he won Boston in 1905."
  - "Licence note: the start photo (Missouri History Museum) is tagged PD-1923 on Commons with the museum's 'copyright undetermined' statement; it dates from 1904 (creation 120+ years ago), so it is public domain in the US."

