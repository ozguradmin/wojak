# Tahran operasyonu (19 Mart 1985): İran-Irak Savaşı'nda Irak'ın İran hava sahasındaki bütün uçakları vuracağını ilan
# ettiği gün, hiçbir havayolunun almadığı 215 Japonu THY'nin özel seferi çıkardı. Ters köşe: 95 yıl önce (1890)
# Kuşimoto köylüleri batan Osmanlı fırkateyni Ertuğrul'un 69 denizcisini kurtarmıştı.
# Araştırma notu: scratchpad olgular.md (repoya girmez). Altın dönem kalıbı: A B A B soru-cevap (C3iX, Kız Kulesi ritmi),
# kartsız; son replik dramatik ironi ("Dokundu, 95 yıl önce"), cevabı iki kanıt sessizce verir.
# AYNI YER, AYNI AN: Tahran Mehrabad Havalimanı apronu, 19 Mart 1985, THY uçağının kapısı.
#   A (hep solda): Japon mühendis (215 kişi arasında bir Japon firmasının çalışanları ve aileleri vardı).
#     Kurgu karakter, ad yok.
#   B (hep sağda): THY kabin görevlisi (hostes). Kurgu karakter, ad yok; gerçek ekipten kimseyi temsil etmez.
#   Pilotlar, büyükelçiler, Özal ekranda yok; adları yalnız hikâye metninde.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak):
#   - Irak saldırı süresinin bitiminde İran hava sahasındaki askerî ve sivil uçakları vuracağını ilan etti (AA 2025, Hürriyet
#     2004/2018). Süre kaynaklarda 48 ya da 72 saat -> verilmez. Son gün 19 Mart (Hürriyet 2018, ResearchGate) -> S1 "Bu akşam".
#   - Japon havayolları İran ve Irak'tan güvence olmadan uçmadı; yabancı havayolları önceliği kendi vatandaşlarına verdi
#     (Hürriyet 2004/2018, Habertürk, Numata'nın 2015 sözü: AA/Daily Sabah) -> S1 "bize yer yok".
#   - Japon Büyükelçi Nomura Türk Büyükelçi Birsel'den istedi, Özal onayladı, THY "İzmir" (TC-JAY, DC-10) 215 Japonu aldı ve
#     süre dolmadan ~3 saat önce kalktı (Hürriyet 2004/2018, AA 2014/2025, Akşam, ResearchGate).
#   - Ertuğrul 16 Eylül 1890 akşamı Kuşimoto açıklarında tayfunda battı; 500'den fazla ölü (kaynaklarda 530-587) -> "500'den
#     fazla"; 69 kurtulan, Japon halkı yardım etti, Hiei ve Kongo ile İstanbul'a getirildi (T.C. Tokyo BE, AA/CNN Türk 2025,
#     Vikipedi). Gemilerin İstanbul'a mı girdiği, kazazedelerin Çanakkale'de mi aktarıldığı kaynaklarda farklı (GZT) ->
#     metinde "Türkiye'ye götürüldü". 1985-1890 = 95.
#   - 1985 jestinin Ertuğrul'a bağlanması Türk yetkililerin ve basının anlatımı (AA 2014: Büyükelçi Kılıç "Japon halkının
#     gösterdiği kahramanlığa küçük bir cevap"; AA 2025). Kararın gerekçesi o gün belgelenmiş değil: metinde "bağlanır".
#   - S4 hostesin sözü canlandırma (gerçek kişiye uydurma söz yok). ek_maddeler'de açıkça yazıldı.
#   - Kanıt 1: Osman Nuri Paşa'nın Ertuğrul tablosu (fırtınada, PD). Kanıt 2 (son kare, ARŞİV FOTOĞRAFI): Japonya'da
#     Ertuğrul kazazedeleri için tören, torii kapısında Osmanlı bayrağı (1890, PD-Japan-oldphoto). Son 5 bölümün son karesi:
#     levha (Ayasofya), kupür (Göbeklitepe), müze nesnesi (Kaşıkçı), pul (Hezarfen), müze nesnesi (Midas) -> arşiv
#     fotoğrafı yeni tür.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/tahran-1985-ertugrul
id: tahran-1985-ertugrul
