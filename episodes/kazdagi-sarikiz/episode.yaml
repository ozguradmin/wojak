id: kazdagi-sarikiz
title: "Kaz Dağı'nın zirvesine bırakılan kız: Sarıkız efsanesi"

# Müzik sırası (el kitabı §6): önceki tr bölümü (vezir-bostanci-kosusu) klasikti -> konuya göre. Efsane, keramet,
# halk anlatısı: masal ("Bir Varmış"). Son kullanımlar: gizem (efes), masal (antakya, 4 bölüm önce), kanal (hannibal).
music: masal

scenes:
  # 1) KANCA — A (sol), baba: somut tehlike, bağlamsız anlaşılır (kızını dağda bırakıyor). Edremit Kaymakamlığı
  #    sürümü: öldürmeye kıyamaz, kazlarıyla zirveye bırakır. Gerekçe "iftira" (S2), "namus" kelimesi yok.
  - type: dialog
    duration: 3.0
    bg: img/arka.jpg
    blur: 2.6
    chars:
      - {img: chars/baba_sakin.png, side: left, height: 0.50}
    text: "Köy seni konuşuyor kızım,\nseni bu dağda bırakıyorum"

  # 2) B (sağ), Sarıkız: iftira (bütün ana sürümlerde). Kelime tohumu: "kazlarım" (Kaz Dağı adı, metinde "anlatılır").
  - type: dialog
    duration: 2.5
    bg: img/arka.jpg
    blur: 2.6
    chars:
      - {img: chars/kiz_sakin.png, side: right, height: 0.50}
    text: "İftira bunlar baba,\nbenim tek işim kazlarım"

  - type: card
    duration: 1.5
    text: "Yıllar sonra"

  # 3) B: abdest suyu (Kaymakamlık; Duymaz 2001 II, III, V, VI). Zirvede su olmadığı bilgisi S4'te.
  - type: dialog
    duration: 2.0
    bg: img/arka.jpg
    blur: 2.6
    chars:
      - {img: chars/kiz_sakin.png, side: right, height: 0.50}
    text: "Buyur baba,\nabdest suyunu getirdim"

  # 4) TERS KÖŞE — A, aynı kutu, şok yüzü: imkânsızlığı sorar (Kaymakamlık: "Babası suyun tuzlu olduğunu söyler").
  #    Cevabı son kare sessizce verir: aşağıda deniz. Keramet "açıklanmaz"; metinde efsanenin kendi sözüyle.
  #    Tur 1 takipçi SHOULD: soru "deniz"i söylesin (efsaneyi bilmeyen için mucize okunsun).
  - type: dialog
    duration: 2.0
    bg: img/arka.jpg
    blur: 2.6
    chars:
      - {img: chars/baba_sok.png, side: left, height: 0.50}
    text: "Dağın tepesinde deniz suyunu\nnereden buldun?"

  # 5-6) KANIT — önce yer (Sarıkız Tepesi), son kare cevap: Kaz Dağı'nın güney yamacından aşağıda Edremit Körfezi.
  - type: evidence
    duration: 1.5
    images: [img/kanit_1.jpg]
  - type: evidence
    duration: 1.5
    images: [img/kanit_2.jpg]

