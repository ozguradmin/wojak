ek_maddeler:
  - "**Video bir canlandırmadır:** konu bir halk efsanesidir; karakterler kurgu, ekrandaki sözler alıntı değildir. Esas alınan sürüm Edremit Kaymakamlığı'nın sitesindeki anlatıdır (iftira, kazlarıyla zirveye bırakma, abdest suyu, suyun tuzlu olması ve denizden alındığının söylenmesi). Sürümler farklıdır: kimisinde baba öldürmek niyetiyle çıkar, kimisinde su Güre çayından gelir; bunlar yorumlarda düzeltme değil, başka sürümdür."
  - "Kanıtlar: önce Sarıkız Tepesi'nin konisi (Alfinkedisi, 2015; yamaçtaki uzak siluetler seçilmez), son kare Kaz Dağı'nın güney yamacından Altınoluk kıyısı ve Edremit Körfezi (İmmortalance, 2014). Son kare zirveden çekilmedi; metin bunu 'güney yamacından' diye yazar. Arka plan Kaz Dağı'nın yüksek kesiminde karaçam ve kaya blokları (Höhfeld, 2005)."
  - "Hassasiyet: Sarıkız Tahtacı Türkmenleri için kutsal bir ermiştir ve zirvedeki ziyaret yeri bugün de yaşar. Yorumlarda abdest, hac ya da kerametle alay eden, Alevi-Sünni kavgası açan ve 'namus' tartışmasını kurbanın aleyhine çeviren yorumları gizle. Kaz Dağları maden tartışmasına girme."
  - "İlk yorum önerisi: \"Efsanenin Edremit Kaymakamlığı'nın aktardığı sürümünde su önce tuzlu çıkar, Sarıkız denizden aldığını söyler, sonra buz gibi tatlı su getirir. Kızın tepesine Sarıkız Tepesi, babanınkine Baba Tepe denir. Siz hangi sürümünü dinlediniz?\""
  - "YouTube: yükledikten sonra Kontroller adımını kontrol et"
  - "Gizli kelimeler (Hidden Words) listesi sohbette"

sources:
  - "SERT FİLTRE: halk efsanesi; yaşayan özel kişi, çocuk merkezli öğe, süren dava, son 10 yılda ölen, güncel olay yok (araştırmacı raporu /tmp/arastirma/olgular.md §7). Sarıkız yetişkin genç kadın olarak çizildi."
  - "Efsanenin çekirdeği (iftira, baba hacdayken; öldürmeye kıyamayıp kazlarıyla zirveye bırakma; yolculara yol gösteren sarı kız; abdest suyu; su tuzlu, 'yanlışlıkla denizden aldığını söyler', sonra tatlı su; Sarıkız kaybolur, baba Baba Tepe'de ölür; tepe adları): Edremit Kaymakamlığı, 'Sarıkız Efsanesi': https://www.balikesir-edremit.gov.tr/sarikiz"
  - "Altı varyant, iftira, zirveye bırakma ya da öldürme niyeti, 'tâ denizden su', VI. varyantta 'hem denizden tuzlu su, hem de... tatlı su', tepe adları, Kaz Dağı adının efsanede Sarıkız'ın kazlarına bağlanması (s. 99), Sarıkız adının sarı saçtan geldiği (s. 94): Ali Duymaz, 'Kaz Dağı ve Sarıkız Efsaneleri Üzerine Bir Değerlendirme', Balıkesir Üniversitesi SBE Dergisi 4(5), 2001, s. 88-102: https://dergipark.org.tr/tr/pub/baunsobed/article/652127"
  - "Zirveden elini uzatıp denizden su alma motifi, Tahtacı Türkmenlerinin her ağustos dağa çıkıp Sarıkız'ı anması, Kavurmacılar'da Sarıkız hayrı: Aslı Çandarlı Şahin, 'Kazdağları'ndan Sandras'a Tahtacı Türkmen Kültüründe Eski Türk Dininin İzleri', Folklor Akademi Dergisi 5(2), 2022, s. 215-230: https://dergipark.org.tr/en/download/article-file/2299924"
  - "Sürüm farkları (öldürme niyeti, tuzlu su, 'denizden aldım'), sarı saç: Vikipedi, Kazdağı Sarıkız Efsanesi: https://tr.wikipedia.org/wiki/Kazda%C4%9F%C4%B1_Sar%C4%B1k%C4%B1z_Efsanesi ; antik adı İda, Edremit Körfezi'nin kuzeyinde: https://tr.wikipedia.org/wiki/Kaz_Da%C4%9F%C4%B1"
  - "Sarıkız Tepesi en yüksek zirve değildir (Karataş 1774 m, Sarıkız 1726 m): Edremit Kaymakamlığı, Dağ Turizmi: https://www.balikesir-edremit.gov.tr/dagturizm ; metinde yükseklik yazılmadı."
  - "Ağustos ziyareti (Kartalçimen, zirvede kurban ve adak): Hürriyet: https://www.hurriyet.com.tr/gundem/kaz-daglari-nda-sarikiz-senligi-18546537"
