# Çanakkale / Türkiye tarihi — "olay" formatı. Render: python -m wojak render episodes/nusret-mayin-gemisi
# Yapı: kanca (18 Mart, Bouvet'li Fransız denizci) -> "10 gün önce" -> Nusret gecesi -> gerçek fotoğraflar -> cevapsız soru
id: nusret-mayin-gemisi
title: "Koca donanmanın fark etmediği 40 metrelik gemi"

# Kanalın imza müziği (tools/make_music.py ile üretildi, hakkı bize ait)
music: {file: imza_gece_vals.mp3, start: 0, volume: 0.7, fade_out: 0.3}

scenes:
  # 1) KANCA / dramatik ironi: 18 Mart 1915. Bilmeyene sıradan bir manevra, bilene korkunç.
  - type: dialog
    duration: 2.8
    bg: img/bouvet_1914.jpg
    focus: [0.5, 0.5]
    chars:
      - {img: chars/fransiz_denizci.png, side: left, height: 0.56}
    text: "Erenköy Koyu temiz. Dönüşü orada yaparız."
    sfx: [{file: drone, volume: 0.4}]

  # 2) ZAMAN ATLAMASI (geriye): 8 Mart -> 18 Mart = 10 gün
  - type: card
    duration: 1.0
    text: "10 gün önce"
    sfx: [{file: boom, volume: 0.8}]

  # 3) Nusret, 7-8 Mart gecesi: gizlice, kıyıya paralel 26 mayın.
  - type: dialog
    duration: 2.8
    bg: img/nusret_gece.jpg
    darken: 0.5
    grayscale: true
    chars:
      - {img: chars/osmanli_subay_fesli.png, side: right, height: 0.6}
    text: "Tam döndükleri yere... Kıyıya paralel bırakın."
    sfx: [{file: heartbeat, volume: 0.8, at: 0.3}]

  # 4) GERÇEKLİK VURUŞU: Bouvet birkaç dakikada battı.
  - type: evidence
    duration: 1.8
    images: [img/gercek_bouvet_batarken.jpg]
    label: "Gerçek fotoğraf · Bouvet, 18 Mart 1915"
    flash: true
    sfx: [{file: hit, volume: 0.8}, {file: shutter, volume: 0.6}]

  # 5) Fail: 40 metrelik küçük mayın gemisi.
  - type: evidence
    duration: 1.7
    images: [img/gercek_nusret.jpg]
    label: "Nusret · 40 metre, 26 mayın"
    sfx: [{file: shutter, volume: 0.6}]

  # 6) KAPANIŞ: cevapsız soru (izleyici cevabı biliyor), arkada gerçek Irresistible fotoğrafı.
  - type: dialog
    duration: 2.6
    bg: img/gercek_irresistible_1915.jpg
    focus: [0.45, 0.5]
    darken: 0.35
    grayscale: true
    chars:
      - {img: chars/itilaf_deniz_subayi.png, side: right, height: 0.6}
    text: "Üç zırhlı battı... Bu mayınlar nereden çıktı?"
    sfx: [{file: boom, volume: 0.6}]

caption: |
  Nusret mayın gemisi (1915)
  Olayın tamamı sabit yorumda 👇
hashtags: [nusret, çanakkale, 18mart, çanakkalezaferi, tarih]

pinned_comment: |
  Nusret mayın gemisi olayı, 1915 yılında Çanakkale Boğazı'nda yaşanan ve 18 Mart Çanakkale Deniz Zaferi'nin kaderini belirlediği kabul edilen bir olaydır.

  Nusret, Almanya'nın Kiel kentinde inşa edilen, yaklaşık 40 metre boyunda ve 365 tonluk küçük bir Osmanlı mayın gemisiydi. 1915'in ilk aylarında İngiliz ve Fransız zırhlıları Boğaz'ı geçebilmek için tabyaları top ateşine tutuyordu. Türk gözcüler, düşman gemilerinin bu saldırılar sırasında Anadolu yakasındaki Erenköy Koyu'nda manevra yapıp geri döndüğünü fark etti.

  7'yi 8 Mart'a bağlayan gece, Yüzbaşı Hakkı Bey komutasındaki Nusret gizlice Erenköy Koyu'na ulaştı. Mayın grup komutanı Nazmi Bey'in de görev aldığı bu harekâtta, Karanlık Liman önlerine kıyıya paralel 26 mayın döküldü. Düşman bu yeni hattı fark etmedi.

  18 Mart 1915'te İngiliz ve Fransız donanması Boğaz'ı geçmek için büyük saldırıyı başlattı. Öğleden sonra Erenköy Koyu'nda dönüş yapan Fransız zırhlısı Bouvet bir mayına çarptı ve birkaç dakika içinde 600'ü aşkın denizcisiyle birlikte battı. Aynı gün İngiliz zırhlıları Irresistible ve Ocean da mayınlara çarparak battı; Inflexible, Suffren ve Gaulois ağır hasar aldı.

  Bu kayıplardan sonra İtilaf devletleri Boğaz'ı yalnızca donanmayla geçme planından vazgeçti ve 25 Nisan 1915'te Gelibolu Yarımadası'na çıkarma yaptı. Nusret bugün Tarsus'ta müze gemisi olarak sergileniyor; Çanakkale'de ise birebir kopyası bulunuyor.

  Sizce kimsenin fark etmediği bu küçük gemi olmasaydı, Çanakkale'de tarih nasıl yazılırdı?

