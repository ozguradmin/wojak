notes: |
  Karakterler (yalnızca yerel kütüphane, data/wojak_index.csv; bu klasörün chars/ altına kırpılıp kaydedildi):
    - chars/fransiz_denizci.png  = 5_Bloomer/3493 "Happy French Sailor, 1914-1918" — şapka bandındaki "MARINE"
      yazısı boyanarak kaldırıldı (karakterde yazı olmasın diye). Kaynak PNG 262x291 olduğu için 4 kat
      bikübik büyütme + kenar keskinleştirme ile yeniden örneklendi. Bouvet Fransız zırhlısıydı.
    - chars/osmanli_subay_fesli.png = 5_Twinkjak/15359 "Twinjak Ottoman" (fes, bıyık; bayrak/yazı yok).
      Hakkı Bey'i çağrıştırır; birebir portre değil. Kara subayı yeşili ceket koyu lacivert (bahriye) boyandı;
      fes, yaka işaretleri ve kayış aynı kaldı.
    - chars/itilaf_deniz_subayi.png = 5_Doomer/14195 "USN Service Dress Doomer" — genel İtilaf (İngiliz) deniz
      subayı olarak. ABD işaretleri kaldırıldı: şapkadaki kartal/kalkan arması yerine taçlı çapa + defne çelengi
      (Kraliyet Donanması tarzı) çizildi, kollardaki yıldızlar ve göğüsteki (1953 sonrası) ABD madalya şeridi silindi.
  Doğrulama notları / kaynak çelişkileri:
    - Mayın sayısı: Türk resmi kaynakları (Çanakkale Tarihi Alan Bşk.), AA, DHA, HDN, Mental Floss -> 26.
      İngiliz resmi tarihi (Corbett) ve Churchill'e dayanan kaynaklar (en.wiki Naval operations) -> 20. Metinde 26.
    - Tarih: "7/8 Mart gecesi" (Tarihi Alan Bşk., AA, AWM) / "8 Mart sabahı 05.00'te Nara'dan hareket" (DHA, HDN).
      Metinde "7'yi 8 Mart'a bağlayan gece".
    - Nazmi Bey'in rütbesi kaynaklarda yüzbaşı ya da binbaşı; metinde rütbe verilmedi ("mayın grup komutanı").
      Hakkı Bey = Yüzbaşı (Tophaneli) İsmail Hakkı Bey (gemi komutanı).
    - Bouvet kaybı: 639 (en.wiki, Mersin KTB), 643 (24 subay + 619 er), ~660 (1915 basını) -> "600'ü aşkın".
    - Suffren ve Gaulois'nın hasarı mayından değil top ateşinden (en.wiki); metinde sebep yazılmadan "ağır hasar aldı".
    - Ekrandaki replikler dramatizasyon, birebir alıntı değil. "Erenköy Koyu temiz, mayın yok": İtilaf'ın koyu
      mayınsız/güvenli sandığı belgeli (en.wiki Naval operations: "an area thought to be clear"; turkisharchaeonews:
      "considered safe for maneuvers"; samilitaryhistory: "new and unsuspected line of mines"). Koyun "tarandığı"
      söylenmedi: en.wiki tarama yapılmadığını/eksik kaldığını yazıyor. Türk gözcülerin dönüş manevrasını fark ettiği
      (Tarihi Alan Bşk., en.wiki Gulf of Erenköy, AWM) belgeli. "Mayın dökmek" Türkçe denizcilik terimi.
    - AWM ayrıntısı (Alman mühendis Reeder'in raporu): Nusret 7 Mart 23.30'da Nara'dan ayrıldı, Çanakkale'de 26 Carbonit
      mayını yükledi, 8 Mart 05.00'te karanlıkta yola çıktı, mayınları 07.10'da şafakta döktü. Metindeki "7'yi 8 Mart'a
      bağlayan gece" bu zaman aralığını kapsıyor; 3. sahnenin alacakaranlık arka planı da buna uygun.
    - 5. sahne etiketi "1915 civarı": AWM tarihi "c 1915 / probably 1915" ve fotoğrafın 8 Mart harekâtından olmadığını
      belirtiyor (etiket harekâtı iddia etmiyor).
  Müzik: kanalın imza valsi (assets/music/imza_gece_vals.mp3).
