pinned_comment: |
  The Staplehurst rail crash was a derailment on 9 June 1865 at Staplehurst in Kent, England, best remembered because the novelist Charles Dickens was aboard. The boat train from Folkestone to London reached a viaduct where a section of track had been lifted for repairs, and the foreman had read the wrong timetable. Ten people lost their lives, and Dickens's first-class carriage was left hanging at an angle over the broken bridge.

  After getting his travelling companions out, Dickens used his hat to carry water to the injured. He then climbed back into the swaying carriage for the manuscript of Our Mutual Friend, as he wrote to his friend Thomas Mitton.

  In the novel's postscript, dated 2 September 1865, he wrote that he could "never be much nearer parting company with my readers for ever, than I was then". Some biographers say the crash left him shaken for the rest of his life. On 8 June 1870 he had a stroke at dinner at his home, Gad's Hill Place, and he passed away the next day, 9 June 1870: five years to the day after the crash.

  The frames show an engraving from the Illustrated London News (1865), the title page of the 1865 Chapman & Hall edition, and Dickens's stone in Westminster Abbey. The dialogue and the passenger are imagined, and the background is a Victorian viaduct in Sussex, not the crash site. Do you think it was only a coincidence?

credits: "Staplehurst rail crash (engraving), Illustrated London News, 1865, public domain, via Wikimedia Commons (resized); Our Mutual Friend, vol. II title page, Chapman & Hall, 1865, scan via Internet Archive, public domain (cropped, paper tone added); Charles Dickens grave, by Zmbro, 2022, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), https://commons.wikimedia.org/wiki/File:Charles_Dickens_grave.jpg (cropped; the cropped photographs remain under CC BY-SA 4.0); Balcombe Viaduct (Ouse Valley Viaduct), by Matthew Hoser, 2017, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), https://commons.wikimedia.org/wiki/File:Balcombe_Viaduct_(Ouse_Valley_Viaduct).jpg (cropped, colour and brightness adjusted, softened)."

