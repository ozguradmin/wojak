ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (a passenger and Dickens); the dialogue is invented and is not a documented quote. Documented: the 9 June 1865 crash, Dickens's carriage hanging over the bridge, his help for the injured, his climb back for the manuscript (letter to Thomas Mitton, 13 June 1865), the postscript sentence quoted in the pinned comment (verbatim from the 1865 print, with its comma), and his death on 9 June 1870 (stone: DIED 9TH JUNE 1870)."
  - "**Left out on purpose:** the number of injured and of carriages that fell, how the carriage stayed up (sources differ: coupling held, coupling snapped, wreckage), any claim that the crash caused his death (disputed; only 'some biographers' in the pinned comment), the link to The Signal-Man (debated), the Peckham theory, and the identity of his travelling companions."
  - "Evidence 1 is an Illustrated London News engraving (1865, PD-old). Evidence 2 is the title page of volume II of the 1865 Chapman & Hall edition (volume I carries the same title); a warm paper tone was added to the scan's white. Evidence 3 (last frame) is Dickens's stone in Westminster Abbey (2022 photo): CHARLES DICKENS, BORN 7TH FEBRUARY 1812, DIED 9TH JUNE 1870. Background: the underside of the Ouse Valley (Balcombe) Viaduct, Sussex, a Victorian railway viaduct, not the crash site."
  - "Suggested first comment: 'The date is just a coincidence, the postscript meant the end of the book.' Answer: yes, 'THE END' refers to closing the novel, and the death came from a stroke; the video only points out the date match, so coincidence is the supported reading."

