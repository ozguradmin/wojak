pinned_comment: |
  The "In Event of Moon Disaster" memo is a contingency speech draft that presidential speechwriter William Safire wrote in July 1969, while Apollo 11 was on its way to the Moon. Dated July 18, it went to H. R. Haldeman, the White House chief of staff, and planned for a scenario nobody wanted: two astronauts stranded on the lunar surface.

  The draft opens: "Fate has ordained that the men who went to the moon to explore in peace will stay on the moon to rest in peace." It goes on to imagine a mourning world and says the crew were laying down their lives for mankind's most noble goal.

  Safire also added instructions. The President was to telephone each of the widows-to-be before his statement. After it, at the point when NASA ended communications with the men, a clergyman would commend their souls to "the deepest of the deep" and close with the Lord's Prayer.

  The speech was never needed: the crew landed on July 20 and came home safely. According to Safire's later account, the draft was never handed to the President, and it became public only in 1999. The National Archives holds a copy.

  The photo shows Buzz Aldrin on the Moon, taken by Neil Armstrong in 1969. The final frame is page one of the memo.

  Dramatized: the characters and dialogue are invented.

  Would you have written the speech, or trusted the rocket?

