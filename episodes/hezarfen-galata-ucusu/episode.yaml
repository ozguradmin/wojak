# Hezarfen Ahmed Çelebi'nin Galata Kulesi'nden Üsküdar'a uçuşu ve sürgünü (İstanbul, IV. Murad dönemi, 1630'lar).
# Araştırma notu: scratchpad olgular.md (repoya girmez). Altın dönem kalıbı: C2fa/C3iX soru-cevap + C4V3/C12O yüz varyantı.
# AYNI YER, AYNI AN: Topkapı Sarayı (arka planda saraydan görünen Galata Kulesi), uçuştan sonra.
#   A (hep solda): Hezarfen Ahmed Çelebi (bakış açısı karakteri; ters köşe yüzü onun). Benzerlik genel (portresi yok).
#   B (hep sağda): IV. Murad. Kötü/sırıtan yüz yok; ciddi ve sakin.
# Olgu sınırları (TEK KAYNAK Evliya Çelebi, Seyahatnâme I; metinde "Evliya Çelebi'ye göre", "anlatılana göre"):
#   - Okmeydanı'nda kartal kanatlarıyla 8-9 kez talim; padişah Sarayburnu'ndaki Sinan Paşa Köşkü'nden izlerken Galata
#     Kulesi'nin tepesinden lodosla uçup Üsküdar'da Doğancılar Meydanı'na indi; IV. Murad bir kese altın verdi ve "Bu adam pek
#     korkulacak bir adamdır, her ne murad ederse elinden gelir, böyle kimselerin bekası câiz değil" diyerek Cezayir'e
#     sürdü; orada vefat etti (TDV İA "Hezarfen Ahmed Çelebi"; İstanbul Ansiklopedisi/Koçu; GZT Seyahatnâme alıntısı; en.wiki).
#   - YIL KAYNAKTA YOK: 1632 / 1638 / "1630-1632" sonradan verilen tahminler -> ekranda ve metinde yıl yok.
#   - Mesafe kaynaklarda 3.358 m / 6 km -> verilmez. "Lodosa karşı" (TDV) / "lodos rüzgârıyla" (Koçu) -> yalnız "lodosla".
#   - Başka kaynakta geçmiyor; bazı tarihçiler efsane sayıyor -> metinde açıkça yazılı.
#   - S1 "uçtum", S2 "kese altın", S4 korku gerekçesi + Cezayir Evliya'dakinin özü. S3 övünme ve S5 fark etme repliği canlandırma.
#   - Kanıt 1: Galata Kulesi'nden Sarayburnu (Topkapı), CC BY-SA 3.0. Kanıt 2 (son kare, PUL; kupür/nesne değil): 1950 PTT
#     ICAO Kongresi 20 kuruşluk hatıra pulu, Hezarfen'in Galata'dan uçuşu (PD-TR).
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/hezarfen-galata-ucusu
