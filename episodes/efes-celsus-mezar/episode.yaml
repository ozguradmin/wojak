# gömülür?" -> 2 kanıt: 1904 kazı fotoğrafı (Heberdey 1905, Fig. 15) ve son kare Belleten (TTK), Ekim 1979'daki cümle
# "Lahit Mezar içinde bugün Kitaplığın kurucusu yatmaktadır." (belge.py; kendi dizdiğimiz sayfa yakın çekimi) = cevap.
# Tur 1 (iki hakem 7/7): son kare Almanca levha okunmuyordu ve levha türü sarayburnu'nda vardı -> Türkçe belgeli cümle.
# Olgu: Heberdey 1905 (ÖJh 8, Beiblatt Sp. 66-68): kuzey koridorun batı ucundan merdivenle apsisin altındaki temelde tonozlu
# mezar odasına inilir, içinde iyi korunmuş beyaz mermer lahit; "Grabkammer unter der Apsis hat also Ti. Julius Aquila den
# Vater begraben". Replikler yıl, kişi adı ve "iki açıklık" (tek kaynak) içermez.
# Son 5 son kare (yeniden eskiye): teknik plan (anemas), kaya kabartması (antakya), gravür (balıklı), kitap sayfası
# (hannibal), mekân levhası (sarayburnu) -> bu bölüm: dergi sayfası yakın çekimi (canlandırma; Türkçe söz).
