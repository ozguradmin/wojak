# Ankara elçi vagonları (Mart 1925): Ankara 13 Ekim 1923'te başkent olunca İstanbul'daki yabancı elçilikler taşınmakta
# acele etmedi; Ankara'ya iş için gelen büyükelçiler geceyi (ve işi) Ankara Garı'ndaki vagonlarda geçirdi. İngiltere
# Büyükelçisi Lindsay Mart 1925'te altı kişilik heyetle iki vagon getirdi (salon = çalışma odası + kançılarya, bir de yataklı
# vagon); vagonlar garda yaklaşık bir hafta durdu (Room for Diplomacy; Erdem 2017 / Hâkimiyet-i Milliye 16.3.1925).
# 29 EKİM ÖZEL: ironi yalnız dönemin şartlarına ve yabancı elçinin yanılgısına. Atatürk çizilmez, konuşturulmaz, adı replikte
# yok; Cumhuriyet, Meclis ve millet alay konusu değil. Kapanış: bugünkü Ankara (gururlu, slogansız).
# Ters köşe (dramatik ironi): A (yabancı elçilik görevlisi, kurgu) "nasılsa İstanbul'a döneriz" der; B Sovyetlerin çoktan
# yerleştiğini söyleyince aynı kutuda yüz varyantıyla "Bekle, başkent gerçekten Ankara'da mı kalacak?" diye sorar.
# Kanıt: NYT Magazine 30.5.1926 (ilk Amerikan temsilcisi yük vagonunda, ziyaretçi diplomatlara yataklı vagon), sonra bugünkü
# Ankara (son kare = cevap). Son 5 bölümün son karesi: kitap sayfası, arşiv fotoğrafı, tablo, oda fotoğrafı, arşiv fotoğrafı
# -> bu bölümde son kare bugünkü şehir panoraması; gerçek kamu malı gazete sayfası ilk kanıtta.
# AYNI YER, AYNI AN: Mart 1925, Ankara'da bir sokak (arka plan: Hacı Bayram Camii ve Afgan elçiliğinin bulunduğu sokak, Aralık 1922).
#   A (hep solda): yabancı bir elçilikte görevli (kurgu; ülkesi belirtilmez, gerçek kimseyi temsil etmez).
#   B (hep sağda): istasyon memuru (kurgu). Fes 1925 Kasım'ındaki Şapka Kanunu'ndan önce uygundur.
