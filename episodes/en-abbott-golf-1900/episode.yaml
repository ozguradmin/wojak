pinned_comment: |
  In October 1900, an American golfer named Margaret Abbott won a nine-hole women's tournament at the Compiègne golf club, north of Paris. It was held as part of the Paris World's Fair, and the Chicago Tribune ran it under the headline "Wins Women's Golf Cup." Her prize was an antique porcelain bowl, not a medal.

  Today the International Olympic Committee counts that event as an Olympic competition, which makes Abbott the first American woman to win an Olympic event. (She was not the first woman to win an Olympic title: Hélène de Pourtalès won in sailing that May, and Charlotte Cooper took the first individual title, in tennis, that July.) Her mother, Mary, played too and finished seventh, and they remain the only mother and daughter to compete in the same Olympic event.

  Reportedly, Abbott never learned her win was Olympic. In a 1984 Golf Digest piece, her son wrote that she had told the family only that she had won the golf championship of Paris. Sports historian Paula Welch began piecing her story together in the 1970s, two decades after Abbott passed away in 1955.

  The event was never billed as the Olympics at the time, and the bowl's whereabouts are reportedly unknown.

  The last two frames: a 1900 magazine photo of the golf event (it does not name the players) and the Chicago Tribune headline from October 1900. The wojak characters are fictional.

  If you won something huge and nobody told you, would you want to know?

