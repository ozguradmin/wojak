  - "**Hedged or left out on purpose:** the exact date (3 Oct per Olympedia, FFGolf, History.com; 4 Oct per USA Golf and Atlas Obscura), the distance from Paris to Compiègne (30 mi / 50 mi / 70 km in different sources), her birth year (1876 per Olympedia, 1878 per Wikipedia, NWHM, Britannica), and the whereabouts of the bowl (no known photo, one source). The 'never knew' claim rests on the family's account (Dunne, Welch) and is worded 'reportedly'."
  - "The 1900 photo's Commons title names Abbott, but the image itself carries no caption naming the player, so the video does not say who is in it. The first scene's background is the 1900 World's Fair main gate in Paris; the tournament itself was at Compiègne."
  - "Suggested first comment: Hélène de Pourtalès (sailing, May 1900) was the first woman to win an Olympic title and Charlotte Cooper (tennis, July 1900) the first individual champion; Abbott was the first American woman. The Tribune clipping is dated 7 Oct on Commons and 6 Oct (p. 9) in Wikipedia's references, so only the month is written. The IOC counts the 1900 golf event as Olympic, though no one called it that at the time."

