  - "**Tartışmalı:** adam sayısı (400 levha, ~500 Legacy), taklit edilen güç (8.000; Legacy bir sayfada 20.000), cephe boşluğu (25-70 mil), decoy sayısı (12 / 23 / birkaç düzine). Videoda sayı yok ('hundreds', 'a division'); açıklamada aralık verildi. Alman tepkisi bağımsız kaynakla bulunamadı: videoda 'Almanlar kandı' iddiası yok (tur 2'de repliklerden çıkarıldı), açıklama 'the claim comes mainly from the unit's own reports' diyor. Tur 1 izleyici MUST'ları: (1) gerçek 6th Armored 'cepheden ayrılmadı', Brittany'den doğuya ilerliyordu, hattı bir süvari bölüğü tutuyordu; (2) şişirme tanklar ~24 saat sonra kaldırıldı, ağır işi ses/telsiz/rol yaptı."
  - "Arka plan Bettembourg/Abweiler anıt alanındaki orman (Mart 2024 fotoğrafı, levha kırpımla dışarıda); son kare Uluslararası Casusluk Müzesi'ndeki şişirme tank kopyası (2025, modern sergi nesnesi, savaş fotoğrafı değil). NARA'daki Ghost Army şişirme tank fotoğrafının serbest kopyası bulunamadı; British IWM H 42531 Ghost Army olmadığı ve Crown lisansı kesin olmadığı için kullanılmadı."
