# edirne-sarayi-1878 — Edirne Sarayı (Saray-ı Cedid-i Âmire), 18 Ocak 1878: 1877-78 Osmanlı-Rus Savaşı'nda Rus ordusu
# Edirne'ye yaklaşınca saray bölümlerinde depolanan cephane, düşmanın eline geçmesin diye Osmanlı yetkililerince ateşe
# verildi; patlamalar üç gün sürdü, saray büyük ölçüde yok oldu; Ruslar 20 Ocak'ta şehre girdi.
# İskelet C2fa (dramatik ironi): A (er, sol) kanca: "saraydaki cephane ne olacak?" (tohum: cephane sarayda) → B (adsız
# paşa, sağ) belgeli gerekçe: düşmana bırakmayın, ateşe verin → A itaat → kart "Bir süre sonra" (patlamalar sürerken,
# Ruslar girmeden) → A aynı kutuda şok yüzüyle fark eder: saray da yanıyor.
# Kanıt: Sayger & Desarnod taşbaskısı (1829 gezisi): Cihannüma Kasrı ile saray (ne/nerede) → son kare: Cihannüma
# Kasrı'nın bugünkü kalıntısı (cevap; YERİN BUGÜNKÜ FOTOĞRAFI; son 5: kazı fotoğrafı, kupür, kitap sayfası, müze nesnesi,
# kupür). Emri veren kaynaklarda ayrışıyor (Cemil Paşa / Ahmed Eyüb Paşa): paşa adsız kurgu rol. Can kaybı iddiası yok.

