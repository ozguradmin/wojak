pinned_comment: |
  The Cadaver Synod was a trial held in January 897 in the Lateran Basilica in Rome, where Pope Stephen VI (numbered VII in older lists) put the body of Pope Formosus on trial. Formosus had passed away in April 896 and had been buried for about nine months.

  His body was exhumed, dressed in papal robes and seated on a throne, and a deacon was appointed to answer for him. The deacon's words were not recorded. Formosus was accused of perjury, of breaking church rules against moving from one bishopric to another, and of coveting the papacy. He was found guilty and his papacy was declared invalid. The three fingers he used for blessings were reportedly cut off, and the body was thrown into the Tiber. It was later recovered and reburied.

  Later in 897, Stephen VI was deposed and imprisoned, and he reportedly did not survive his imprisonment. Later accounts add an earthquake during the trial, but historians dispute that. Pope Theodore II annulled the synod during his reign of about 20 days in late 897, and in 898 John IX banned posthumous trials. Sergius III later reinstated the verdict.

  The final frames are real: an engraving from a 19th-century edition of Maurice de La Châtre's Histoire des papes and the 1870 painting "Le Pape Formose et Étienne VI" by Jean-Paul Laurens (Musée des Beaux-Arts, Nantes).

  Note: the video is a dramatization. The characters and dialogue are invented, and the background shows the Lateran Basilica as it looks today (it has been rebuilt since 897).

  If you were the deacon appointed to speak for Formosus, what would you say?

