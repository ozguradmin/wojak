pinned_comment: |
  In August 1835 The Sun, a New York penny paper, began a six-part series that was presented as a reprint from an Edinburgh journal. It said the British astronomer Sir John Herschel had used a huge new telescope at the Cape of Good Hope to study the Moon. The articles described bison-like animals, one-horned goats, tailless beavers that walked on two legs, and winged, bat-like humanoids the paper called Vespertilio-homo, or man-bats.

  Herschel really was at the Cape at that time, from 1834 to 1838. He had made no such discovery and knew nothing about the articles beforehand. The articles named Dr Andrew Grant, an invented companion of Herschel, as their author.

  Historians credit Richard Adams Locke, a reporter on the Sun. Locke later said it was satire, aimed at a popular belief in the 1830s that other worlds were full of life. The paper sold well. Many readers, and several other newspapers, took the articles as real news. On 16 September 1835 the Sun admitted that the articles were fabricated, though it never printed a formal retraction. Herschel found the hoax amusing at first, but later grew tired of letters from people who believed it.

  Dramatized: the two wojak characters and their dialogue are invented. The reporter on the right stands in for the paper's writer. No words are put in Herschel's mouth. The dates, the names and the description of the articles are sourced.

  Would you have believed it in 1835?

