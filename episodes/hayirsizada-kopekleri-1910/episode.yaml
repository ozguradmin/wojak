# hayirsizada-kopekleri-1910 — Hayırsızada sürgünü: 1910 yazının başında (emir 28 Mayıs, nakil Haziran başı), İttihat ve
# Terakki döneminde İstanbul Şehremaneti on binlerce sokak köpeğini toplatıp Marmara'daki Sivriada'ya (Hayırsızada)
# bıraktı. Ağaçsız, tek kuyulu kayalık adada belediyenin gönderdiği ekmek yetmedi; köpekler birkaç ay içinde açlıktan ve
# susuzluktan öldü. Adanın yakınından bir kayık geçince köpeklerin hep birden kıyıya geldiğini ve iniltilerini Pierre
# Loti anlatıyor (Bardakçı 1998 aktarımı); tekneleri gören köpeklerin suya atlayıp yiyecek istediği Afyoncu/Kuzucu'da.
# İskelet C2fa (dramatik ironi): A (adsız belediye memuru, sol) kanca: köpekleri bu ıssız adaya bırakıyoruz → B (adsız
# sandalcı/mavna reisi, sağ) uyarır: yiyecek yetmez → A geçiştirir: ekmek göndeririz (belediyenin kendi iddiası; tohum)
# → kart "Birkaç gün sonra" → B aynı kutuda şok yüzüyle: kayığı görünce hepsi neden kıyıya koşuyor (cevap: açlar).
# Kanıt: İstanbul sokak köpekleri (ca. 1900, Rijksmuseum CC0; kim) → son kare: Le Petit Parisien'in 7.8.1910 resimli
# ekindeki çizim, adaya indirilen köpekler + gazetenin kendi alt yazısı (cevap; DÖNEMİN RESİMLİ GAZETE ÇİZİMİ; son 5:
# taşbaskı, kazı fotoğrafı, kupür, tablo, kupür). Olayın serbest lisanslı fotoğrafı bulunamadı (RAPOR).
# Sayı tartışmalı (40-50 bin arşiv; 80 bin yaygın): videoda sayı yok, metinde "on binlerce".

