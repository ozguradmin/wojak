caption: |
  Hayırsızada'ya bırakılan İstanbul köpeklerine ne oldu?
  Olayın tamamı sabit yorumda 👇
hashtags: [hayırsızada, istanbul, tarih]

pinned_comment: |
  Hayırsızada sürgünü, 1910 yılında İstanbul'da yaşanan ve on binlerce sokak köpeğinin Marmara'daki Sivriada'ya bırakılması olarak bilinen bir olaydır.

  Mayıs 1910'un sonunda, İttihat ve Terakki döneminde, İstanbul Şehremaneti köpeklerin toplanması için emir aldı. Haziran başında köpekler mavnalara yüklenip şehre yaklaşık 15 kilometre uzaktaki, halk arasında Hayırsızada da denen ağaçsız ve suyu kıt kayalık adaya götürüldü. Kaç köpek taşındığı kaynaklarda farklı: sıkça anılan rakam 80 bin, Kemalettin Kuzucu'nun arşiv çalışması 40-50 bin diyor.

  Belediye adaya haftada üç kez ekmek gönderdiğini söyledi, ama bu binlerce köpeğe yetmedi. Köpekler birkaç ay içinde açlıktan ve susuzluktan öldü. Murat Bardakçı'nın aktardığı bir Pierre Loti metnine göre, adanın yakınından bir kayık geçtiğinde köpekler hep birden kıyıya geliyor, iniltileri duyuluyordu; Erhan Afyoncu da tekneleri gören köpeklerin suya atlayıp yiyecek istediğini yazar. Anlatılana göre sesler geceleri rüzgârla İstanbul kıyılarına kadar ulaşıyordu.

  Anlatılana göre İstanbullular, iki yıl sonraki depremi ve Balkan Savaşı'nı köpeklerin "ahına" bağladı.

  Videonun son karesi, Fransız Le Petit Parisien gazetesinin 7 Ağustos 1910 tarihli resimli ekindeki çizimdir; altındaki Fransızca yazı "LES 80.000 CHIENS DE CONSTANTINOPLE DÉPORTÉS DANS L'ILE OXIAS", Türkçesi: "Konstantinopolis'in 80.000 köpeği Oxias adasına sürüldü."

  Sence hayırsız olan ada mıydı, yoksa köpekleri oraya bırakanlar mı?

