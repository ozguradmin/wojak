# Midas Tümülüsü'nün açılması (Gordion, Polatlı/Ankara, 1957): "dokunduğu her şeyi altına çeviren" kralın adını taşıyan
# mezardan tek bir altın çıkmadı.
# Araştırma notu: scratchpad olgular.md (repoya girmez). Altın dönem kalıbı: C2fa (niyet -> uyarı/cevap -> kart -> yüz
# varyantıyla fark etme) + C3iX soru-cevap.
# AYNI YER, AYNI AN: Midas Tümülüsü'nün önü, 1957 kazısı. Konuşanlar kazıya Zonguldak'tan getirilen madenciler.
#   A (hep solda): genç madenci (bakış açısı karakteri; ters köşe yüzü onun). Kurgu karakter.
#   B (hep sağda): madencilerin ustabaşısı. Kurgu karakter (Young 1958: madenciler "kendi ustabaşılarını" getirdi).
#   Arkeolog (Rodney Young) ekranda yok; adı yalnız hikâye metninde.
# Olgu sınırları:
#   - Tünel Zonguldak maden bölgesinden getirilen madencilerce kazıldı (Young 1958, Penn Expedition; Hürriyet Daily News
#     2026; HeritageDaily 2026; Penn Digital Gordion). Ustabaşı + üç vardiya yalnız Young'da -> metinde "Young'ın anlattığına göre".
#   - Mezar soyulmamıştı; altın yoktu (Penn Expedition "contained no gold"; Penn Gazette "no trace of gold"; Science News;
#     Penn Almanac; Broad Street Review "untouched").
#   - Oda MÖ ~740 (ağaç halkası); Midas Asur kayıtlarında MÖ 709'da hayatta -> büyük olasılıkla babası Gordias; mezarda ad
#     yok (Penn Expedition "Tumulus MM"; BBC/T24; Hürriyet Daily News).
#   - Tünel uzunluğu kaynaklarda 82 m / ~70 m / 230 ft -> verilmez. Bronz kap sayısı (180+ / "onlarca") -> "çok sayıda".
#   - S1-S3 ve S4 canlandırma; "Kral Midas" adı 1957'de tepenin adıydı (Midas Mound). S2 efsanenin kendisi.
#   - Kanıt 1: mezar odasının kütük duvarı (CC BY-SA 2.0). Kanıt 2 (son kare, MÜZE NESNESİ): tümülüsten çıkan sirenli bronz
#     kazan, içi bronz kaselerle dolu (CC BY-SA 4.0). Son 5 bölümün son karesi: minyatür, levha, kupür, müze nesnesi
#     (Kaşıkçı), pul (Hezarfen) -> arka arkaya aynı tür yok.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/midas-mezari-altin
