# ücret "145 dolar 29 sent" (kelime tohumu: sargıda elle yazılı "145 29") → A alıcı Smithsonian, gönderen Harry Winston
# (tohum: sargıdaki adres) → B ters köşe (aynı kutu, yüz varyantı): "Hope Elması'nı kâğıda sarıp mı" (sargı son karede) → elmas → son kare sargı.
# Karakterler kurgu; gerçek kişileri temsil etmez (kim postaladı kaynaklarda çelişkili: NPM blogu "Winston'ın çalışanı").
# Son 5 bölümün son karesi: tarihî harita, müze nesnesi, şehir panoraması, arşiv portresi, oda fotoğrafı
# -> bu bölümde son kare posta belgesi (paketin pullu, damgalı sargı kâğıdı); kupür yok.
