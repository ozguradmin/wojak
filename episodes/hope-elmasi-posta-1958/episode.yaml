# Hope Elması (45,52 karat), kuyumcu Harry Winston'ın firmasınca 8 Kasım 1958'de New York'tan Smithsonian'a taahhütlü
# postayla gönderildi: toplam 145,29 $ (2,44 $ posta + 142,85 $ ~1 milyon $ sigorta), 10 Kasım'da postacı teslim etti
# (USPS Historian, NPM, Evening Star 7/8/10.11.1958). Winston: "It's the safest way to ship gems." (Evening Star 8.11.1958)
