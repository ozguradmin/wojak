pinned_comment: |
  Tsutomu Yamaguchi was a Mitsubishi engineer who was in Hiroshima on 6 August 1945 and back at work in Nagasaki three days later. Born in Nagasaki in 1916, he was a 29-year-old tanker designer. He was there on a three-month business trip when the first atomic weapon exploded at 8:15 a.m. on 6 August, roughly three kilometres away. He was badly hurt, but he made his way back to his home city of Nagasaki by train.

  On 9 August he reported to the Mitsubishi office. While he described what he had seen in Hiroshima, his supervisor reportedly doubted that a single weapon could destroy an entire city. At 11:02 a.m. the second atomic weapon exploded over the Urakami district of Nagasaki.

  At least 160 people are known to have been in both cities, but in March 2009 Yamaguchi was officially recognised as a double hibakusha, a survivor of both attacks, the only person to receive that recognition. He spoke about nuclear weapons, including at the United Nations in 2006. He passed away in Nagasaki on 4 January 2010, aged 93. By most estimates, well over 100,000 people lost their lives in the two attacks.

  The photos show the atomic cloud over Hiroshima (6 August 1945) and over Nagasaki (9 August 1945). The background is a hand-coloured postcard of a Nagasaki shipyard from about 1910.

  Dramatized: the characters are fictional and the dialogue is invented.

  Would you have believed a man who told you one weapon had destroyed a city?

