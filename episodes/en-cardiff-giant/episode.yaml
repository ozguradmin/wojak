pinned_comment: |
  The Cardiff Giant was a hoax: a ten-foot gypsum statue, carved in Chicago in 1868, buried on a New York farm and "discovered" as a petrified man in October 1869. Two well diggers on William Newell's farm in Cardiff struck a stone foot. Newell later charged visitors 50 cents to see it.

  George Hull, a cigar maker, had argued with a preacher about the giants of Genesis and decided to fake a petrified man. A block of Iowa gypsum was carved in Chicago, shipped to his relative's farm and buried in November 1868, almost a year before the "find." The diggers were not just lucky: according to Smithsonian and Archaeology, Newell told them where to dig.

  In late November 1869, Yale paleontologist Othniel C. Marsh called it "of very recent origin, and a most decided humbug," noting that soft gypsum could not keep fresh tool marks after centuries underground. P. T. Barnum said he offered $50,000 for the original, was refused, and displayed a plaster copy in New York that December; by his own account it drew more visitors.

  The first evidence frame is a detail of a lithograph of the giant; the print's own caption reads "Exhumed at Cardiff, Onondaga Co., N.Y., Oct. 16, 1869." The final frame is a New York State historical marker for the giant, photographed in 2013.

  Dramatized: the characters and dialogue are invented.

  Would you have paid 50 cents to see it?

