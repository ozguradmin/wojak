  - "**Licence (owner's call):** the plaque photo is CC BY-SA 2.0 (share-alike, attribution in credits). The Times press photo of the body vehicle was rejected because its public-domain basis is an age claim with an unverified photographer."
  - "**Dates:** the plaque prints 24 April 1943 as the death date (the headstone date); records show January 1943. The script says 'passed away in January 1943'."
  - "**Character style:** the ingiliz_er_1915 kit (pith helmet) is a 1915 costume; a 1943 officer would not wear it. Known weakness, see RAPOR."

