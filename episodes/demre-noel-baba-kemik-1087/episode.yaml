# gemiyle Bari'ye götürdü. Araştırma notu: /tmp/arastirma/olgular_demre.md (repoya girmez). Damar 1 (Türkiye'de
# gösterilebilir yer + mezar + ürkütücü/mucizevi ayrıntı). Önceki 1. damar cennet-cehennem-obrugu (obruk): aynı alt tür değil.
# İskelet C2fa (dramatik ironi): A mezarı kırdırır -> B keşiş direnir, mezardan "kutsal yağ" aktığını söyler -> A "Papa
# gönderdi" diye geçiştirir -> kart -> A aynı kutuda şok yüzüyle lahdin içindeki sıvıyı fark eder -> 2 kanıt
# (kırık lahit; son kare manna şişecikleri (1876 bağışı)).
# AYNI YER, AYNI AN: kilisenin içi. A (hep solda): adsız, silahlı Barili denizci (kurgu). B (hep sağda): adsız bekçi
# keşiş (kurgu). Gerçek kimseyi temsil etmezler.
# Olgu sınırları (olgular_demre.md; çağdaş anlatı Nicephorus, çev. Jones 1978 + 13. yy Grek anlatı):
#   - Kırk yedi silahlı adam kiliseye girdi; dört bekçi keşiş "ölürüz de vermeyiz" dedi, bağlandı (silahlı çatışma yok).
#   - Denizciler Papa'nın gönderdiğini İDDİA etti (metin bunu kandırma gibi sunar) -> S3 karakterin iddiası.
#   - Myra'daki mezardan kutsal sıvı/yağ sızdığına inanılırdı (bekçiler süngerle sıvı çıkarılan yeri gösterdi) -> S2.
#   - Genç bir denizci döşemeyi ve mermer lahdi demir çekiçle kırdı -> S1 "Kırın şu mermeri".
#   - Lahit "kutsal sıvıyla dolu", güzel koku, kemikler sıvının içinde (anlatı) -> S4; metinde "anlatıya göre".
#   - Bari'de her 9 Mayıs'ta "manna" toplanır; 1925 analizi saf su; yoğuşma olduğu düşünülür -> yalnız hikâye metni.
#   - "62 denizci", "Türkiye resmen iade istedi", "kemikler kesin azizin" KULLANILMAZ.
