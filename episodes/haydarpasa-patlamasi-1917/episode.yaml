# haydarpasa-patlamasi-1917 — 6 Eylül 1917 ikindi sularında Haydarpaşa Garı ve limanında, Suriye-Filistin cephesine
# gidecek cephane ve benzinin biriktiği sahada peş peşe patlamalar oldu; yangın ertesi güne sürdü, garın çatısı ve
# kuleleri yandı, duvarlar ayakta kaldı. Dahiliye Nazırı Talat Paşa'nın aynı gün matbuata verdirdiği metin: "benzin
# fıçılarından birinin kazaen iştiali neticesinde istasyon binalarının bir kısmıyla birkaç vagon muhterik olmuştur"
# (BOA DH.KMS 45/36; Yar & Zengin, SAVSAD 2026). Ölü sayısı ve neden bugün de kesin değil.
# İskelet C2fa (dramatik ironi): A (adsız Osmanlı eri, sol) kanca: gar havaya uçtu → B (adsız gar memuru, sağ) uyarır:
# cephane vagonları peş peşe patlıyor (tohum: "vagon") → A: yarın bütün gazeteler bunu yazacak (ironik niyet) → kart
# "Bir süre sonra" → A aynı kutuda şok yüzüyle: gazeteler neden birkaç vagon yandı diyor (resmî metin) → kanıt: yangından
# sonra gar sahası, devrilmiş fıçılar (Avusturya Devlet Arşivi) → son kare: harap gar, Eylül 1917 (ARŞİV FOTOĞRAFI; son 5: gazete
# çizimi, türbe fotoğrafı, minyatür, yer fotoğrafı, kupür/belge cümlesi).
# Videoda saat, ölü sayısı, fail yok (tartışmalı); Ermeni vinççi / Georg Mann anlatıları kullanılmadı.

