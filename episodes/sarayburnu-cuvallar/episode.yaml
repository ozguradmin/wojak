sources:
  - "SERT FİLTRE: 17. yüzyıl rivayeti; ilgili herkes yüzyıllar önce öldü. Çocuk merkezde değil, yaşayan özel kişi, son 10 yılda ölen, süren dava yok."
  - "Dalgıç ile İbrahim bağını açıkça kuran sonraki anlatı: Noel Barber, Lords of the Golden Horn (1973) Türkçe aktarımı (liberteryen.org 2013; yazar 'muhtemelen hiç olmamış' notuyla). Penzer ve TIME dalgıcı İbrahim'e bağlamaz; metin bunu söyler."
  - "Rivayet (İbrahim haremini çuvallarla Boğaz'a attırdı, 'several hundred', biri kurtulup Paris'e ulaştı) ve dalgıç sahnesi ('diver who was sent down after a wreck off Seraglio Point ... sacks ... standing upright on the weighted end and swaying slowly to and fro with the current'): N. M. Penzer, The Harem (Lippincott, 1936), s. 186: https://archive.org/details/haremaccountofin00penquoft"
  - "Dalgıç sahnesinin aynı ifadeyle aktarımı (Penzer eleştirisi): TIME, 'Books: Women & No-Men', 15 Şubat 1937: https://time.com/archive/6819978/books-women-no-men/"
  - "'It is said ... Ibrahim the Mad (1640-48) ... all 280 of the women in his harem'; bostancıların ağırlıklı çuval uygulaması: Mike Dash, Smithsonian, 22 Mart 2012: https://www.smithsonianmag.com/history/the-ottoman-empires-life-or-death-race-164064882/"
  - "280 anlatısı 'bazı tarihçilerce uydurma ya da abartı' (Wikipedia'nın Niaz 2014 s. 296 dipnotu; Niaz sayfası okunamadı, metinde yumuşatıldı: 'belgeli dayanağı gösterilemez; kimi araştırmacılar'); tahta çıkış 1640, tahttan indirilme 8 Ağustos 1648, öldürülme 18 Ağustos 1648; Murad IV ölünce hanedanın hayatta kalan tek erkek üyesi: English Wikipedia 'Ibrahim (Ottoman sultan)': https://en.wikipedia.org/wiki/Ibrahim_(Ottoman_sultan)"
  - "Hanedanın hayatta kalan son erkek üyesi; 'Deli' lakabı 20. yüzyıl tarihçilerinin yakıştırması, hakkında uydurma hikâyeler: Daily Sabah, 'Mighty sovereigns of the Ottoman throne: Sultan Ibrahim': https://www.dailysabah.com/arts/portrait/mighty-sovereigns-of-the-ottoman-throne-sultan-ibrahim"
  - "Yerli kaynakların hiçbirinde geçmeyen, Batılı eserlerdeki iddia; gerekçe olarak ihanet dedikodusu: tarihistan.org 'Sultan İbrahim (Deli)': https://www.tarihistan.org/sultan-ibrahim-deli/19242/ ; Türkçe yaygın anlatım (280 çuval, dik duran ve akıntıyla sallanan çuvallar): liberteryen.org, 2013: https://liberteryen.org/2013/02/280-cariyenin-toplu-katliami/"
  - "Peirce, The Imperial Harem (OUP 1993): 280 anlatısı geçmiyor; çuvalla denize atma cezasına tek belgeli örnek 1603 Lello raporu (İbrahim'le ilgisiz): https://archive.org/stream/the-imperial-harem-women-and-sovereignty-in-the-ottoman-empire-1993-pdf/The-imperial-harem-Women-and-sovereignty-in-the-Ottoman-Empire-1993-pdf_djvu.txt"
  - "17. yy İstanbul dalgıçları (iç donuyla, taşla inerdi; Evliya'ya göre 300 nefer): İstanbul Ansiklopedisi 'Dalgıç': https://istanbulansiklopedisi.org/handle/rek/12269"
  - "GÖRSEL img/arka.jpg — 'Topkapı Palace from the Bosphorus in 2024 6700.jpg', Dosseman, 2024, CC BY-SA 4.0: https://commons.wikimedia.org/wiki/File:Topkap%C4%B1_Palace_from_the_Bosphorus_in_2024_6700.jpg. Değişiklik: kıyı yolu ve şantiye paneli dışarıda kalacak kare kırpım, 1080'e büyütme, renk 0,85, parlaklık 0,92; renderer bulanıklaştırır."
  - "GÖRSEL img/kanit_1.jpg — 'Sultan İbrahim, 17. yüzyıl gravürü.jpg', anonim, yayımcı Pieter de Jode (II), Rijksmuseum RP-P-1905-4810, CC0: https://commons.wikimedia.org/wiki/File:Sultan_%C4%B0brahim,_17._y%C3%BCzy%C4%B1l_grav%C3%BCr%C3%BC.jpg. Değişiklik: sorguç dahil sarıktan göğse kırpım (alt yazı kadraj dışında), 1080x816."
  - "GÖRSEL img/kanit_2.jpg (son kare) — 'Harem entrance Topkapi Istanbul 2007 71.JPG', Gryffindor, 2007-08, kamu malı ({{PD-self}}, ham sayfadan doğrulandı): https://commons.wikimedia.org/wiki/File:Harem_entrance_Topkapi_Istanbul_2007_71.JPG. Değişiklik: özgün 1600x1200 dosyadan kapı kemeri ve levha kırpıldı (sağdaki modern boru dışarıda), 1080x816. Kapının yanında küçük bir sigara yasağı etiketi kadrajda kalır."
