pinned_comment: |
  In September 1859, a bankrupt San Francisco businessman named Joshua Norton sent a letter to the Daily Evening Bulletin declaring himself "Emperor of these United States." The paper printed it, and for about the next twenty years he lived in the city as Norton I.

  In January 1867 a "special officer" arrested him. Special officers were private guards paid by neighborhood residents and businesses, not regular police. Norton was first held for vagrancy, and once money was found on him the charge became lunacy, which could have meant commitment to the state asylum at Stockton.

  The newspapers protested. The Daily Alta California wrote that he had harmed no one, robbed no one and despoiled no country. Police Chief Patrick Crowley released him and apologized on behalf of the police. Norton answered by issuing an imperial pardon to the officer who had arrested him, and police officers reportedly saluted him from then on.

  Norton printed his own scrip in denominations from 50 cents to $10, and some of the businesses he frequented accepted it. Theaters reserved seats for him; the final frame is one of his 50-cent notes, dated 1878. When he collapsed on a San Francisco street on 8 January 1880 and did not survive, he had only a few dollars; the Pacific Club paid for his funeral, and about 10,000 people reportedly came to see his body.

  The dialogue in the video is imagined. Was San Francisco humoring him, or protecting him?

