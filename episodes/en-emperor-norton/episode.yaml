ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (a neighborhood guard and Norton); the dialogue is invented and is not a documented quote. Documented: the January 1867 arrest by a special officer (vagrancy, then lunacy), the newspaper outcry, Police Chief Crowley's release and apology on behalf of the police, Norton's imperial pardon of the officer, and police salutes afterwards. The video compresses the charge to 'lunacy' and the officer to 'the guard'; the chief's exact words are in no source, so none are quoted."
  - "**Left out on purpose:** ('twenty-one years' is a popular figure; FoundSF, KQED and OpenSFHistory say about 20; 1859 to Jan 1880 is just over 20), Bummer and Lazarus (not his dogs per FoundSF and others), the 'Frisco' decree (probably fake), the 30,000-person funeral and two-mile procession (later legend; the Chronicle reported three carriages), Twain and Stevenson links, free meals (only 'reportedly'), 'within days' for the release (one source), and the year he added 'Protector of Mexico' (1861 vs 1866)."
  - "The background is Montgomery Block, San Francisco, 1862, a period street view, not the exact place of the arrest. Evidence 1 is a carte-de-visite portrait of Norton by Bradley & Rulofson (about 1870, standing, cap and epaulettes); the final frame is a real 50-cent note of the Imperial Government of Norton I dated 12 June 1878, photographed in a museum display (the photograph is CC BY-SA 3.0; the note itself is a 19th-century document). No recreated frame is used. The character B wears a plain blue kepi and coat as a stand-in for Norton's blue military-style coat; his feathered hat (seen in other portraits) is not shown."
  - "Sensitive handling: the story is framed as an unjust confinement threat, not a joke about illness. Norton died in 1880; nobody living is named."
  - "Suggested first comment: 'Actually Bummer and Lazarus were his dogs.' Answer: the record says they were two strays; a caricature drew them with him. The video leaves the dogs out."
