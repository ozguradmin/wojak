notes: |
  Önerilen paylaşım: 23 Ekim 2026 (15. yıl dönümü)

  Gündem değil (2011) ama takvim kancalı eski hikâye: yayın tarihi 23 Ekim 2026, 17:00-21:00.
  Ekran replikleri dramatizasyon; hiçbiri doğrulanmış gerçekle çelişmiyor:
    - "Sütüm kurudu" -> annenin anlatımı (Hürriyet, Vatan, Sabah 26.10.2011).
    - "Abla, bebeği bana uzatabilir misin?" -> kurtarmacının sözü: "Annesine bebeği uzatmasını söyledim" (Sabah).
    - "Bu kız hiç kucağımdan inmiyor" -> annenin sözü "Deprem olduğunda Azra kucağımdaydı" (Vatan).
    - "Bulduğumuzda hâlâ annesinin kucağındaydı" -> "Azra bebeğe ulaştığımda annesinin kucağındaydı" (Sabah); AP:
      "held tight against her mother's shoulder when rescuers found them". "hâlâ" = deprem anında da kucağındaydı (Vatan).
    - Hayatını kaybeden baba Sinan Karaduman'a replik verilmedi; dede ile ilgili 'ironi' kurulmadı (aileyi yaralar).
  Kaynaklar arası farklar (metinde güvenli ifade kullanıldı):
    - Kurtarma süresi 45,5 (Sabah) / 47 (Hürriyet, Vatan, AA, DHA) / 48 saat (AP) -> metinde "yaklaşık 47 saat", ekranda "2 gün sonra".
    - Babaanne adı: Saadet (Vatan, Hürriyet), Gül Saadet (Sabah), Gulsaadet (AP), Gülsade (AA, DHA). "Gülsüm" hiçbir
      kaynakta yok -> metinde ad verilmedi.
    - Kurtarmacının adı: Kadir Dilek (Sabah) / Kadir Direk (AP) -> ad verilmedi. Ekip: İzmir Sivil Savunma (Hürriyet,
      Sabah) = bugünkü AFAD İzmir (TGRT 2020). Vatan, sesleri dinleme cihazıyla Jandarma ekibinin tespit ettiğini yazıyor.
    - Bina 5 katlı (Vatan, Sabah, AP); TGRT 2020 "7 katlı" diyor -> metinden kat sayısı çıkarıldı.
    - Ankara'ya nakil: Sabah "ambulans uçak", Vatan "ambulans helikopter", Hürriyet "hava ambulansı" -> "hava ambulansıyla".
      Anne yaralı ve yarı baygın kurtarıldı (Hürriyet, AP) -> yalnız Azra'nın sağlık durumu "iyi" diye yazıldı.
    - Doğum: 9 Ekim (Hürriyet, Vatan), nüfusta 10.10.2011 (NTV) -> metinde tarih verilmedi.
  Çocuk: Azra bugün reşit değil (15). Yalnız ilk adı kullanıldı (aile röportajlarla kamuya açıkladı: AA, DHA 2017);
  soyadı, anne/baba/dede adları, ailenin yaşadığı şehir ve bugünkü yaşı metinden çıkarıldı (KONSEPT §8; AA 2017'de dede
  ayrıntıları torununa henüz anlatmadıklarını söylüyor). Güncel fotoğraf, okul, mahalle bilgisi kullanılmadı.
  Kanıt sahnesi Azra'nın değil, aynı gün (25.10.2011) AKUT'un Van'daki çalışmasının fotoğrafı; etiket bunu açıkça
  söylüyor: "Gerçek fotoğraf · Van depreminde arama kurtarma, 25.10.2011 (Foto: AKUT)". Azra'yı İzmir Sivil Savunma
  ekibi kurtardı, AKUT değil. Ajans fotoğrafı (Azra'nın kurtarılış anı, AP/DHA) kullanılmadı.
  Görseller Commons'tan 1600 px genişlikte indirildi (Commons API/upload bu IP'ye 429 verdiği için wsrv.nl görsel
  vekili üzerinden; içerik Commons'taki dosyanın aynısı, yalnız yeniden boyutlandırılmış).
