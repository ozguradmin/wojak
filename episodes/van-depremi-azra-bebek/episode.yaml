# Türkiye deprem mucizesi — "olay" formatı (altın dönem 'enkaz mucizesi' türü).
# Render: python -m wojak render episodes/van-depremi-azra-bebek
id: van-depremi-azra-bebek
title: "Van depreminde enkaz altında annesinin tükürüğüyle hayatta kalan 14 günlük bebek"

# Kanalın imza müziği (tools/make_music.py ile üretildi, hakkı bize ait)
music: {file: imza_gece_vals.mp3, start: 0, volume: 0.7, fade_out: 0.3}

scenes:
  # 1) KANCA (dramatik ironi): sıradan bir anne cümlesi. Sonu bilen için anlamı değişir:
  #    annesi "Deprem olduğunda Azra kucağımdaydı" diyor (Vatan); kurtarmacı onu ~47 saat sonra
  #    hâlâ annesinin kucağında buldu (Sabah, AP). Son replik bu cümleye geri bağlanır (döngü).
  - type: dialog
    duration: 2.8
    bg: img/ercis_apartman_2012.jpg
    focus: [0.45, 0.4]
    darken: 0.25
    chars:
      - {img: img/anne_bebekli_sade.png, side: right, height: 0.62}
    text: "Bu kız hiç kucağımdan inmiyor"
    sfx: [{file: drone, volume: 0.4}]

  # 2) GERİLİM: enkaz altı, karanlık; yalnız ses (karakter yok: gülümseyen yüz sahneyi bozuyordu).
  #    Doğrulanmış bilgi: annenin sütü kurudu, bebeği tükürüğüyle besledi (Hürriyet, Vatan, Sabah).
  - type: dialog
    duration: 2.7
    bg: img/akut_van_2011_4_beton_kesit.jpg
    darken: 0.5
    grayscale: true
    zoom: 1.12
    text: "Sütüm kurudu... Dayan kızım, dayan"
    text_y: 0.42
    shake: 8
    sfx: [{file: hit, volume: 0.8}, {file: heartbeat, volume: 0.6, at: 0.6}]

  # 3) ZAMAN ATLAMASI (kaynaklar 45,5-48 saat diyor; hepsi ~2 gün, 25 Ekim)
  - type: card
    duration: 1.1
    text: "2 gün sonra"
    sfx: [{file: boom, volume: 0.9}]

  # 4) KURTARMA: kurtarmacının doğrulanmış anlatımından ("Annesine bebeği uzatmasını söyledim", Sabah).
  - type: dialog
    duration: 2.7
    bg: img/akut_van_2011_3.jpg
    focus: [0.0, 0.5]
    chars:
      - {img: img/kurtarmaci_tulum.png, side: right, height: 0.58}
    text: "Abla, bebeği bana uzatabilir misin?"
    sfx: [{file: whoosh, volume: 0.5}]

  # 5) KANIT: gerçek fotoğraf; Azra'nın kurtarılışı DEĞİL, aynı gün AKUT'un Van'daki çalışması -> etiket bunu söylüyor.
  - type: evidence
    duration: 1.8
    images: [img/gercek_akut_van_2011_2.jpg]
    label: "Gerçek fotoğraf · Van depreminde arama kurtarma, 25.10.2011 (Foto: AKUT)"
    zoom: 1.06
    sfx: [{file: shutter, volume: 0.7}]

  # 6) KAPANIŞ: ağır gerçek, ilk repliğe geri bağlanır (döngü). Kurtarmacının sözü:
  #    "Azra bebeğe ulaştığımda annesinin kucağındaydı." (Sabah); AP: "held tight against her mother's shoulder".
  - type: dialog
    duration: 2.4
    bg: img/ercis_enkaz_cami_2012.jpg
    focus: [0.5, 0.6]
    darken: 0.6
    grayscale: true
    chars:
      - {img: img/kurtarmaci_tulum.png, side: left, height: 0.58, flip: true}
    text: "Bulduğumuzda hâlâ\nannesinin kucağındaydı"
    sfx: [{file: boom, volume: 0.6}]

