  # Kalıp A B A B (C2kkZ8BsngB / C3iXf2zsRvo mekanizması): son replik bir SORU, cevabı kanıttaki gerçek manşet verir.
  # Anne: kucağında askılı bezde uyuyan bebekle (kit: anne_basortulu2, üç varyantta da aynı yerde).
  # 1) KANCA — A (anne, sol). Olay anı: ~47. saat, ekipler enkazın içine ulaşıyor.
  #    Doğrulanan: annesi "Enkaz altında olduğumuz iki gün boyunca Azra'yı kucağımdan hiç bırakmadım",
  #    "yukarılarda çalışma olduğu halde, kimseler sesimizi duymuyordu" (Vatan) -> "yok mu?" (iki gündür duyulmayan
  #    enkazdaki kişinin sesi; "var mı?" kurtarmacının sorusu); kurtarılırken 16 günlüktü (Hürriyet: "14 günlükken
  #    altında kaldığı enkazdan 16 günlükken") -> "2 haftalık".
  - type: dialog
    duration: 3.0
    bg: img/arka_enkaz_akut_van3.jpg
    chars:
      - {img: /home/user/wojak/assets/kit/anne_basortulu2/tek_gozyasi.png, side: left, x: 0.225, height: 0.5}
    text: "Sesimi duyan yok mu?\nKucağımda 2 haftalık bebeğim var"   # elle kırım: cümle sınırında (C3iX "Ne demek istiyorsun? / Evet ...")

  # 2) CEVAP — B (kurtarmacı, sağ). Önce A'nın sorusuna cevap ("Duyuyoruz": "Sesimi duyan var mı?" çağrısının
  #    herkesin bildiği karşılığı; orijinallerde B önce A'yı cevaplar: C3De "Tamam hemen oraya yöneliyoruz", C2Fr
  #    "Bilmiyorum, ama merak etme..."). Ekipler onları dinleme cihazlarıyla bulmuştu (Vatan). Kurtarmacının kendi
  #    anlatımı: "Annesine bebeği uzatmasını söyledim", "Ancak bebeği çıkartacak kadar bir boşluk vardı"; Sabah:
  #    "Ekibin açtığı minik delikten ise sadece Azra çıkabilecekti. Anneden 14 günlük bebeği uzatması istendi"
  #    (26.10.2011). 6 kelime, greedy kırım iki satır ("Duyuyoruz abla, delik dar, / bebeği uzat").
  - type: dialog
    duration: 2.5
    bg: img/arka_enkaz_akut_van3.jpg
    chars:
      - {img: /home/user/wojak/assets/kit/kurtarmaci_klasik/sakin.png, side: right, height: 0.49}
    text: "Duyuyoruz abla, delik dar, bebeği uzat"

  # 3) TIRMANIŞ — A, aynı kutu, yüz varyantı (kızarmış gözler, iki gözden kalın yaş, açık ağlayan ağız). Annenin kendi anlatımı:
  #    "Enkaz altında hiçbir şey yiyemediğimiz için sütüm de kurudu ... Çünkü açtı" (Vatan; Sabah/AA aynı).
  #    "Al": bebeği uzatıyor (S2'ye cevap). Tek satır, olay anında, şimdiki zaman.
  - type: dialog
    duration: 2.5
    bg: img/arka_enkaz_akut_van3.jpg
    chars:
      - {img: /home/user/wojak/assets/kit/anne_basortulu2/agliyor.png, side: left, x: 0.225, height: 0.5}
    text: "Al, sütüm kurudu, kızım çok aç"

  # 4) FARK ETME — B, aynı kutu, yüz varyantı (Nervous Wojak yüzü: göz ucuyla anneye/bebeğe kayan yan bakış,
  #    endişeli kaşlar, 4 ter damlası + baretin altında mavi soğuk ter; STIL §4: bakış ortaya ve diğer konuşmacıya).
  #    "Bekle, ... nasıl ...?" fark etme sorusu (C4V3 "Bekle, ev neden sallanıyor?"): süt yoksa bebek iki gün nasıl
  #    dayandı? Özne düşük (S3: "kızım çok aç"); 7 kelime, 2,5 sn'ye sığar (okuma kuralı: 2,5 sn'de en fazla 7). Soru kurgu (dramatizasyon); "2 gündür" belgeli (~47 saat).
  #    Cevabı reel söylemez, son kanıttaki gerçek manşet verir: "Anne, Azra'yı tükürüğüyle besledi".
  - type: dialog
    duration: 2.5
    bg: img/arka_enkaz_akut_van3.jpg
    chars:
      - {img: /home/user/wojak/assets/kit/kurtarmaci_klasik/cok_terli.png, side: right, height: 0.49}
    text: "Bekle, sütün yoksa 2 gündür\nnasıl dayandı?"

  # 5-6) KANIT — önce gerçek kurtarma anı (AFP, 25.10.2011: Azra kurtarmacıların elinde, oksijen maskesiyle),
