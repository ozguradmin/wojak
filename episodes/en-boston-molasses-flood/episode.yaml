pinned_comment: |
  The Great Molasses Flood struck Boston's North End on January 15, 1919. A steel tank at 529 Commercial Street, owned by United States Industrial Alcohol (through its Purity Distilling subsidiary, as the headline says) and holding about 2.3 million gallons of molasses, ruptured at around 12:30 p.m. The wave is estimated at 15 to 25 feet high (accounts range from 15 to 40; the marker says 40) and about 35 mph. It took 21 lives and injured roughly 150 people.

  The tank was built in 1915 and reportedly leaked almost from the start. People reportedly heard it groan whenever it was filled, and local children reportedly collected the syrup that seeped out. In 1918 the tank was painted brown, reportedly to hide the leaks. Investigators later found it had never been properly tested: reportedly only about six inches of water were run in before it was filled with molasses.

  At first the company blamed anarchists for planting an explosive device. In 1925, court-appointed auditor Hugh Ogden rejected that and held the company responsible for the tank's structural failure. The company paid about $628,000 in damages. A 2014 engineering analysis found the steel was only about half as thick as it should have been.

  The final frames are real: the front page of the Boston Daily Globe, January 16, 1919 (first-night figures: 11 lives lost; the final toll was 21), and the Bostonian Society historical marker at the site.

  Note: the video is a dramatization of reported accounts. The characters and dialogue are invented.

  Which would you have noticed first: the leak or the paint job?

