# Kız Kulesi efsanesi. Altın dönem "efsane kişi" kalıbı (C2P Kapalak kızı, C2-U Belkıs, C2VH Malatya balıkları):
# AYNI YERDE (Kız Kulesi'nin kendisi, denizin ortasında; STIL §6 "olayın gerçek yeri", C2VH/C3dO gibi: Türk izleyici
# 1. saniyede tanır), AYNI ANDA (prensesin 18. yaş günü) iki kişi konuşur: A = imparator (baba) hep solda, B = prenses
# hep sağda. Ters köşe: prenses aynı kutuda yüz varyantıyla (sakin -> korku) fark eder; son replik babanın
# hediyesine döner ("getirdiğin"). Kart yok.
# Kanıt en sonda: kulenin 19. yüzyıl fotoğrafı (Sébah, kamu malı: "eski ve gerçek"), sonra yılanlı sepet efsanesinin
# kendi başlığıyla görseli (telifli; 22.10 YouTube ihlali sonrası yerine BoraBora704 -> Sébah, bkz. telif_notu).
# Doğrulanan anlatım (Üsküdar Belediyesi, Wikipedia EN, istanbul.com): kâhin/kehanet, kız 18. yaş gününde yılan
# sokmasıyla ölecek; imparator onu yılanlardan uzak tutmak için denizdeki kuleye koyar, onu yalnız babası ziyaret
# eder; 18. yaş gününde kehaneti boşa çıkardığını düşünüp bir sepet meyve getirir, meyvelerin arasına gizlenmiş
# yılan prensesi sokar. Türkçe anlatımlarda meyve üzümdür; bazı anlatımlarda sepeti hizmetçiler getirir, bazılarında
# yılan âşık bir subayın getirdiği çiçek sepetinden çıkar.
# Karakterler: imparator = chars/imparator_uret.py (sade taç + üzüm sepeti + sevecen baba yüzü: açık gözler prensese
# bakar, açık gururlu gülüş; final tur 5), prenses = assets/kit/prenses_genc/uret.py.
# Arka plan: arkaplan.py (img/kiz_kulesi_sonse_kaynak.jpg -> img/arka_kiz_kulesi_sonse.jpg).
# Render: python -m wojak render episodes/kiz-kulesi-efsanesi
