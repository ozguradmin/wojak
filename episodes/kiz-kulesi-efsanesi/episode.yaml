# Kız Kulesi efsanesi. Altın dönem "efsane kişi" kalıbı (C2P Kapalak kızı, C2-U Belkıs, C2VH Malatya balıkları):
# AYNI YERDE (kulenin içindeki taş oda), AYNI ANDA (prensesin 18. yaş günü) iki kişi konuşur: A = imparator (baba)
# hep solda, B = prenses hep sağda. Ters köşe: prenses aynı kutuda yüz varyantıyla (sakin -> korku) fark eder. Kart yok.
# Kanıt en sonda: bugünkü kule (ilk kez burada görünür), sonra yılanlı sepet efsanesinin başlıklı görseli.
# Doğrulanan anlatım (Üsküdar Belediyesi, Wikipedia EN, istanbul.com): kâhin/kehanet, kız 18. yaş gününde yılan
# sokmasıyla ölecek; imparator onu yılanlardan uzak tutmak için denizdeki kuleye koyar, onu yalnız babası ziyaret
# eder; 18. yaş gününde kehaneti atlattığına sevinip bir sepet meyve getirir, meyvelerin arasına gizlenmiş yılan
# prensesi sokar. Türkçe anlatımlarda sepet üzüm sepetidir ve bazen hizmetçiler ya da âşık bir subay getirir.
# Karakterler: imparator = chars/imparator_uret.py (sade taç), prenses = assets/kit/prenses_genc/uret.py.
# Render: python -m wojak render episodes/kiz-kulesi-efsanesi
