# Pera Palas anahtarı (7 Mart 1979): Warner Bros "Agatha" filmi için tutulan bir Hollywood medyumu, Agatha Christie'nin
# ruhuyla konuştuğunu ve 1926'daki 11 günlük kayboluşunun sırrına götüren anahtarın İstanbul'daki Pera Palas Oteli'nin 411
# numaralı odasında saklı olduğunu iddia etti. Gazeteciler odada toplandı, Los Angeles'tan telefonla verilen tarife göre döşeme
# söküldü ve kapının dibinde yaklaşık 8 cm'lik paslı bir anahtar bulundu. Otel yönetimi anahtar için 2 milyon dolar istedi,
# film şirketi ödemedi; Haziran 1979'daki grevle iş yarım kaldı.
# Ters köşe (dramatik ironi): B (gazeteci) "Ruhlar anahtar mı saklar?" diye alay eder; döşeme kalkınca aynı kutuda yüz
# varyantıyla "Bekle, anahtarın yerini nereden bildi?" diye sorar.
# Kanıt sessizce doğrular: Daily Herald 15.12.1926 birinci sayfası "MRS. CHRISTIE FOUND AT HARROGATE ... HER MEMORY GONE"
# (kimin sırrı), sonra bugünkü 411 numaralı oda (son kare; Agatha Christie'nin fotoğrafı duvarda).
# Araştırma notu: scratchpad olgular.md (repoya girmez).
# AYNI YER, AYNI AN: 7 Mart 1979, Pera Palas'ta bir oda.
#   A (hep solda): otel görevlisi (kurgu; telefonda medyumu dinliyor). B (hep sağda): Türk gazeteci (kurgu).
#   Gerçek kişilere (medyum, otel yöneticisi) replik verilmez; adları videoda ve metinde yok.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak). Christie'nin Pera Palas'ta kaldığı otelin anlatımıdır, belgesi
# tartışmalı (famoushotels.org): metinde "otelin anlattığına göre".
# Son 5 bölümün son karesi: gazete sayfası (Goeben), arşiv fotoğrafı (Karaköy), tablo (Orban), kitap sayfası (Yerebatan),
# arşiv fotoğrafı (Tahran) -> bu bölümde son kare olayın geçtiği odanın bugünkü renkli fotoğrafı; gazete sayfası ilk kanıtta.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/pera-palas-anahtar-1979
