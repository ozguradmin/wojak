# catalhoyuk-sekinin-alti — Çatalhöyük (Çumra, Konya; MÖ ~7100-5950): ölüler evlerin tabanına ve ana odadaki,
# uyumak ve oturmak için kullanıldığı düşünülen sekilerin altına gömülür; gömüden sonra seki yeniden sıvanır, evde yaşam
# sürerdi. Bir evin altında ortalama 5-8 gömü; 1 numaralı yapıda ikincil gömüler dâhil 62 kişiye ait kalıntı.
# İskelet A-B-A-B: A (yaşlı akraba, sol) kanca: "babanı sekinin altına gömeceğiz" → B (genç, sağ) itiraz → A tohum:
# "tabanın altında zaten başka ölüler de var" → B aynı kutuda şok yüzüyle fark eder: yıllardır ölülerin üstünde uyumuş.
# Kanıt: Çatalhöyük evi (nerede), son kare: kazıda açılmış ev içi gömü (cevap; ARKEOLOJİK KAZI FOTOĞRAFI; son 5 bölüm:
# kupür, tablo, müze nesnesi, kupür, kitap sayfası). Karakterler kurgu; çocuk gömüsü anlatıda ve görselde yok.
# "Aile/ata" kelimesi ekranda yok (DNA: aynı evin altındakiler her zaman akraba değil); "babanı" tek bir kurgu kişinin sözü.

