# kart "Bir süre sonra" → A aynı kutuda şok yüzle, evin önünde: "yatalak rahibe bu evi nasıl bildi?" → kanıt: kitabın
# başlık sayfası (Emmerich'in adı), son kare: Gabriel von Max'in 1885 tablosu, yatağında Emmerich (TABLO; son 5 bölümde yok:
