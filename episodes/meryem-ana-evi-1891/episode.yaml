# İzmir'deki Lazarist rahipler, anlatılana göre kitabın yanlış olduğunu göstermek için Peder Henri Jung'un başında olduğu
# küçük bir ekiple yola çıktı ve tarife uyan yıkık taş evi buldu (yerel Rumlar orayı "Panaya Kapulu" diye ziyaret ediyordu).
# İskelet C2fa (dramatik ironi): A (kuşkucu genç rahip, sol) kanca "kitaptan mı bulacağız?" → B (yaşlı rahip, sağ) kitabın
