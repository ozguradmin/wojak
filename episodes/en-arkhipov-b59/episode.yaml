pinned_comment: |
  On 27 October 1962, at the height of the Cuban Missile Crisis, the Soviet diesel submarine B-59 was hunted by United States Navy ships in the Sargasso Sea while the US enforced its blockade of Cuba. The boat had been cut off from Moscow for days, its batteries were nearly drained and temperatures inside reportedly passed 45 °C.

  US destroyers, among them USS Beale, dropped small practice depth charges meant to force it to surface. The Americans did not know that B-59 carried a torpedo with a nuclear warhead. According to an account by Soviet officer Vadim Orlov, the captain, Valentin Savitsky, believed the war might already have begun and ordered the torpedo readied. Historians still disagree on how far that order went.

  Launching it reportedly required the agreement of three senior officers. Vasili Arkhipov, chief of staff of the submarine brigade, is credited with persuading the captain to surface instead.

  B-59 surfaced that evening among the US ships, was photographed by the US Navy and was sent home. The torpedo was never fired. The story stayed secret for decades. Arkhipov passed away in 1998; in 2017 his family received the inaugural Future of Life Award.

  The last frame is not B-59 but another Foxtrot-class submarine, photographed by the US Navy in 1986. The first photo shows B-59 on 28 or 29 October.

  Dramatized: the characters are fictional and the dialogue is invented, loosely based on reported accounts.

  How close do you think the world really came that night?

