pinned_comment: |
  By 1876, a Chicago counterfeiting gang had a problem: its best engraver, Benjamin Boyd, was locked up in the state penitentiary at Joliet. According to the National Park Service, gang leader James "Big Jim" Kinealy planned to steal Abraham Lincoln's remains from his tomb in Springfield, hide them in the Indiana sand dunes, and demand Boyd's release and $200,000.

  Kinealy's men, Terence Mullen and Jack Hughes, were to do the job. Lewis Swegles was in on the plan too, but he was a paid Secret Service informant. Agent Patrick Tyrrell set an ambush with police and Pinkerton detectives hidden inside the monument.

  On Election Night, November 7, 1876, the thieves cut through the tomb's padlock and opened the sarcophagus. Accounts differ on how far they moved the coffin. Then a pistol went off by accident, the thieves ran, and the lawmen reportedly ended up firing at each other in the dark.

  Mullen and Hughes were arrested in Chicago days later, and in 1877 each got a year in prison. Lincoln's remains never left Oak Ridge Cemetery. In 1901 they were placed in a steel cage and sunk ten feet down, encased in concrete, where they still rest.

  The Secret Service was created in 1865 to fight counterfeiting. The evidence frames come from John Carroll Power's 1890 book on the attempt: its title page and the engraving "Interior of the Catacomb, as the Thieves Left It". The wojak characters are fictional.

  Would you have trusted Lewis with the plan?

credits: "View of Lincoln's Tomb - Oak Ridge Cemetery - Springfield - Illinois - USA by Adam63, 2017, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), https://commons.wikimedia.org/wiki/File:View_of_Lincoln%27s_Tomb_-_Oak_Ridge_Cemetery_-_Springfield_-_Illinois_-_USA.jpg, cropped, colour and brightness adjusted, softened; History of an Attempt to Steal the Body of Abraham Lincoln (title page, and the engraving 'Interior of the Catacomb, as the Thieves Left It', p. 56) by John Carroll Power, Springfield, Ill., 1890, public domain, via the Internet Archive (cropped, contrast adjusted)."

