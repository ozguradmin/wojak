ek_maddeler:
  - "**Dramatization:** the two characters are fictional gang roles; the dialogue is invented and quotes no one. The video shows no remains: the evidence frames are the title page of John Carroll Power's 1890 book on the attempt and its engraving of the empty catacomb room (the tomb room as the thieves left it, no remains shown)."
  - "**Contested details are left out or hedged:** how far the coffin was moved (NPS: pulled out; Illinois Times: could not be lifted), who fired the pistol (Pinkerton agent or another officer), the day of the arrests (about ten days later per NPS and the Secret Service, 'days' elsewhere), and Kinealy's fate."
  - "Suggested first comment: Lincoln was never actually taken out of Oak Ridge Cemetery; the thieves only got as far as the sarcophagus. Whether grave robbery was a crime in Illinois in 1876 is disputed, so the thieves were charged with conspiracy and attempted larceny (Illinois Times)."

