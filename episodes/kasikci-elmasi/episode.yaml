# Kaşıkçı Elması'nın çöplükten saraya uzanan efsanesi (İstanbul, 1679). Araştırma notu: scratchpad olgular.md
# (repoya girmez). Altın dönem kalıbı: C2Fr (diyalog -> kart -> diyalog -> kanıt) + C4V3/C12O yüz varyantı.
# AYNI YER: Eğrikapı (İstanbul surları), 17. yüzyıl sonu.
#   A (hep solda): çöplükte taşı bulan adsız yoksul adam (bakış açısı karakteri; ters köşe yüzü onun). Kurgu.
#   B (hep sağda): adsız kaşıkçı (seyyar satıcı). Kurgu; kötü/sırıtan yüz yok, emin ve sakin.
# Olgu sınırları (anlatı EFSANE/RİVAYET; metinde "anlatılana göre"):
#   - Kaynak anlatı: Defterdar Sarı Mehmed Paşa, Zübde-i Vekayiât, 1090 (1679) olayları (Hürriyet/Topkapı açıklaması,
#     Milliyet-Sinan Genim, arkeolojikhaber, kozmikturk): Eğrikapı'daki çöplükte yuvarlak bir taş bulunur; bulan
#     kişi onu üç kaşık karşılığında bir kaşıkçıya (yaymacı) verir; kaşıkçı hırdavatının arasına bırakır; bir
#     kuyumcu 10 akçeye alır; meslektaşıyla pay kavgası; kuyumcubaşı birer kese akçe verip alır; sadrazam ister;
#     padişah IV. Mehmed hatt-ı hümayunla saraya aldırır; işlenince büyük bir elmas çıkar.
#   - S1 "cam gibi": Raşid'e atfedilen anlatıda bulan kişi taşı "cam zannetti" (Hürriyet 'Elmasların elması bulundu',
#     gelisenbeyin; aynı metnin kopyası, tek kök). Ekranda benzetme ("cam gibi"), olgu değil.
#   - S2 "üç tahta kaşık": Vikipedi (Reşad Ekrem Koçu aktarımı) ve gzt "üç tahta kaşık". "Fazlası etmez" canlandırma
#     (kaşıkçının taşı hırdavat arasına bırakması değer vermediğini gösterir).
#   - S3 canlandırma (yoksulluk; ironi).
#   - S4 "neden sarayda": taş sonunda padişahın emriyle saraya alındı (Hürriyet, Milliyet). Fark etme canlandırma.
#   - Kanıt 1: Topkapı Sarayı Hazine Dairesi (Fatih Köşkü), kamu malı. Kanıt 2 (son kare, NESNENİN KENDİSİ; kupür
#     değil): Kaşıkçı Elması, Topkapı, 2023, CC BY 4.0.
# Adın kökeni tartışmalı (kaşık biçimi de denir); Napolyon'un annesi rivayeti İrepoğlu'na göre kronolojik olarak
# tutmuyor; saraya girişine dair arşiv belgesi yok (Genim). Bunlar metinde açıkça yazılı.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/kasikci-elmasi
