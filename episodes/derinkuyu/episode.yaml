# Türkiye gizemi — "olay" formatı. Render: python -m wojak render episodes/derinkuyu
id: derinkuyu
title: "Evini tamir ederken duvarın arkasında bir şehir buldu"

# Kanalın imza müziği (tools/make_music.py ile üretildi, hakkı bize ait)
music: {file: imza_gece_vals.mp3, start: 0, volume: 0.7, fade_out: 0.3}

scenes:
  # 1) Dramatik ironi: sıradan bir tadilat cümlesi.
  - type: dialog
    duration: 2.6
    bg: img/derinkuyu_sokak.jpg
    focus: [0.75, 0.5]
    chars:
      - {img: koylu_kasketli_biyikli, side: right, height: 0.6, flip: true}
    text: "Şu duvarı yıkıp evi biraz genişleteyim"
    sfx: [{file: drone, volume: 0.4}]

  # 2) Keşif anı: karanlık + sarsıntı.
  - type: dialog
    duration: 2.5
    bg: img/karanlik_oda.jpg
    focus: [0.35, 0.5]
    chars:
      - {img: koylu_kasketli_biyikli, side: left, height: 0.6}
    text: "Duvarın arkasında... bir geçit var?!"
    shake: 9
    sfx: [{file: hit, volume: 0.8}]

  # 3) Ölçek: aşağı indikçe bitmeyen şehir.
  - type: dialog
    duration: 2.8
    bg: img/yeralti_oda_turuncu.jpg
    zoom: 1.08
    chars:
      - {img: muhendis_baretli, side: right, height: 0.58}
    text: "İndikçe bitmiyor... Burası koca bir şehir!"
    sfx: [{file: heartbeat, volume: 0.8, at: 0.3}]

  # 4-5) Gerçeklik vuruşu.
  - type: evidence
    duration: 1.7
    images: [img/gercek_kesit_haritasi.jpg]
    label: "Kapadokya yeraltı şehri kesiti"
    sfx: [{file: shutter, volume: 0.6}]

  - type: evidence
    duration: 1.7
    images: [img/gercek_tas_kapi.jpg]
    label: "Sadece içeriden kapanabilen taş kapı"
    sfx: [{file: shutter, volume: 0.6}]

  # 6) Cevapsız soru -> yorum.
  - type: dialog
    duration: 2.0
    bg: img/yeralti_oda_lamba.jpg
    darken: 0.45
    grayscale: true
    chars:
      - {img: muhendis_baretli, side: left, height: 0.58, flip: true}
    text: "Peki binlerce insan... neyden saklanıyordu?"
    sfx: [{file: boom, volume: 0.6}]

caption: |
  Derinkuyu Yeraltı Şehri — Nevşehir
  Hikâyenin tamamı sabit yorumda 👇
hashtags: [derinkuyu, kapadokya, nevşehir, gizem, tarih]

pinned_comment: |
  Derinkuyu Yeraltı Şehri, Nevşehir'in Derinkuyu ilçesinde bulunan ve Kapadokya'nın en büyük yeraltı şehirlerinden biridir.

  1963 yılında ilçede yaşayan bir adam, evinde tadilat yaparken yıktığı duvarın arkasında karanlık bir geçit buldu. Geçit takip edildiğinde ortaya, yerin onlarca metre altına katlar hâlinde inen devasa bir şehir çıktı.

  Yumuşak volkanik tüf kayaya oyulan şehirde ahırlar, şarap ve yağ işlikleri, mutfaklar, su kuyuları, bir kilise ve yüzeye kadar uzanan havalandırma bacaları var. Kaynaklara göre derinliği 60-85 metreyi buluyor; binlerce kişiyi (bazı tahminlere göre 20.000) hayvanlarıyla birlikte barındırabiliyordu.

  Katlar arasındaki geçitler, yüzlerce kilo ağırlığındaki yuvarlak taş kapılarla kapatılıyordu ve bu kapılar yalnızca içeriden açılıp kapanabiliyordu. Derinkuyu'nun yakındaki Kaymaklı yeraltı şehrine kilometrelerce uzunlukta tünellerle bağlı olduğu düşünülüyor.

  İlk oyukların M.Ö. 8.-7. yüzyıllarda Frigler tarafından açıldığı, şehrin asıl büyümesinin ise Bizans döneminde akınlardan korunmak isteyen yerel halk tarafından yapıldığı düşünülüyor. Şehir 1960'ların sonunda ziyarete açıldı ve bugün yalnızca bir kısmı gezilebiliyor.

  Sizce yerin altında aylarca yaşayan binlerce insan en çok neyden korkuyordu?

