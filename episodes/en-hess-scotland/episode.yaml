ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (a local farm worker and Hess); the dialogue is invented and is not a documented quote. Documented: Hess parachuted into the countryside near Eaglesham on 10 May 1941, asked for the Duke of Hamilton (the exact wording of his message differs between sources), and was the only prisoner in Spandau from 1 October 1966 (25 years after the flight; the other prisoners had been released) until his death on 17 August 1987. In reality Hess first gave the false name 'Hauptmann Alfred Horn' and the Duke met him the next day; 'Fine, but who are you?' is a dramatization of that moment."
  - "**Left out on purpose:** the 'pitchfork' (the ploughman's own 1941 account says hayfork; later retellings say pitchfork), the ploughman's name, any quote of Hitler calling Hess mad, the text of Hess's letter to Hitler, whether Hitler knew in advance (disputed), the aircraft sub-variant, which museum holds which engine, and the theory that Hess was murdered (the 1989 UK investigation found no support)."
  - "Evidence 1 is the IWM press photograph H 9553 (1941, PD-UKGov), a British officer standing by the wreck of the Bf 110; enlarged about 1.35x and trimmed top and bottom. Evidence 2 (last frame) is the entrance of Spandau Prison in the 1980s (CC BY-SA 3.0), enlarged about 1.4x. Background 1: Bonnyton Moor near Eaglesham, Scotland, the area where the aircraft came down (2016 photo; one grazing sheep was retouched out). Background 2 (after the card): a guard tower of Spandau Prison, 1980s (CC BY-SA 3.0)."
  - "Suggested first comment: 'He was not the only prisoner for 46 years, only from 1966.' Answer: yes, the video says 25 years later (1966); Spandau held seven prisoners at first and Hess was alone from 1 October 1966 until his death on 17 August 1987."

