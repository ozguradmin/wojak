# bodrum-mozole-1522 lahit/mezar; aynı alt tür değil).
# İskelet C2fa (dramatik ironi): A Cehennem'in tehlikesini söyler -> B efsaneyi ekler -> A "Cennet'in dibinde bakılacak
# bir şey yok" diye geçiştirir -> B aynı kutuda şok yüzüyle aşağıdaki kiliseyi fark eder -> 2 kanıt (Cehennem; son kare kilise).
# AYNI YER, AYNI AN: Cennet obruğunun kenarı. A (hep solda): adsız köylü (kurgu). B (hep sağda): adsız yaşlı köylü
# (kurgu). Gerçek kimseyi temsil etmezler.
# Olgu sınırları (olgular.md):
#   - Cehennem: içbükey kenarlar, "inilemez" (Silifke Kaymakamlığı, AA, Bakanlık). "Kimse inemez" DENMEZ: ipli iniş
#     teorik olarak anılıyor. S1: "dibine inilmiyor".
#   - Zeus-Tayfon: Bakanlık/Kaymakamlık anlatısı (Zeus Tayfon'u Etna'ya kapatmadan önce burada tuttu); antik bağ
#     Kilikya mağarası. S2 "derler" ile efsane olarak.
#   - Kilise: Cennet obruğunun tabanında, mağara ağzında; kapısındaki yazıta göre 5. yy'da Paulus adlı biri Meryem
#     Ana için yaptırmış (KaymSil, muze.gov.tr, Şahin 2024). Sayılar: Cennet ~70 m, Cehennem 128 m, ~450 basamak.
# Karakterler: chars/uret.py. Görseller: gorsel.py.
