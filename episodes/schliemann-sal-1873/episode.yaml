# Priamos Hazinesi ve "şal" (1873): Heinrich Schliemann, Mayıs 1873 sonunda Hisarlık'ta (Truva, Çanakkale) bulduğu
# hazineyi, Troy and Its Remains'te yazdığına göre işçileri "paydos" diye dinlenmeye yollayıp eşi Sophia'nın şalına sararak
# taşıdı. Sophia ise mayıs başında babasının vefatı üzerine Atina'ya dönmüştü; Schliemann 27 Aralık 1873'te Charles
# Newton'a yazdığı özel mektupta bunu kabul etti (Fitton 2012).
# Ters köşe (A-B-A-B soru-cevap): kazıda çalışmış işçi (B) şal hikâyesini duyunca aynı kutuda yüz varyantıyla "Sophia Hanım
# o gün Atina'da değil miydi?" diye sorar. Kanıt: Troy and Its Remains Levha II (hazine rafta), sonra Sophia'nın hazineden
# takılarla fotoğrafı (son kare; "karısı" ve "şal" tohumunun karşılığı; döngüde ilk replikteki "hazine"ye bağlanır).
# AYNI YER, AYNI AN: 1874, Truva harabeleri (kazı 17 Haziran 1873'te bitti; kitap 1874'te çıktı).
#   A (hep solda): fesli kasabalı (kurgu). B (hep sağda): kazıda çalışmış köylü işçi (kurgu). Gerçek kişiye replik yok.
#   "Şliman": Osmanlı belgelerinde ad "Şiliman" diye geçer; replikte halk ağzı.
# Olgu sınırları: buluş günü tartışmalı (31 Mayıs yaygın) -> "Mayıs 1873'ün sonunda". Tazminat tutarı çelişkili -> yok.
# Ortaya çıkış 1991/1993/1994 -> "1990'lı yıllarda". Fotoğrafın yılı 1873-1877 arası (yer tek kaynakta) -> "1873-1877 arasında".
# Son 5 bölümün son karesi: oda fotoğrafı (Pera Palas), gazete sayfası (Goeben), arşiv fotoğrafı (Karaköy), tablo (Orban),
# kitap sayfası (Yerebatan) -> bu bölümde son kare arşiv portresi (kişi + nesne), ilk kanıt kitap levhası (gravür).
# Karakterler: hazır PNG'ler önceki bölümlerden kopyalandı (bakış kayıtları aynı sha1 ile var):
#   chars/esnaf_sakin.png = karakoy-tunel-1874/chars/esnaf_sakin.png (HF clayshoaf/Wojaks 5_Doomer/13970, gözyaşı silinmiş)
#   chars/isci_sakin.png, isci_sok.png = kasikci-elmasi/chars/bulan_sakin.png, bulan_sok.png (wojakland "Peasant Wojak");
#   isci_sok'ta göz bebekleri 6 px bakış yönüne kaydırıldı (öne bakıyordu), yon yeniden kaydedildi
# Görseller: gorsel.py. Araştırma notları: scratchpad (repoya girmez).
