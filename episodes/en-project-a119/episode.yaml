  - "**Dramatization:** the two characters are fictional roles (a senior US officer and a scientist; the officer's white uniform is a ready-made US Navy-style wojak, not an Air Force one); the dialogue is invented and is not a documented quote. Documented: the 1958-59 Air Force study, the Armour Research Foundation team, C. E. Sagan on the contributor list, the 2000 disclosure."
  - "**Left out on purpose:** the weapon yield (1.7 kt vs 'Hiroshima-sized' conflict), why and exactly when it was cancelled (the leader said he never knew; January 1959 is the common date, the report is dated June 1959), Sagan's age, the leader's name (he died in 2017), Soviet E-4 details. 'Grad student' is how sources describe Sagan then; the video does not claim he designed the project, only that he worked on the dust-cloud math (per the leader and Wikipedia)."
  - "The final frame shows the contributor list on the real report's title page; other names on it are 1959 researchers and are not discussed. It is a public-domain US Air Force report (Commons {{PD-USGov-Military-Air Force}})."
  - "Suggested first comment: 'There's no mushroom cloud on the Moon, there's no air.' Answer: correct, the leader himself said the dust would spread in all directions instead (AP, 2000); and no bomb was ever launched."

