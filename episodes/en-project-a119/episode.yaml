pinned_comment: |
  Project A119 was a classified United States Air Force study, begun in 1958, into what a nuclear explosion on the Moon would look like from Earth. The Air Force asked a physicist at the Armour Research Foundation in Chicago to examine the idea quickly, and his team included a young graduate student named Carl Sagan, who worked on how a cloud of dust would spread in the Moon's weak gravity.

  The surviving report, "A Study of Lunar Research Flights, Vol. I", is dated 19 June 1959. It lists scientific, military and political motives, and warns that public reaction could be strongly negative unless world opinion were prepared in advance. The project's leader later described the aim as a public-relations show of American strength, a response to the shock of Sputnik.

  The study was reportedly dropped in 1959, and its reasons were never fully documented. It stayed largely unknown until a 1999 biography of Sagan revealed that his 1959 fellowship application mentioned classified work. In 2000 the project's leader confirmed it in a letter to the journal Nature. No warhead ever went to the Moon. The Soviet Union reportedly drafted a similar plan of its own, called E-4, which was also dropped.

  The first frame of evidence is the cover of the real report, with the emblem of the Air Force Special Weapons Center; the final frame is its title page, which lists the contributors, including C. E. Sagan. The dialogue is imagined, and the background is a daytime photo of the Moon. Would you have wanted to watch that flash?

credits: "Daytime moon over London, England (2019), Acabashi, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), https://commons.wikimedia.org/wiki/File:Daytime_moon_over_London,_England.jpg (cropped, resized, colour reduced, slightly darkened, softened); A Study of Lunar Research Flights, Vol. I (19 June 1959), Armour Research Foundation / US Air Force Special Weapons Center, DTIC AD0425380, public domain, via Wikimedia Commons (two crops of the cover and the title page, paper tone and margins added)."

