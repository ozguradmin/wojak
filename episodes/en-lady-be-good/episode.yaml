hashtags: [history, worldwarii, mystery]

pinned_comment: |
  In April 1943, a B-24D Liberator bomber of the US Army Air Forces, nicknamed Lady Be Good, disappeared on its first combat mission, a raid on Naples. A sandstorm forced many bombers back to base, but this one pressed on into the night.

  Investigators concluded that the nine-man crew probably believed they were still over the Mediterranean. The bomber overflew its base and flew about two hours south until its fuel ran critically low. Around 2 a.m. on 5 April, the crew bailed out, and the empty aircraft flew on about 16 miles before belly-landing in the Libyan desert.

  Eight men walked northwest together for roughly 80 miles, and three of them went farther. None of the nine survived.

  In 1958, a British oil-exploration team working for D'Arcy Exploration (later part of BP) spotted the wreck from the air, about 400 to 440 miles inland. The aircraft was almost intact. Remains were recovered in 1960; one airman was never found.

  The dialogue in the video is dramatized: the wojak characters are fictional and do not represent any named crew member.

  Would you have walked toward home, or stayed with the plane?

