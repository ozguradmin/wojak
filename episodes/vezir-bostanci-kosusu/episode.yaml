pinned_comment: |
  Bostancıbaşı koşusu, Osmanlı'da idama mahkûm edilen sadrazamın canı için sarayın baş bahçıvanıyla yarıştığı anlatılan bir uygulamadır. Bostancıbaşı, Topkapı Sarayı'nın bahçelerinden ve sahil güvenliğinden, idam hükümlerinin yerine getirilmesinden de sorumlu görevliydi.

  1793 tarihli bir Fransız saray planının açıklamasına göre ölüme mahkûm edilecek vezirler Orta Kapı'nın iki kulesi arasındaki odada tutuklanırdı. Anlatılana göre sadrazam buradan sarayın bahçelerini geçip deniz surlarındaki Balıkhane Kapısı'na koşardı. Bostancıbaşından önce varırsa cezası sürgüne çevrilir, geç kalırsa hüküm hemen uygulanırdı. Bu koşuyu Barnette Miller, Osmanlı tarihçisi Abdurrahman Şeref Efendi'nin bir makalesine dayanarak anlattı; N. M. Penzer'in The Harem'i (1936) ve Smithsonian Magazine onu aktarır. Geleneğin kökeni bilinmiyor. İncelediğimiz Türkçe kaynaklarda ise koşu değil, "Balıkhane'ye indirilmek" geçer: azledilen sadrazam Balıkhane'de padişahın kararını beklerdi.

  Bu anlatılar Hacı Salih Paşa'yı koşuyu kazanan son sadrazam diye sunar. Türkçe kaynaklara göre paşanın mührü 10 Kasım 1822'de alındı; Balıkhane'de korku dolu birkaç saat geçirdikten sonra Gelibolu'ya sürgün edildi. Ardından Anadolu ve Şam valisi oldu, 1828'de öldü.

  Videodaki karakterler anonimdir. Son karede Kauffer ve Lechevalier'nin 1786 İstanbul haritasından Topkapı görülüyor: Orta Kapou ve deniz surlarındaki İncili Köşk (Indgiouli Keuchk).

  Sizce bu koşu gerçekten yapıldı mı, yoksa "Balıkhane'ye indirilmek" zamanla yarışa mı dönüştü?

