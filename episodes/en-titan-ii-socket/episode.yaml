pinned_comment: |
  The 1980 Damascus Titan II explosion was a nuclear weapons accident at Launch Complex 374-7, a missile silo in Van Buren County, Arkansas. On the evening of 18 September 1980, around 6:30 p.m., a maintenance crew was servicing the Titan II, a liquid-fueled intercontinental missile. A heavy socket slipped off a wrench, fell down the silo, struck the missile and punctured the first-stage fuel tank.

  Fuel began to leak. The site and nearby homes were evacuated while crews tried to assess the leak. Around 3 a.m. on 19 September, about eight and a half hours after the leak began, the missile exploded. The blast threw the silo's massive closure door into the air and ejected the W53 warhead, which had a yield of about nine megatons. The warhead landed a short distance from the silo and did not detonate, and no radioactive material was released.

  One airman did not survive and 21 other people were injured. The Air Force called the cause human error. The site was never rebuilt, and the Titan II program was retired by 1987.

  The background and the missile photo show other Titan II sites, not Damascus. The final frame is the Arkansas historical marker for the site, installed in 2026.

  The dialogue in the video is imagined. Should a single dropped tool ever be able to do this?

credits: "Titan II missile silo, Mark Clagg, 1987, public domain (U.S. Air Force / DoD), Wikimedia Commons (https://commons.wikimedia.org/wiki/File:Titan_II_missile_silo.JPEG; cropped, color and brightness reduced, blurred); Titan Missile Museum-NRIS-92001234-Green Valley Arizona1, Packbj, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), Wikimedia Commons (https://commons.wikimedia.org/wiki/File:Titan_Missile_Museum-NRIS-92001234-Green_Valley_Arizona1.jpg; cropped); Titan II Missile Complex 374-7 Explosion historical marker, photo by Staff Sgt. Justin Todd, U.S. Air Force, 18 September 2026, public domain, DVIDS (https://www.dvidshub.net/image/9948943; cropped, enlarged)."

