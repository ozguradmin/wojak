# Kanuni Sultan Süleyman'ın gizlenen ölümü (Zigetvar, 1566). Araştırma notu: scratchpad olgular.md (repoya girmez).
# Altın dönem kalıbı: C2Fr (diyalog -> kart -> diyalog -> kanıt) + C4V3/C12O yüz varyantı. AYNI YER: Zigetvar
# önündeki Osmanlı ordugâhı, Eylül-Ekim 1566.
#   A (hep solda): adsız bir yeniçeri (bakış açısı karakteri; ters köşe yüzü onun). Kurgu karakter.
#   B (hep sağda): sadrazam (Sokullu Mehmed Paşa'ya karşılık gelir; videoda ad yok). Kötü/sırıtan yüz yok: ciddi,
#      sakin. Replikleri belgeli tutumuna dayanır: ölümü gizledi, askere padişahın hasta olduğu söylendi.
# Olgu sınırları:
#   - S1 "kale düştü": padişah 6/7 Eylül gecesi öldü, kale hemen ardından düştü (AA 2026, Vikipedi, Afyoncu/Sabah,
#     Sözcü). Müjde isteği canlandırma (askerin bilmediği belgeli: AA "yakın çevresi tarafından gizlendi").
#   - S2 "hasta, kimseyi kabul etmiyor": ölüm vezirlerden bile gizlendi; cuma günü padişahın rahatsızlığı arttığı
#     için namaza gelemeyeceği ilan edildi (ihya, Haber Kıbrıs, netyazı); dönüş yolunda "Hasta padişah arabasında
#     seyahat ediyor" dendi (İlber Ortaylı, Hürriyet 2016).
#   - Kart "Birkaç hafta sonra": ordu Selim'i beklemek için haftalarca Zigetvar çevresinde kaldı (Afyoncu/Sabah).
#   - S3 "arabasında, yola çıkıyoruz": İlber Ortaylı (Hürriyet): "Hasta padişah arabasında seyahat ediyor" dendi.
#   - S4 "neden hiç konuşmuyor": canlandırma; padişahın ağzından fermanları yazısı ona benzeyen Silahdar Cafer
#     Ağa yazdı (ihya, Haber Kıbrıs, Gündem Arşivi; Yeni Şafak "Hatt-ı Hümayunlar bile yazdırıldı").
#     Arabada padişaha benzeyen bir hizmetkâr / naaşın oturtulması tartışmalı: metinde "anlatılana göre".
#   - Kanıt 1: Seyyid Lokman, Tarih-i Sultan Süleyman (CBL T 413): naaşı taşıyan araba, sarığı içinde. Kamu malı.
#   - Kanıt 2 (son kare, ARŞİV MİNYATÜRÜ; kupür değil): Nüzhet-i Esrârü'l-Ahyâr (Topkapı H.1339, 107b): naaş
#     Belgrad'a varır, II. Selim siyah kaftanla arabanın önünde dua eder. Kamu malı.
# Gün sayısı kaynaklarda 42-48 (Afyoncu 42, Vikipedi/Smithsonian 48): ekranda sayı yok, metinde aralık.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/kanuni-gizlenen-olum
id: kanuni-gizlenen-olum
title: "Zigetvar'da padişahın çadırında haftalarca saklanan sır"

