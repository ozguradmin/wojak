# hannibal-gebze-yedi-kapi — Kartacalı komutan Hannibal'in Bitinya'da, Libyssa'daki (bugünkü Gebze çevresi) evinin
# askerlerce sarılması ve ölümü (MÖ ~183). 2. damar: Türkiye'de gösterilebilir yerde tuhaf ölüm / kader ironisi;
# dönüş: "Fillerle Alpleri aşan Hannibal, Gebze yakınlarında Roma'ya teslim edilmemek için zehir içti; anıt mezarı Gebze'de."
# İskelet: A (hizmetkâr) kanca -> B (Hannibal) Livius 39.51'deki son sözüne dayanan cevap (tohum: "bir ihtiyarın ölümü")
# -> A kimliği ekler (filler, Alpler) -> kart "Bir süre sonra" -> A aynı kutuda şok yüzü, sessizliği fark eder -> 2 kanıt:
# Gebze'deki sembolik anıt mezar (nerede), son kare Livius 39.51'in 1929 öncesi İngilizce çevirisinden KİTAP SAYFASI
# ("an old man's death": S2'deki tohumun karşılığı). Son 5 son kare: Harem girişi+levha (mekân), Prokopios sayfası,
# manna şişecikleri (müze nesnesi), kilise (mekân), Newton sayfası -> bir öncekiyle aynı tür değil.
# Video zehri ya da ölümü GÖSTERMEZ; hikâye metni düz anlatır.
# Olgular: /tmp/arastirma/olgular.md özeti -> sources. Karakterler: chars/uret.py. Görseller: gorsel.py.
