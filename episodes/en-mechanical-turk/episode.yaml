pinned_comment: |
  The Mechanical Turk was a chess-playing "automaton" shown from 1770, built by the inventor Wolfgang von Kempelen for Empress Maria Theresa's court in Vienna. It was a wooden figure in Ottoman robes and a turban, seated behind a large cabinet, and it moved the pieces with its own arm.

  Before each game, the showman opened the cabinet doors one by one and held a candle inside, so the audience saw only machinery. From 1770 to 1854 it was exhibited in Europe and America. It reportedly played Benjamin Franklin, and in 1809 Napoleon reportedly played it, tried illegal moves and lost. There is no firm record of those games, and accounts disagree.

  The secret was a person. A skilled chess player sat inside the cabinet on a sliding seat, while dummy machinery slid across to hide him. He followed the game with the help of magnets under the pieces and moved the arm with levers. Operators included Jacques Mouret and William Schlumberger.

  In 1827 two teenagers in Baltimore reportedly saw an operator climb out. The full explanation came in 1857, three years after a fire in Philadelphia destroyed the machine. The final frame is Joseph Racknitz's 1789 reconstruction of what was inside; he got some details wrong.

  Dramatized: the wojak characters and all dialogue are invented. The Turk, its operators and the dates are sourced.

  If the cabinet had opened for you, would you have believed it?

