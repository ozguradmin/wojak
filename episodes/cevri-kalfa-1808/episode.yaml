pinned_comment: |
  Cevri Kalfa'nın Şehzade Mahmud'u kurtarışı, 28 Temmuz 1808'de İstanbul'da Topkapı Sarayı'nda yaşanan ve bir saray kalfasının cellatların gözüne kül serpmesiyle bilinen bir olaydır.

  1807'deki isyanla tahttan indirilen III. Selim sarayda tutuluyor, tahtta IV. Mustafa oturuyordu. Alemdar Mustafa Paşa, Selim'i yeniden tahta çıkarmak için saraya yürüdü. IV. Mustafa, amcazadesi Selim'in ve kardeşi Şehzade Mahmud'un öldürülmesini emretti. III. Selim sarayda öldürüldü.

  Sıra Mahmud'a geldiğinde saray cariyelerinden Cevri Kalfa, merdivenden çıkmaya çalışan cellatların gözlerine kül serpti; şehzade birkaç taraftarının yardımıyla kaçırıldı. Aynı gün 23 yaşındaki Mahmud, II. Mahmud olarak padişah ilan edildi. IV. Mustafa Kasım 1808'de öldürüldü; Mahmud hanedanın tek erkeği kaldı. Sonraki altı padişahın hepsi onun soyundan geldi.

  II. Mahmud, Cevri Kalfa'yı Harem'in hazinedarbaşısı (hazinedar usta) yaptı; kaynaklar bu görevi haremin en yüksek makamlarından biri olarak anar. Kalfanın ölümünden sonra, 1819-20'de Divanyolu'nda onun adına bir sıbyan mektebi yaptırdı. Cevri Kalfa'nın, Mahmud'un annesi Nakşidil Sultan'ın türbesinde yattığı kabul edilir.

  Diyaloglar canlandırmadır; arka planda Harem'deki Hünkâr Sofası, ardından II. Mahmud'un 1839 portresi görülüyor. Son kare canlandırmadır; söz Türkiye, 10 Temmuz 2026 başlığından. Başlık ve cümle Ahmet Demirbaş'ın köşe yazısından birebir alındı. Yazıdaki "hanedanı kurtaran" ve "vezir rütbesine eşit" ifadeleri yazarın yorumudur; o gün IV. Mustafa da hayattaydı.

  Sizce bir avuç kül olmasa Osmanlı tarihi nasıl yazılırdı?

