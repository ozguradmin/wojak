# Orban'ın topu (1452-1453): Macar top ustası Orban (Urban) dev bir top dökmeyi önce Bizans İmparatoru XI. Konstantinos'a
# teklif eder; Bizans hazinesi ustanın istediği ücreti ödeyemez. Orban, şehri kuşatmaya hazırlanan II. Mehmed'e gider; top
# Edirne'de dökülür ve 1453 kuşatmasında surları döver. Ters köşe (dramatik ironi): imparatorun parası yetmediği için geri
# çevirdiği "dev top" birkaç ay sonra surların karşısındadır.
# Araştırma notu: scratchpad olgular.md (repoya girmez). Kalıp: C2fa iskeleti (A niyet -> B ret -> A karar -> kart -> B aynı
# kutuda yüz varyantıyla fark etme sorusu); cevabı iki kanıt sessizce verir. Kelime tohumu: S1 "dev bir top" -> S4 "o dev top".
# AYNI YER, AYNI AN: 1452, Konstantinopolis, Blakhernai sarayı (bugünkü Tekfur Sarayı, kara surlarının bitişiği).
#   A (hep solda): Orban, top ustası (ölümü 1453). B (hep sağda): XI. Konstantinos Palaiologos, son Bizans imparatoru (öl. 1453).
#   Konstantinos sevecen/üzgün yüzle çizilir (kanalda sırıtma kötü karakter demek); kaynaklara göre ustayı istiyordu ama
#   ödeyemedi. Replikler canlandırma; gerçek kişilere tırnaklı söz yazılmaz.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak):
#   - 1452'de Bizans'a hizmet teklif etti; imparator istediği yüksek ücreti karşılayamadı, malzeme de yoktu (EN/TR Vikipedi,
#     Halkokondilis alıntısı Ancient Origins'te, Daily News Hungary, Dünya gazetesi "yoksul Bizans").
#   - II. Mehmed'e gitti; "Babil surlarını bile" toz edeceğini söyledi (Dukas; Vikipedi, camrea/Ancient Origins).
#   - Top yaklaşık üç ayda Edirne'de döküldü, öküzlerle getirildi (Dukas; Vikipedi 'Orbán', 'Basilic').
#   - Büyük top Aya Romanos kapısının karşısına kuruldu; kapı fetihten sonra "Top Kapısı" diye anıldı (AA/haberler.com,
#     NTV, istanpolis, Yeditepe Fatih).
#   - Orban'ın ölümü "anlatılana göre" (Vikipedi "is said to have died"). Şahiyi kimin döktüğü tartışmalı (TR Vikipedi:
#     bazı kaynaklarda Saruca) -> metinde açıkça "tartışılır".
#   - Kanıt 1: Fatih dönemine ait tunç top, İstanbul Askerî Müze (müze levhası: "Fatih Sultan Mehmet dönemi 1451-1481");
#     Orban'ın topu değil, günümüze ulaşmadı -> metinde böyle yazıldı. Kanıt 2 (son kare, TABLO): Fausto Zonaro, 1903,
#     "Mehmed II conquering Constantinople" (Dolmabahçe Sarayı; kamu malı): dev top öküzlerle şehre çekiliyor.
#     Son 5 bölümün son karesi: kitap sayfası (Yerebatan), arşiv fotoğrafı (Tahran), müze nesnesi (Midas), pul (Hezarfen),
#     müze nesnesi (Kaşıkçı) -> tablo yeni tür.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/orban-topu-bizans
id: orban-topu-bizans
