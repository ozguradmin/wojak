pinned_comment: |
  Sokullu Mehmed Paşa suikastı, 1579 yılında İstanbul'da Osmanlı sadrazamının kendi konağındaki ikindi divanında bir saldırgan tarafından öldürülmesi olarak bilinen bir olaydır.

  Sokullu, Kanuni, II. Selim ve III. Murad dönemlerinde yaklaşık on dört yıl sadrazamlık yapmıştı; Kanuni'nin Zigetvar'daki ölümünü haftalarca ordudan gizleyen de oydu. III. Murad döneminde ise nüfuzu giderek azalmıştı.

  Tarihçi Peçevî'nin, paşanın hazinedarı Hasan Ağa'dan naklettiğine göre paşa her gece ona Osmanlı tarihi okuturdu. Anlatılana göre olaydan bir gece önce I. Murad'ın 1389'da Kosova'daki şehadetini okutmuş, gözleri dolmuş ve kendisine de böyle bir şehadet nasip olması için dua etmişti.

  Ertesi gün, ikindi divanında, derviş kılıklı bir adam dilekçe verecekmiş gibi yaklaşıp hançerle saldırdı. Peçevî'ye göre bu adam paşadan âdeti üzere harçlık almaya gelirdi; paşa ona para vermek için elini cebine atmıştı. Sokullu o akşam öldü ve Eyüp'te Mimar Sinan'ın yaptığı türbeye defnedildi. Saldırganın kimliği ve arkasında kimin olduğu bugün de tartışılır; kesin bir kanıt yoktur.

  Kaynaklara göre I. Murad da Kosova'da, bir isteği varmış gibi yaklaşan biri tarafından hançerlenmişti. Aradan yaklaşık 190 yıl geçmişti. Videonun son karesi, Ahmedî'nin İskendernâme'sinin 15. yüzyıl sonuna ait bir nüshasındaki minyatürdür; Commons açıklamasında I. Murad'a yapılan suikast sahnesi olarak tanımlanır.

  Sence bu bir tesadüf mü, yoksa sonradan eklenmiş bir rivayet mi?

