# Sokullu Mehmed Paşa'nın son gecesi (İstanbul, 1579). Araştırma notu: /tmp/arastirma/olgular.md (repoya girmez).
# Altın dönem kalıbı C2fa (dramatik ironi): A masum/ironik niyet -> B -> A tohum -> kart -> B aynı kutuda yüz değişir -> 2 kanıt.
# AYNI YER: sadrazamın konağı, bir gece önce; S5 ertesi gün ikindi divanı (karttan sonra, aynı mekân).
#   A (hep solda): sadrazam (Sokullu Mehmed Paşa'ya karşılık gelir; kanuni-gizlenen-olum'daki sadrazamın kendisi,
#      13 yıl sonra kırçıl sakallı). Videoda ad yok; ciddi/sakin yüz.
#   B (hep sağda): paşanın adamlarından biri (kurgu; anlatıda Kosova'yı okuyan hazinedar Hasan Ağa'dır, onu temsil etmez).
#      Çizim: hezarfen-galata-ucusu'ndaki sarıklı adam ve şok varyantı (paşayla aynı kalın kontur ailesi; görsel hakem tur 1 MUST).
# Olgu sınırları (olgular.md):
#   - S1: rivayet (Peçevî, hazinedar Hasan Ağa'dan naklen; Gökbilgin İA c.7 s.605, Zararsız 2021 s.332, TDV "bazı
#     kaynaklarda"): öleceğinden bir gece önce I. Murad'ın Kosova'daki şehadetini okuttu, ağladı, kendisine de böyle bir
#     şehadet nasip olmasını diledi. Peçevî'nin birebir lafzı bulunamadı: replik canlandırmadır, tırnaklı alıntı değil.
#     "Kosova'da Murad Han" S1'de III. Murad (o günün padişahı) ile karışmasın diye.
#   - S3 tohum "dilekçe": saldırgan arzuhal verecekmiş gibi yaklaştı (TDV, Gökbilgin/İA, Selânikî).
#   - Kart "Ertesi gün": "bir gece evvel" (İA), "ertesi gün ikindi divanında" (Zararsız, Şimşirgil).
#   - S5: canlandırma; saldırı gösterilmez. Saldırgan arzuhal verecekmiş gibi yaklaşıp koynundan hançer çıkardı (TDV, İA). Cevabı son kare verir: I. Murad da isteği varmış gibi
#     yaklaşan biri tarafından hançerlendi (TDV "Kosova Savaşları"; Âşıkpaşazâde "üzengisini öper gibi").
#   - Gün (30 Eylül / 11 Ekim / 12 Ekim) kaynaklarda ayrışıyor: ekranda tarih yok, metinde yalnız 1579.
# Karakterler: chars/uret.py. Görseller: gorsel.py.
