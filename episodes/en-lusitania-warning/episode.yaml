pinned_comment: |
  The RMS Lusitania was a Cunard ocean liner that was torpedoed off the Irish coast on 7 May 1915.

  On Saturday, 1 May 1915, The New York Times printed Cunard's sailing advertisement for the ship: "Fastest and Largest Steamer now in Atlantic Service Sails SATURDAY, MAY 1, 10 A.M." On the same page ran a boxed notice from the Imperial German Embassy in Washington. It began: "TRAVELLERS intending to embark on the Atlantic voyage are reminded that a state of war exists between Germany and her allies and Great Britain and her allies." It went on: "vessels flying the flag of Great Britain, or any of her allies, are liable to destruction in those waters and that travellers sailing in the war zone on ships of Great Britain or her allies do so at their own risk." The notice was dated April 22, 1915.

  The embassy's notice reached the New York papers the night before she sailed. The Lusitania left that day with roughly 1,950 people aboard, passengers and crew.

  On 7 May, a German U-boat torpedoed her off southern Ireland. She sank within about 20 minutes. About 1,200 people did not survive, including more than 120 Americans. Germany said the ship carried war cargo. Britain denied that at the time. Later accounts put about 173 tons of munitions aboard.

  Dramatized: the wojak dialogue is invented. The dates, figures and quoted wording are sourced.

  Would you have booked that crossing?

