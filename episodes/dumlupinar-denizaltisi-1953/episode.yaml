# dumlupinar-denizaltisi-1953 — TCG Dumlupınar faciası (4 Nisan 1953, Çanakkale Boğazı, Nara Burnu).
# Naboland şilebiyle çarpışan denizaltı battı; kıç torpido dairesinde 22 denizci sağ kaldı, imdat şamandırasındaki
# telefonla yüzeyle konuştu (DANFS, Atabay, Dibace, Karakaş/Boğaz Gazetesi). Kurtaran gemisi ~10 saat sonra geldi; akıntı
# ve ~90 m derinlik; şamandıranın telefon kablosu koptu, bağlantı bir daha kurulamadı. Milli Savunma Vekâleti 7 numaralı
# tebliği ("Ankara 5"; Milliyet 6.4.1953 "Şehitlerimizin isimleri"): "... kurtarılmasından tamamen ümit kesilmiştir."
# 81 denizci şehit oldu; enkaz hâlâ dipte.
# İskelet A-B-A-B: A (er, sol) kanca → B (astsubay, sağ) 22 kişi → A telefon/kurtarma gemisi umudu → kart → B aynı kutuda
# şok yüz: "telefon neden sustu?" → kanıt: denizaltının kendisi (USS Blower 1944), son kare: Milliyet 6.4.1953 kupürü.
# Karakterler kurgu; gerçek kişilere (telefondaki astsubay, gümrük motorundaki çarkçı) söz atfedilmez. "Vatan sağ olsun",
# sigara anonsu ve türkü bilerek yok (araştırma: "son söz" anlatısını haberi yazan gazeteci sonradan yalanladı).

