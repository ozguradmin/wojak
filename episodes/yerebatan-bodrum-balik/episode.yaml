# Yerebatan Sarnıcı'nın yeniden keşfi (1544-1547): Fransız bilgin Petrus Gyllius (Pierre Gilles), Ayasofya çevresindeki
# evlerin bodrumlarındaki kuyulardan su çekip balık tutulduğunu duyar, bir evden aşağı iner; ev sahibi meşale yakıp onu
# küçük bir kayıkla sütunların arasında dolaştırırken balık zıpkınlamakla meşguldür. Gyllius kitabında "Halkın bundan en
# ufak bir şüphesi yoktu" diye yazar. Ters köşe: mahallenin "kuyu" dediği şey 336 sütunlu imparatorluk sarnıcı, halkın
# deyişiyle "Yerebatan Sarayı".
# Araştırma notu: scratchpad olgular.md (repoya girmez). Altın dönem kalıbı: A B A B soru-cevap (C3iX, Kız Kulesi ritmi),
# kartsız; son replik fark etme sorusu ("Bekle, ... saray mı var?") yüz varyantıyla; cevabı iki kanıt sessizce verir.
# AYNI YER, AYNI AN: 1540'larda İstanbul, Ayasofya yakınındaki bir evin bodrumundan inilen sarnıç, meşale ışığı.
#   A (hep solda): ev sahibi. Gyllius'un kitabında adı yok ("the Master of the House"); kurgu karakter, ad yok.
#   B (hep sağda): Petrus Gyllius (1490-1555), Fransız bilgin; I. François'nın elyazması toplamak için gönderdiği heyetle
#     1544-1547 arasında İstanbul'da.
# Olgu sınırları (her biri en az 2 kaynak; sources'a bak):
#   - Halk evlerin zeminindeki kuyu deliklerinden kova sarkıtıp su çekiyor, hatta balık tutuyordu (Gyllius 1729 s. 147;
#     NTV; Habertürk; İBB/istanbulburda; Harvard 'Urban Imagination'; basilicacisternmuseum.org).
#   - "The People had not the least Suspicion of it, although they daily drew their Water out of the Wells" (Gyllius, çev.
#     Ball 1729, s. 147; aynı metin Gutenberg #53083). Ev sahibi meşale yaktı, kayıkla sütunların arasında dolaştırdı,
#     balık tutmaya dalmıştı, birkaçını meşale ışığında zıpkınladı (aynı sayfa) -> S1 "bodrumda balık", S3 "kuyunun dibi işte".
#   - Sarnıç I. Justinianus döneminde (527-565; çoğu kaynakta 532 sonrası / 542) yapıldı; 336 sütun (NTV, İBB, Wikipedia).
#     Boyut kaynaklarda 140x70 / 138x65 m -> metinde ortak değer ~9.800 m2. Halk arasında "Yerebatan Sarayı" (NTV, İBB/istanbulburda, tamsanat).
#   - Gyllius'un milliyeti: Fransız, Albi doğumlu (Wikipedia, travelogues.gr, Gutenberg önsözü, Italica Press). Bazı Türk
#     kaynakları "Hollandalı" diyor (yanlış) -> metinde "Fransız bilgin".
#   - Medusa başları kuzeybatı köşede iki sütunun kaidesi; biri ters, biri yan (NTV, İBB, Türkiye gazetesi: devşirme malzeme).
#     Gyllius'un Medusa'ları gördüğü iddia edilmez.
#   - Replikler canlandırma; Gyllius'a uydurma tırnaklı söz yok. ek_maddeler'de açıkça yazıldı.
#   - Kanıt 1: ters Medusa başı (Dennis G. Jarvis, CC BY-SA 2.0). Kanıt 2 (son kare, KİTAP SAYFASI): Gyllius'un kitabının
#     1729 İngilizce çevirisi, s. 147 (kamu malı; Internet Archive). Son 5 bölümün son karesi: arşiv fotoğrafı (Tahran),
#     müze nesnesi (Midas), pul (Hezarfen), müze nesnesi (Kaşıkçı), kupür (Göbeklitepe) -> kitap sayfası yeni tür.
# Karakterler: chars/uret.py. Görseller: gorsel.py. Render: python -m wojak render episodes/yerebatan-bodrum-balik
