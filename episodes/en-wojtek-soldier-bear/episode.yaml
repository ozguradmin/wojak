pinned_comment: |
  Wojtek was a Syrian brown bear who became the mascot of a Polish artillery supply company in the Second World War.

  Polish soldiers acquired the cub near Hamadan, Iran, in April 1942, and accounts differ on what they paid. The 22nd Artillery Supply Company (also called the 22nd Transport Company) received him in August 1942. Transport rules reportedly barred animals from the troopship, and the unit reportedly listed him on its books to get him aboard; a British Library account instead describes a special permit. The unit sailed from Alexandria on the MS Batory in February 1944.

  During the Battle of Monte Cassino in May 1944, veterans say Wojtek carried ammunition crates to the artillery positions, copying the men around him. Accounts differ on whether the crates were full or empty, and some accounts play the story down. The company later adopted an emblem showing a bear carrying a shell, and statues of him now show it too. Some sources say he was promoted to corporal.

  After the war the unit settled in Scotland, and in November 1947 Wojtek went to Edinburgh Zoo, where he lived until he passed away in 1963. Edinburgh unveiled a bronze statue of him in 2015.

  The background shows today's rebuilt Monte Cassino abbey, and the last two frames are photos of memorials, not period photos. The wojak characters are fictional and their lines are dramatized.

  Was he a soldier, a mascot, or a little of both?

