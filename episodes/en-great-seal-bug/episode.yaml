pinned_comment: |
  The Great Seal Bug, nicknamed "The Thing," was a Soviet listening device hidden in a gift to the US ambassador in Moscow. It went undetected for about seven years.

  On August 4, 1945, Soviet Young Pioneers presented a hand-carved wooden Great Seal of the United States to Ambassador W. Averell Harriman, as a gesture of friendship between wartime allies. It hung in the ambassador's study at Spaso House, the official residence.

  Inside was a passive device with no battery and no wires. It worked only when a radio beam from outside energized it, which made it very hard to find. Leon Theremin, the inventor of the theremin instrument, is widely credited with designing it.

  Three more ambassadors lived with the seal. In 1951 a British radio operator reportedly overheard voices from the embassy on a Soviet radio channel. In September 1952, during George Kennan's term, State Department technician Joseph Bezjian traced the voice to the carving.

  On May 26, 1960, Ambassador Henry Cabot Lodge Jr. presented the bug to the UN Security Council as evidence of Soviet spying.

  The wojak characters are fictional and their lines are dramatized.

  Would you have hung it in your study?

