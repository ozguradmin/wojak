# BÖLÜM ŞABLONU — kopyala: python -m wojak new <bolum-id>
# Ölçü kaynağı: docs/STIL.md (30 orijinal reel kare kare ölçüldü). `python -m wojak check` stil denetimi yapar.
#
# KALIP (orijinallerin 26/30'u): AYNI MEKÂNDA İKİ KİŞİ KONUŞUR
#   A hep SOLDA, B hep SAĞDA; her diyalog sahnesinde yalnız o an konuşan görünür.
#   Replikler şimdiki zaman, birinci ağız, günlük dil; anlatıcı/tarih/etiket YOK; nokta ve üç nokta YOK.
#   1. replik = kanca (olay anından bir soru ya da masum/ironik niyet)
#   son diyalog = ters köşe: aynı karakter, aynı kutu, YÜZ VARYANTI + "Bekle, ... neden ...?" tipi fark etme
#   [isteğe bağlı] tek ara kart: yalnız ileri zaman atlaması ("Bir süre sonra", "Birkaç saat sonra")
#   KANIT en sonda: 2-3 gerçek görsel, her biri 1,5 sn; son görsel tercihen Türkçe haber başlığı. Kanıttan sonra hiçbir şey yok.
# SÜRE: toplam 13,5-14,0 sn; tüm süreler 0,5 sn'nin katı; diyalog 2,0-3,0 (ilk sahne 2,5-3,0); kart 1,5; kanıt 1,5.
# GÖRÜNTÜ: tek arka plan fotoğrafı (en fazla 2, ikincisi karttan sonra), renkli, gerçek; zoom/sarsıntı/flaş/karartma/ses efekti YOK.
# KARAKTER: kütüphaneden temiz düz çizim wojak (tools/wojak_site.py, tools/wojak_lib.py, assets/kit/klasik);
#   bakış yönü kayıtlı olsun (python -m wojak yon <png> --yon sag|sol|on) — render içeri çevirir.
#
# Tüm yollar bu klasöre göredir. Karakter: assets/characters/<isim>.png -> img: <isim>

id: sablon
title: "<Olay adı> (Olayı yorumlara yazdım)"

# Kanalın imza sesi (assets/music/ozel/, hesabın reel'lerinden çıkarılır); yoksa sentez yedek kullanılır.
music: kanal

scenes:
  # 1) KANCA — A (sol). Kapak karesi genelde bu sahneden.
  - type: dialog
    duration: 2.5
    bg: img/mekan.jpg
    chars:
      - {img: /home/user/wojak/assets/kit/klasik/sakin.png, side: left}
    text: "Gece yarısı oldu hadi ayin yapalım"

  # 2) CEVAP — B (sağ)
  - type: dialog
    duration: 2.5
    bg: img/mekan.jpg
    chars:
      - {img: karakter_b, side: right}
    text: "Tamam"

  # 3) TERS KÖŞE — B, aynı kutu, yüz varyantı (ör. assets/kit/klasik/terli.png -> cok_terli.png)
  - type: dialog
    duration: 2.5
    bg: img/mekan.jpg
    chars:
      - {img: karakter_b_korku, side: right}
    text: "Bekle, ev neden sallanıyor?"

  # 4-6) KANIT — gerçek görseller; tam genişlik, ortalı, etiket/bant YOK
  - type: evidence
    duration: 1.5
    images: [img/gercek_1.jpg]
  - type: evidence
    duration: 1.5
    images: [img/gercek_2.jpg]
  - type: evidence
    duration: 1.5
    images: [img/haber_basligi.jpg]

caption: |
  <Olay adı> (<yıl>)
  Olayın tamamı sabit yorumda 👇
hashtags: [olay, gizem]

pinned_comment: |
  <Olay adı>, <yıl>'da <yer>'de yaşanan ... (150-250 kelime, ≤ ~1.950 karakter: Instagram'da açıklamanın
  kendisi olur; kronolojik, isim/tarih/yer net, hassas kelimeler otomatik sansürlenir, son satır izleyiciye soru)

# CC BY (ve BY-SA) görseller atıf ister: açıklamalara "Görseller: ..." olarak eklenir
credits: ""             # ör. "Wikimedia Commons CC BY-SA 4.0 — Kullanıcı1; Flickr CC BY 2.0 — Kullanıcı2"
ai_generated: false     # fotogerçekçi yapay zekâ görseli (ör. gorsel_uret arkaplan) varsa true -> etiket hatırlatması

sources:                # doğrulama + görsel kaynak/lisans sayfaları (paylaşılmaz)
  - <kaynak linki 1>
  - <kaynak linki 2>
