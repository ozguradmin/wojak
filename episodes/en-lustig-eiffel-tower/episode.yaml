pinned_comment: |
  Victor Lustig was a con artist, born in Austria-Hungary, who, according to the best-known account, "sold" the Eiffel Tower in Paris in 1925.

  The tower, then 36 years old, was expensive to maintain. In the story, Lustig read about the upkeep problem in a newspaper, had fake government stationery made and posed as a deputy director at the postal ministry. He invited scrap-metal dealers to the Hôtel de Crillon and told them, in secrecy, that the tower would be dismantled and sold for scrap to the highest bidder. There is no sign that the authorities ever planned anything of the kind.

  One businessman reportedly paid, then was too embarrassed to go to the police. Later that year he tried the same trick on new dealers. This time one of them contacted the police, and Lustig fled to the United States. He was caught for counterfeiting in 1935, sent to Alcatraz, and passed away in 1947 at a federal medical center in Springfield, Missouri.

  The best-known version of the sale comes mostly from a 1961 book and later retellings, and some researchers say they found no contemporary French record of it. The tower was never torn down.

  The two wojak characters are fictional; their lines are dramatized. The first image is a 1931 U.S. Justice Department card from a later arrest; the last is a color Photochrom print of the tower from the late 19th century.

  Did a con man really sell the Eiffel Tower, or is it his best story?

