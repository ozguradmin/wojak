pinned_comment: |
  Patrona Halil İsyanı, 1730 yılında İstanbul'da eski yeniçeri Patrona Halil'in önderliğinde çıkan ve III. Ahmed'in tahttan inmesiyle sonuçlanan ayaklanma olarak bilinen bir olaydır.

  Arnavut asıllı Halil'in bir dönem kalyonlarda levent olarak çalıştığı, "Patrona" lakabıyla anıldığı, sonra İstanbul'da seyyar satıcılık ve hamam tellaklığı yaptığı anlatılır. Eylül 1730'un sonunda Beyazıt çevresinde küçük bir grupla başlayan isyan, yeniçerilerin katılmasıyla kısa sürede binlerce kişiye ulaştı. Sadrazam Nevşehirli Damat İbrahim Paşa öldürüldü, 2 Ekim 1730'da III. Ahmed tahtı yeğeni I. Mahmud'a bıraktı.

  Sonraki haftalarda Patrona Halil ve arkadaşları devlet atamalarında söz sahibi oldu. Yeni padişahın çevresi ise bir plan kurdu. 25 Kasım 1730'da Patrona Halil, padişahın huzurunda toplantı yapılacağı, kendisine Rumeli beylerbeyliği verilip hilat (kaftan) giydirileceği söylenerek Topkapı Sarayı'na çağrıldı. Hilatler giydirileceği sırada saklanan adamlar ortaya çıktı; Patrona Halil, yanındaki Muslu Beşe ve yeniçeri ağası Kel Mehmed Ağa'yla birlikte Revan Köşkü civarında öldürüldü. İsyanın başlamasından bu yana yaklaşık sekiz hafta geçmişti.

  Videodaki diyalog canlandırmadır; yol arkadaşı kurgu karakterdir. İlk kanıt Jean Baptiste Vanmour'un "Patrona Halil" tablosu, son kare yine Vanmour'un saraydaki pusuyu anlatan tablosudur; tablo birleşik bir kompozisyondur.

  Kaynaklar: TDV İslâm Ansiklopedisi "Patrona İsyanı"; Aydın, bilig 77 (2016); Afyoncu, Sabah (2023); Britannica.

  Sence Patrona Halil'i yıkan saray tuzağı mıydı, yoksa kendi kazandığı güç mü?

