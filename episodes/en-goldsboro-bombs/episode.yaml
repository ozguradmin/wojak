pinned_comment: |
  The Goldsboro B-52 crash was a 1961 accident near Goldsboro, North Carolina, in which a US Air Force bomber carrying two thermonuclear weapons broke apart in midair. On the night of 23-24 January, the B-52G, on a Strategic Air Command alert mission, was refuelling in the air when a leak was spotted in its right wing. The bomber was ordered back but lost control and broke apart just after midnight. Of eight crew, five landed safely by parachute and three did not survive.

  Both Mark 39 weapons, each rated at about 3.8 megatons (roughly 250 times the Hiroshima device), separated from the aircraft. One weapon's parachute opened and snagged in a tree, leaving it largely intact. The other fell without a parachute and broke apart on impact; its secondary stage was never recovered.

  Neither exploded. In 1969, Sandia National Laboratories safety supervisor Parker F. Jones wrote that "one simple, dynamo-technology, low voltage switch stood between the United States and a major catastrophe." His memo reached the public in 2013 through author Eric Schlosser's Freedom of Information Act request. How many safeguards failed is disputed: sources give figures from three of four to seven of eight, and the account remains debated.

  The archive photo is a US Air Force image of the parachuted weapon, the background is a nearby field as it looks today, and the last frame is a North Carolina historical marker.

  Dramatized: the characters are fictional and the dialogue is invented.

  Do you think one switch is enough?

