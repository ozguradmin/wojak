pinned_comment: |
  The Pig War was a border standoff between the United States and Britain that began on San Juan Island in June 1859 and nearly became a shooting war.

  The 1846 Oregon Treaty ran the border down the middle of a channel, but there were two channels. The Americans said Haro Strait, the British said Rosario Strait, and the San Juan Islands sat in between.

  On June 15, 1859, an American settler, Lyman Cutlar, shot a pig that belonged to the Hudson's Bay Company and kept rooting in his garden. He offered $10; the company's manager, Charles Griffin, wanted $100. British authorities reportedly threatened to arrest Cutlar, though no arrest was ever attempted.

  American settlers asked the U.S. Army for protection. General William Harney sent Captain George Pickett, later famous for Pickett's Charge at Gettysburg, who landed with a company of about 65 soldiers in late July. British warships followed. By late August the Americans had 461 men and 14 cannons. Rear Admiral Lambert Baynes reportedly refused to "involve two great nations in a war over a squabble about a pig".

  Both sides agreed to a joint occupation. In 1872 a commission appointed by Germany's Kaiser Wilhelm I ruled for the United States. The British Royal Marines left English Camp that November; the last American troops left in 1874. No human casualties were recorded: the pig was the only one.

  The wojak characters are fictional and their lines are dramatized.

  Would you have shot the pig?

