pinned_comment: |
  Kurşunlu Mahzen olayı, 1752-1756 yıllarında İstanbul Karaköy'de yaşanan ve Bizans'tan kalma bir kale mahzeninin bir şeyhin manevi görüşü üzerine camiye çevrilmesi olarak anlatılan bir olaydır.

  Mahzen, Bizans'ın Galata'daki Kastellion adlı hisarının altında yer alır. Hisarın ilk yapımı 6. yüzyılın sonlarına tarihlenir; Haliç'e gerilen ünlü zincirin Galata ucunun bu kaleye bağlandığı kabul edilir. Fetihten sonra yapı uzun süre depo olarak kullanıldı ve halk arasında Kurşunlu Mahzen adıyla anıldı.

  Anlatılana göre Şam'daki şeyh Murad Efendi, manevi âlemde Üsküdar'dan Galata'ya uzanan bir köprüden büyük ruhların geçtiğini, Kurşunlu Mahzen'de yatan bazı zatları ziyarete gittiklerini gördü. Oğlu Şeyh Mehmed Efendi 1752'de Şam'dan İstanbul'a gelip bunu saraya bildirdi. Sadrazam Köse Bahir Mustafa Paşa mahzeni elden geçirtti; çalışmalar sırasında kabirlere ulaşıldığı anlatılır. Başka anlatımlar kabirlerin bilinmesini 17. yüzyıla, IV. Murad dönemine bağlar; rivayetler birbirini tutmaz.

  Camideki sandukalar Vehb bin Hüşeyre, Amr bin el-As ve Süfyan bin Uyeyne'ye atfedilir. Rivayete göre Vehb bin Hüşeyre Emevilerin İstanbul kuşatmasında şehit düştü; Amr bin el-As'ın kabri ise Mısır'da, Süfyan bin Uyeyne'ninki Mekke'dedir. Bu yüzden buradaki kabirlerin makam türbesi olduğu düşünülür. Yapı bugün de ibadete açıktır.

  Giriş tabelasında Hicri 1166-1169, Miladi 1753-1756 yazar; Hicri 1166 yılı 1752 sonbaharında başladığı için kaynaklar çevrilmeyi 1752-1756 olarak da verir. Son iki kare tabela ve türbe bölümüdür (2011 fotoğrafları); arka plan caminin iç mekânıdır, iki derviş kurgudur.

  Karaköy'den geçerken merdivenle yerin altına inilen bu camiyi hiç fark ettiniz mi?

  Kaynaklar: TDV İslâm Ansiklopedisi (Mustafa Paşa, Köse); Sağlam, MASROP E-Dergi 18(2), 2024; S. Genim, Kurşunlu Mahzen Köşkü ve Yeraltı Camii.

