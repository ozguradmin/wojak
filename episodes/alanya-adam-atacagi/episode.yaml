# Alanya Kalesi'ndeki Adam Atacağı efsanesi (Antalya). Araştırma notu: /tmp/arastirma/olgular.md (repoya girmez).
# Damar 1 (Türkiye'de gösterilebilir yer + ürkütücü efsane). Alt tür: kale/uçurum infaz efsanesi (önceki 1. damar:
# yeralti-camii-karakoy, yeraltı türbesi; aynı alt tür değil).
# Altın dönem kalıbı C2fa: A ironik umut -> B kuralı ve tehlikeyi söyler -> A geçiştirir -> A aynı kutuda yüz değişir -> 2 kanıt.
# AYNI YER, AYNI AN: İç Kale'nin denize bakan surları.
#   A (hep solda): adsız mahkûm (kurgu). B (hep sağda): adsız kale askeri (kurgu). Gerçek kimseyi temsil etmezler.
# Olgu sınırları (olgular.md):
#   - Efsane: mahkûma üç taş verilir, biri yamaca takılmadan denize ulaşırsa affedilir, ulaşmazsa uçurumdan atılır
#     (Vikipedi/Hoted zinciri; Türkiye Turizm Ansiklopedisi; Kültür Portalı aktarımı). Sonun farklı anlatımları var
#     (çuval, mancınık, sarnıç): videoda ortak payda "uçurumdan atılırsın".
#   - "İmkânsız" kaynakta yok; "çok zor" (Hoted: hava akımı ve yer çekimi) ve "kayalara düşerse suçlu" (VisitAlanya).
#     S4 bu mahkûmun taşının denize ulaşmadığını sorar; genel bir imkânsızlık iddiası yok.
#   - Dönem: efsane Roma (Bakanlık Kültür Portalı, Türkiye Turizm Ansiklopedisi) ya da Bizans (Hoted, Petit Futé)
#     dönemine bağlanır; ekranda dönem yok. İdamın gerçekten yapıldığına dair belge yok: metinde "anlatılana göre".
#   - Görseller Adam Atacağı'nın kendisini değil, kale yarımadasının uçurumunu ve İç Kale'den Cilvarda yönündeki kayalık yamacı gösterir.
# Karakterler: chars/uret.py. Görseller: gorsel.py.
