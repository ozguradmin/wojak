pinned_comment: |
  Adam Atacağı efsanesi, Antalya'nın Alanya ilçesindeki Alanya Kalesi'nde, ölüme mahkûm edilenlere üç taş verildiği ve taşlardan biri denize ulaşırsa cezanın affedildiği anlatılan bir halk anlatısıdır.

  Anlatılana göre Roma ya da Bizans döneminde ölüme mahkûm edilenler kalenin denize bakan uçurumuna getirilirdi. Mahkûmun eline üç taş verilirdi. Taşlardan biri yamaca takılmadan denize ulaşırsa cezası affedilir, ulaşmazsa kendisi uçurumdan aşağı atılırdı. Taşın denize ulaşmasının, aşağıdaki kayalık yamaç ve hava akımları yüzünden çok zor olduğu anlatılır. Efsanenin sonu kaynaklarda farklı aktarılır: bazı anlatımlarda mahkûm bir çuvala konularak atılır, bazılarında mancınıkla denize fırlatılır, bazılarında ise sarnıca atılır.

  Bizans döneminde Kalonoros diye anılan kale, 1221'de Anadolu Selçuklu Sultanı I. Alâeddin Keykubad tarafından alınmış, şehir Alâiye adını almıştı. Bugün Adam Atacağı diye anılan yer, kalenin denizden yaklaşık 250 metre yükseklikteki İç Kale bölümünde, uçurumun kenarındadır; resmî kayıtlarda 13. yüzyıldan kalma bir Selçuklu su sarnıcıdır.

  Burada gerçekten idam yapıldığına dair bir belge gösterilmemiştir; hikâye halk anlatısı olarak yaşar. Videodaki kareler kale yarımadasının uçurumlarını ve dibindeki kayalıkları gösterir; Adam Atacağı'nın tam altı değildir.

  Sence o üç taştan biri denize ulaşabilir miydi?

