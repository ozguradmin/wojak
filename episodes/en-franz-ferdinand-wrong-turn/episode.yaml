ek_maddeler:
  - "**Dramatization:** the two characters are fictional; the dialogue is invented and does not quote anyone. A stands for an official in the motorcade, B for the driver; neither represents a real person. Sources agree the drivers were not properly told about the new route, that the lead car turned and the archduke's car followed, and that Potiorek called out the mistake; the exact words are not documented, so none are quoted."
  - "**Source caution:** the popular sandwich story is NOT used (Smithsonian, History.com and Wikipedia find no contemporary evidence). Accounts differ on the time of the shots (about 10:45-11 a.m.), the distance to the assassin, the number of cars and wounded, whether the engine stalled (sources say stopped), and whether the assassin had given up for the morning; the video and text avoid all of these. The 1914 background does not exist as a free photo, so the background is the Latin Bridge as it looks today (the building at left is the Museum of Sarajevo, the former delicatessen)."
  - "Suggested first comment: the corner is now a museum; the car is in Vienna."

