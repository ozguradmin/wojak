ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (a pirate captain and Caesar); the dialogue is invented and is not a documented quote. Documented (Plutarch, Life of Caesar 2.1-2.7): the pirates asked twenty talents, Caesar laughed and agreed to fifty, he often threatened to hang them all while they thought he was joking, then fitted out ships at Miletus and had the captured pirates crucified."
  - "**Left out on purpose:** the year (about 75 BC per Suetonius; some modern writers say 80 BC), the voyage's purpose (Rhodes per Suetonius, return from Bithynia per Plutarch), the governor's name, the claim that he first had their throats cut (Suetonius 74, not Plutarch), Polyaenus's poisoned-banquet version, and any dollar value for a talent. The costume of the pirate is a tricorn hat for recognisability, not period-correct."
  - "The first evidence image is a modern model of a trireme (a generic ancient warship, not Caesar's actual ships); the final frame is a Roman silver denarius from 47-46 BC (decades after the events), used because it names him. The background is the ancient harbour area of Miletus, where Caesar manned his ships, not the island of Pharmacusa (no free photograph of it was found; Commons searches: Farmakonisi, Pharmakonisi, Pharmacusa)."
  - "Suggested first comment: 'Actually Suetonius says he had their throats cut first, as a mercy.' Answer: yes, Suetonius (Divus Julius 74) adds that; Plutarch does not, so the video and text leave it out."
  - "Licence note: the Miletus background (CC BY-SA 3.0) and the trireme photo (CC BY-SA 2.0 fr) are ShareAlike; credits carry licence and file-page links. Whether the video itself needs a ShareAlike licence is the channel owner's call."

