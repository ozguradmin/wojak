ek_maddeler:
  - "**Dramatization:** the two characters are fictional roles (Hubert and an examiner); the dialogue is invented and is not a documented quote. What is documented: Hubert confessed, said he had put a fire-ball in at a window of the bakery, and the baker's household swore there was no such window (Pepys, 24 Feb 1666/67, shown in the last frame)."
  - "**Hedged or left out on purpose:** execution date (27 Oct per BL, Museum of London, Executed Today; 29 Oct per some sources), court (Old Bailey vs Middlesex sessions), when the ship captain gave his statement (after the hanging per Museum of London, 'years later' per Wikipedia), when the ship reached London (31 Aug per one source), torture, accomplices, Hubert's religion, the Monument inscription. 'Clearly innocent' is not claimed; the text says historians widely accept the confession was false."
  - "Pepys does NOT call Hubert a wretch or mad in the diary; 'poor distracted wretch' is Lord Clarendon's phrase and is not used. Pepys wrote that Hubert 'did not speak like a madman'."
  - "Suggested first comment: the Monument's inscription blamed Catholic plotters until it was removed in 1830. The Pepys page also carries a footnote quoting Burnet that Hubert was hanged on no other evidence than his own confession."

