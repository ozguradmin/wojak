pinned_comment: |
  The Great Fire of London began shortly after midnight on Sunday, 2 September 1666, in Thomas Farriner's bakery on Pudding Lane.

  With the city looking for someone to blame, a young Frenchman from Rouen named Robert Hubert confessed to starting it. His first story put the fire in Westminster, where the flames never reached. His second said he had pushed a fire-ball through a window of the bakery. The baker and his household swore there was no such window. Samuel Pepys wrote about the contradiction in his diary in February 1667, noting that Hubert had been hanged "by his own confession." According to the British Library, the only support for the confession was that he could lead officials to the bakery site.

  Hubert was executed at Tyburn on 27 October 1666. According to the Museum of London, the Lord Chief Justice told King Charles II that he did not believe a word of the confession, and the captain of the ship that had brought Hubert to London reported that he had not gone ashore until two days after the fire began. Historians widely accept that the confession was false, though sources disagree on details such as when the captain spoke.

  The last two frames: page 195 of Pepys's diary in the 1893 Wheatley edition, and the plaque near Pudding Lane marking the site of the bakery (spelled Faryner there). The wojak characters and dialogue are fictional.

  Why would someone confess to something they didn't do?

credits: "Great Fire London, unknown artist, 1675, public domain, via Wikimedia Commons (cropped, brightened, softened); Thomas Faryner shop plaque, Pudding Lane, photo by Acabashi, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0), via Wikimedia Commons, commons.wikimedia.org/wiki/File:Thomas_Faryner_shop_plaque_Pudding_Lane_City_of_London_England.jpg (cropped); The diary of Samuel Pepys, ed. Henry B. Wheatley, vol. 6 (London, 1893), p. 195, public domain, via Internet Archive (cropped)."

