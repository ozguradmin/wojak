pinned_comment: |
  Project Habakkuk was a British Second World War plan to build an aircraft carrier out of ice. The inventor Geoffrey Pyke proposed a floating island made of pykrete, a mix of roughly 14 percent wood pulp and 86 percent ice, to cover the mid-Atlantic gap where U-boats hunted convoys beyond the reach of land-based planes. Winston Churchill backed the idea in December 1942. The full ship was planned at about 2,000 feet long and around two million tons, with a refrigeration system to keep the ice frozen.

  At the Quebec Conference in August 1943, Lord Louis Mountbatten reportedly fired a revolver at a block of ice, then at a block of pykrete. In the retelling, a bullet ricocheted and buzzed past the officers' legs. Accounts disagree on who fired, who was grazed and even where: one account, by the scientist Max Perutz, places a similar ricochet in London, not Quebec.

  A 60-foot test model was built on Patricia Lake in Alberta in 1943. Most accounts say it was made of plain lake ice, and that it took months to years to melt once the cooling was switched off. In September 1943 the U.S. Navy sent President Roosevelt a secret memo on the Habbakuk schemes (the last frame). By late 1943 it was judged impractical and dropped.

  The wojak characters are fictional and their lines are dramatized.

  Would you have sailed on a warship made of ice?

