# Konstantinopolis (bugünkü İstanbul), 18 Ocak 532: Nika İsyanı'nın son günü. İsyancılar Hipodrom'da Hypatios'u imparator
# ilan etti; Belisarios ve Mundus'un askerleri Hipodrom'a iki yandan girdi; Prokopios'a göre o gün halktan 30.000'den fazla
# kişi öldü. Araştırma notu: /tmp/arastirma/olgu.md (repoya girmez). Damar 2 (Türkiye'de gösterilebilir yerde tarihî
# facia); önceki tr bölümü demre-noel-baba-kemik-1087 (damar 1, mezar).
# İskelet C2fa (dramatik ironi): A söylentiyi getirir (Ayasofya yandı, imparator kaçıyor) -> B uyarır (sarayda asker var)
# -> A geçiştirir ("binlerce kişiyiz") -> kart -> A aynı kutuda şok yüzüyle askerlerin iki yandan girdiğini fark eder
# -> 2 kanıt (Hipodrom'un yeri bugün; son kare Prokopios'un sayfası: "more than thirty thousand").
# AYNI YER, AYNI AN: Hipodrom tribünü. A (hep solda) ve B (hep sağda) adsız isyancılar (kurgu), gerçek kimseyi temsil etmez.
# Olgu sınırları (olgu.md):
#   - Eski Ayasofya 13-14 Ocak gecesi yandı (TDV, Bury) -> 18 Ocak'ta "kül olmuş" (geçmiş), "yanıyor" DEĞİL.
#   - Kalabalığa imparatorun kaçtığı söylendi (Malalas çizgisi, söylenti; yanlıştı) -> "-mış" ile söylenti.
#   - Belisarios ve Mundus'un askerleri sarayda; Hipodrom sarayın bitişiğinde (Prokopios) -> S2 "sarayda hâlâ asker var".
#   - Askerler iki yandan girdi; Mundus "Ölüm Kapısı"ndan (Prokopios I.24; Bury "between two fires") -> S4.
#   - "Kapılar kapatıldı", "gemiler hazırdı", "taç giydirdiler" KULLANILMAZ (belgesiz; taç yerine altın kolye).
