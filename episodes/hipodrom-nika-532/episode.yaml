pinned_comment: |
  Nika İsyanı, 532 yılında Konstantinopolis'te (bugünkü İstanbul) yaşanan ve kentin tarihindeki en kanlı ayaklanmalardan biri olarak bilinen bir olaydır. Hipodrom'da araba yarışlarını izleyen rakip Mavi ve Yeşil taraftarlar, 13 Ocak'ta İmparator I. Justinianus'a karşı birleşti ve "Nika" yani "Yen!" diye bağırdı.

  Çıkan yangınlarda şehrin büyük bölümüyle birlikte dönemin Ayasofya'sı da yandı. İsyancılar 18 Ocak'ta eski imparator Anastasios'un yeğeni Hypatios'u, taç bulamadıkları için başına altın bir kolye koyarak imparator ilan etti ve Hipodrom'da tahta oturttu. Hipodrom'daki kalabalığa imparatorun kaçtığı haberi ulaştı; bu yanlış çıktı.

  Prokopios'a göre sarayda Justinianus gemiyle kaçmayı düşündü; İmparatoriçe Theodora kalmalarını istedi ve "İmparatorluk güzel bir kefendir" dedi. Malalas'a göre Narses Mavilerin bir kısmına para dağıttı; kalabalık bölünüp birbirine girdi.

  Aynı gün Belisarios ve Mundus'un askerleri Hipodrom'a iki yandan girdi; Mundus'un adamları Bizanslıların "Nekra" dediği kapıyı kullandı. Prokopios'a göre o gün halktan 30.000'den fazla kişi öldürüldü; Malalas yaklaşık 35.000 der. Videonun son karesi, Prokopios'un "Savaşlar" kitabının 1914 tarihli İngilizce çevirisinden (H. B. Dewing) bu anı anlatan sayfadır; sayfanın alt kısmında İngilizce "that day more than thirty thousand" (o gün otuz binden fazla) ifadesi geçer.

  Bugünkü Ayasofya bu isyandan sonra yapıldı; 532'de başlandı, 537'de açıldı. Hipodrom'un yeri bugün Sultanahmet Meydanı'dır.

  Sizce o gün Hipodrom'da toplananlar, karşılarına neyin çıkacağını tahmin edebilir miydi?

